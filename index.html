  <title>Task Manager - GTD 과제관리</title>
  <!-- ★CDN exact pin(2026-07-25 소유자 지시) — bare major(`@18`·`@7`)는 **버전 고정이 아니다**.
       unpkg 의 major URL 은 302 리다이렉트 + `max-age=60` 이라 새 패치/마이너가 나오면 **1분 안에** 전 사용자에게
       자동 승급된다(반면 exact URL 은 `max-age=31536000` = 사실상 불변). 6/17 전체 백지 사고가 정확히 이 기전
       (`@babel/standalone` 비고정 → v8 자동승급 → automatic JSX runtime 이 import 방출 → UMD 에서 백지)이었고,
       그때 `@7` 로 major 만 막은 것은 **같은 사고를 한 자릿수 좁힌 것이지 없앤 게 아니다**.
       고정 시점 실측: `@18`→18.3.1, `@7`→7.29.7 로 해석되며 exact URL 과 **바이트 동일**(sha256 대조) →
       이 고정은 동작 변경 0. babel 7.29.7 은 CI 핀(`@babel/core@7.29.7`, pages.yml)과 **정확히 일치**한다.
       ⚠ 승급은 **의도적으로만** — 이 줄의 버전을 직접 올릴 것. build.js 스모크가 bare major 재발을 차단한다.
       ※babel 태그는 배포본에서 build.js 가 제거하므로 프로덕션 무영향(원본 파일을 직접 열 때만 사용). -->
  <!-- ★SRI(integrity) 2단 방어(2026-07-25 소유자 지시) — exact pin 과 **다른 층**이다.
       exact pin = "무엇을 주문할지" 고정 / SRI = "받은 게 진짜인지" 확인.
       주소가 맞아도 CDN 이 침해되면 다른 내용물이 올 수 있고(2024 polyfill.io: 도메인 매각 후
       10만+ 사이트에 악성코드 배포·각 사이트는 코드 한 줄 안 바꿨는데 감염), 브라우저는 그걸 그냥 실행한다.
       integrity 가 있으면 지문 불일치 시 **실행을 거부**한다. 이 앱은 구글 로그인 토큰 + 개인 데이터
       (루틴·메모·회고) 전체에 접근 가능한 컨텍스트라, 여기 들어온 코드는 앱과 동등한 권한을 갖는다.
       ⚠ 버전을 올리면 **integrity 도 반드시 같이** 갱신할 것 — 안 하면 브라우저가 실행을 거부해
       6/17 과 같은 백지 증상이 된다. `verify-sri.js` 가 배포 前 실파일과 대조해 이 실수를 차단한다.
       해시 출처: unpkg 와 jsdelivr(독립 미러)에서 받은 파일의 sha384 가 **일치**함을 대조 확인. -->
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-ezQ6HS3FLspd9te19o2McUV6FAK091+GG7KO54f/R8DKgCDi7fULhapNrd5LY+vG" src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

  <!-- Firebase (Auth 로그인). compat 빌드 = 빌드툴 없이 전역 firebase 사용.
       (2026-07-31) 파일 첨부 배선 전량 제거 — 생애 1건 사용 후 50일 0건, RTDB /files 비어 있음. -->
  <!-- ★firebase 도 SRI(2026-07-25): react 만 봉인하고 여기를 열어두면 문이 반만 닫힌다 —
       같은 페이지에서 실행되는 이상 권한은 동일하다. gstatic 은 구글 직영이라 unpkg 보다 침해가
       훨씬 어렵지만, 비용이 같으니 막는다. `crossorigin` 은 SRI 필수 조건이며 gstatic 이
       `Access-Control-Allow-Origin: *` 를 주는 것을 확인하고 추가했다(안 주는데 붙이면 로드가 깨진다).
       한계(정직): npm 미러가 있는 react 와 달리 gstatic 빌드는 **독립 대조처가 없어**,
       반복 fetch 재현성만 확인했다(=지금 서빙되는 것을 고정한 것이지 '정본'과 대조한 게 아님). -->
  <script crossorigin="anonymous" integrity="sha384-sEVIly94UBRLKWdkYoPpSG7GD/e79YHMrxVyZaOk712Ga7+EAw6w1EFi+xBzBdd+" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script crossorigin="anonymous" integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @media (max-width: 640px) {

      .tab-bar::-webkit-scrollbar { display: none; }

      .form-row { flex-direction: column !important; gap: 8px !important; }
      .form-row input, .form-row select, .form-row button { width: 100% !important; min-height: 40px; flex: none !important; box-sizing: border-box !important; }
      .form-row > div { width: 100% !important; flex-direction: column !important; }
      .form-row > div > * { width: 100% !important; flex: none !important; box-sizing: border-box !important; }
      .form-row .star-btn { width: 40px !important; }
      .task-row { padding: 10px 8px !important; }
      /* ★손잡이는 휴대폰에서도 보인다(2026-09-07): 순서변경의 유일한 잡는 자리다.
         옛 규칙은 display:none 이라, 터치로는 시작조차 안 되는 옛 방식 위에 손잡이마저 감춰 두었다. */
      .hdr-wrap { flex-direction: column; gap: 8px; align-items: flex-start !important; }
      .plan-fields { flex-direction: column !important; }
      .plan-fields > * { width: 100% !important; flex: none !important; box-sizing: border-box !important; }

      .modal-content input, .modal-content select, .modal-content textarea { width: 100% !important; box-sizing: border-box !important; }
      .modal-content .plan-fields > * { width: 100% !important; }
      .modal-row { flex-direction: column !important; gap: 8px !important; }
      .modal-row > div { width: 100% !important; }
    }
    @media (hover: none) and (pointer: coarse) {
      .task-actions { display: flex !important; opacity: 0.6; }
      .task-actions:active { opacity: 1; }
      button, select { min-height: 36px; }
    }

<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

/* ─── 상수 ─── */
const STATUSES = {
  action: { label: "다음행동", color: "#3B82F6", bg: "#EFF6FF", icon: "🔵" },
  waiting: { label: "대기중", color: "#F59E0B", bg: "#FFFBEB", icon: "⏳" },
  someday: { label: "나중에", color: "#9CA3AF", bg: "#F9FAFB", icon: "💤" },
  done: { label: "완료", color: "#10B981", bg: "#ECFDF5", icon: "✅" },
};
const SK = Object.keys(STATUSES).filter(k => k !== "done" && k !== "someday"); /* ★2026-07-04: 나중에(someday) 상태 폐지 — 미룸=미래 수행날짜, 막연한 백로그=날짜 없음. 대기중 유지. (STATUSES[someday]는 옛 데이터 안전 렌더용으로 정의만 남김) */
/* 업무 채널 마커(🧠🎯✍️) 폐지(2026-06-26) → develop 버킷(지식·교훈·글감, kind:bucket)으로 대체. MARKERS 상수 제거(2026-06-28, 회고탭 재구성으로 마지막 참조 소멸). 예측은 폐지. */

const TABS_BY_WS = {
  /* ★2026-09-14 소유자 결정 — 루틴 탭과 유형별 탭을 하나로 합쳤다.
     같은 「영어」가 루틴 탭(스트립·메모·주간루틴·반복설정)과 유형별 탭에 쪼개져 있어 전체를 보는 자리가 없었다.
     이제 카드 하나에 그 영역의 세션·할일·메모가 다 들어온다. 두 워크스페이스가 같은 구조를 쓰고 이름만 다르다. */
  work: [
    { id: "today", label: "오늘", icon: "⭐" },
    { id: "areas", label: "과제", icon: "📁" },
    { id: "history", label: "히스토리", icon: "📜" },
  ],
  personal: [
    { id: "today", label: "오늘", icon: "⭐" },
    { id: "areas", label: "영역", icon: "📂" },
    { id: "history", label: "히스토리", icon: "📜" },
  ],
};

/* 로컬 시간 기준 오늘 날짜 (UTC가 아닌 KST 등 현지 시간) */
let TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
/* 자정 경과 시 자동 갱신 — ★리로드 前 대기중 저장 flush(2026-07-04)
   ★복귀 시에도 확인(2026-09-07): 모바일 브라우저는 **배경으로 내려간 탭의 타이머를 멈춘다**.
      60초 주기만 두면 앱을 나가 있는 동안 자정을 놓치고, 돌아와도 TODAY 가 옛 날짜로 남아
      이월이 다시 돌지 않는다. 앱으로 돌아오는 순간 다시 본다. */
const checkDayRollover = async () => {
  const d = new Date();
  const now = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  if (now === TODAY) return;
  TODAY = now;
  try { await flushCloudSave(); } catch {}
  window.location.reload();
};
setInterval(checkDayRollover, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkDayRollover(); });
window.addEventListener("focus", checkDayRollover);
/* ★탭 닫기/숨김 시 대기중 저장 flush(2026-07-04, best-effort keepalive) */
window.addEventListener("pagehide", () => { try { flushCloudSave(); } catch {} });
const gid = () => Math.random().toString(36).slice(2, 9);
const fd = (d) => { const t = new Date(d); return `${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,"0")}.${String(t.getDate()).padStart(2,"0")}`; };
const diffDays = (dateStr) => {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const today = new Date(TODAY + "T00:00:00");
  return Math.round((target - today) / 86400000);
};
const deadlineInfo = (dateStr) => {
  const d = diffDays(dateStr);
  if (d === null) return null;
  if (d < 0) return { label: `${-d}일 초과`, color: "#DC2626", bg: "#FEF2F2", icon: "🔴" };
  if (d === 0) return { label: "오늘 마감", color: "#EA580C", bg: "#FFF7ED", icon: "🟠" };
  if (d <= 7) return { label: `D-${d}`, color: "#D97706", bg: "#FFFBEB", icon: "🟡" };
  return { label: `D-${d}`, color: "#6B7280", bg: "#F3F4F6", icon: "" };
};


/* ─── Firebase (Auth 로그인 + Realtime DB 동기화 + Storage 파일) ─── */
/* ▼▼▼ Firebase 콘솔 > 프로젝트설정 > 웹앱 config 을 여기에 붙여넣기 ▼▼▼
   apiKey / messagingSenderId / appId 만 채우면 됨 (나머지는 taskmgr-sync 고정값).
   storageBucket 은 콘솔 값 그대로 (보통 taskmgr-sync.appspot.com 또는 .firebasestorage.app). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCzx9YiZhjEF5RQB3m48zqa8k8eUMTI8b8",
  authDomain: "taskmgr-sync.firebaseapp.com",
  databaseURL: "https://taskmgr-sync-default-rtdb.firebaseio.com",
  projectId: "taskmgr-sync",
  storageBucket: "taskmgr-sync.firebasestorage.app",
};
/* ▲▲▲ config 끝 ▲▲▲ */
/* config 미입력(PASTE_) 상태면 인증 비활성 = 기존 공개모드 그대로 동작(앱 안 깨짐). */
const FB_CONFIGURED = !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE");
if (FB_CONFIGURED && window.firebase && !firebase.apps.length) {
  try { firebase.initializeApp(FIREBASE_CONFIG); } catch (e) { console.error("[Firebase init]", e); }
}
const fbAuth = () => (FB_CONFIGURED && window.firebase && typeof firebase.auth === "function") ? firebase.auth() : null;
const fbUser = () => { try { return fbAuth()?.currentUser || null; } catch { return null; } };

const fbDataUrl = () => "https://taskmgr-sync-default-rtdb.firebaseio.com/" + WS.fbPath + ".json";
/* 로그인 상태면 ID 토큰을 ?auth= 로 붙여 인증 (잠근 DB 통과). 미로그인/미설정이면 빈 문자열=공개모드. */
const authParam = async () => {
  try { const u = fbUser(); if (u) return "?auth=" + await u.getIdToken(); } catch {}
  return "";
};

/* ★기기 계측(P0·2026-07-17·PDS §14.8 ⑤): "미동기가 회사 PC 에서만 나나?" 는 **기기 식별자가 없어 판정 불가**였다(§14.8 ③).
   프록시 차단·GAS 콜드스타트·탭 닫힘·네트워크 글리치가 전부 동일 지문(savedAt 은 갱신됐는데 calEventId 만 빔)을 남겨 비진단적.
   → devId(기기) + failMode(왜) 두 축을 심어 1주 관측으로 실증한다. ★관측 전 원인 단정 금지.
   저장은 **blob 안**(/personal·/data)에만 — RTDB 규칙(SECURITY_SETUP.md §2)이 data·personal·files·calToken 4개만 잠그고
   catch-all 이 없어 **기본 거부** → /calFailures 같은 신규 최상위 경로는 앱(idToken)이 못 쓴다(2026-07-17 실측 401).
   blob 하위는 규칙이 상속되므로 소유자의 Firebase 콘솔 수동작업 0. */
const DEV_ID = (() => {
  try {
    let d = localStorage.getItem("tm-devid");
    if (!d) { d = "d_" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); localStorage.setItem("tm-devid", d); }
    return d;
  } catch { return "eph_" + Math.random().toString(36).slice(2, 8); } /* localStorage 막힌 환경(L1896 주석) → 세션 한정 id. 무기록보다 나음 */
})();

/* ★2026-09-14 — 외부 소유 필드 보존(applySwept/preserveForeign) 철거.
   그 장치가 지킨 필드는 `sweptThrough` 하나뿐이었는데 소유자 결정으로 그 기전 자체를 폐기했다
   (한 번도 접힌 적이 없었다 · 실측 2026-09-14). 이제 앱이 읽기만 하는 필드가 없으므로 PUT 직전
   클라우드 재조회도 필요 없다 — 저장 경로가 왕복 하나만큼 짧아진다. */

/* ★★결함 B 근본 해결(2026-07-26·PDS §14.7): **통째 PUT → 바뀐 키만 PATCH**.
   지금까지 저장은 blob 전체를 PUT 했다 → 앱이 안 건드린 키까지 매번 덮어써서, 로드 후 외부 도구가 쓴 값이
   그 탭의 다음 저장에 통째로 되돌아갔다(= 결함 B). PATCH 는 **본문에 없는 키를 건드리지 않으므로**,
   앱이 손대지 않은 키는 아예 쓰지 않는다 = 경쟁 자체가 사라진다(구조적 차단·경쟁창 0).
   ★ETag 조건부 PUT(if-match)은 **브라우저에서 불가**로 실측 확인(2026-07-26): RTDB 응답에
     `Access-Control-Expose-Headers` 가 없어 fetch 가 ETag 헤더를 읽지 못한다(서버측 백스톱은 가능 → 거기선 계속 사용).
     Firebase SDK 트랜잭션은 firebase-database-compat 추가가 필요해 CDN 의존 1개 증설(6/17 백지 사고 클래스) → 채택 안 함.
   ★실측 검증한 PATCH 의미론(scratch 경로·2026-07-26): 본문에 없는 키 불변 / `null`=삭제 / 빈 배열·빈 객체=키 삭제(PUT 과 동형) / 빈 본문 `{}`=200 no-op.
   ★잔여: **같은 키를 동시에** 쓰면 그 키는 여전히 통째 교체된다(앱과 /sweep 이 같은 반복을 동시에 고치는 경우)
   ★기준선(_syncBase)=**'우리가 아는 클라우드의 내용'**. 로드/저장 성공 시 갱신. 없으면 통째 PUT 으로 안전 폴백. */
/* ★"files" 제외(2026-07-31·첨부 제거): 앱이 더는 이 키를 소유하지 않는다 → PATCH 대상에서 빠져
   **건드리지 않는다**(RTDB blob 에 옛 키가 남아 있어도 삭제하지 않음 — 비파괴). */
const SYNC_OWNED = ["tasks", "projects", "history", "recurrings", "savedAt", "lastWriter"];
/* ★비교는 반드시 **정규화(canonical)** 로 — E2E 가 잡은 결함(2026-07-26): RTDB 는 객체 키를 **정렬해서** 돌려주는데
   `JSON.stringify` 는 삽입순서를 보존한다 → 내용이 같아도 문자열이 달라 전 키가 '바뀜'으로 오판되고,
   그러면 안 바뀐 키까지 다시 보내 이 설계의 목적(경쟁창 0)이 통째로 무력화된다. 키를 정렬해 직렬화한다. */
const canonJson = (v) => {
  if (v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return "[" + v.map(canonJson).join(",") + "]";
  return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canonJson(v[k])).join(",") + "}";
};
/* RTDB 는 빈 배열·빈 객체·null 을 **저장하지 않는다**(실측) → 로컬의 [] / {} 와 클라우드의 '키 없음'은 같은 상태다.
   이걸 구분하면 매 저장마다 헛된 삭제 write 가 나간다. */
const emptyish = (v) => v === null || v === undefined
  || (Array.isArray(v) && v.length === 0)
  || (typeof v === "object" && !Array.isArray(v) && Object.keys(v).length === 0);
let _syncBase = null;    /* { key: 정규화 문자열 } — 최상위 변경 감지용 */
let _syncBaseRaw = null; /* 기준선 전체의 JSON 문자열 — 필드 단위 diff 용(참조가 아니라 **문자열**로 보관:
                            상태 객체를 참조로 들고 있으면 어딘가 in-place 변형이 일어날 때 기준선이 같이 움직여
                            변경을 놓친다 = 조용한 유실. 문자열이면 그 위험이 원천 차단된다. 파싱 비용은 저장당 1회). */
const setSyncBase = (obj) => {
  try {
    const b = {}; for (const k of Object.keys(obj || {})) b[k] = canonJson(obj[k]);
    _syncBase = b; _syncBaseRaw = JSON.stringify(obj || {});
  } catch { _syncBase = null; _syncBaseRaw = null; } /* 직렬화 실패(순환참조 등) → 기준선 포기 = 다음 저장은 통째 PUT(안전측) */
};

/* ★★필드 단위 PATCH(2026-07-26·PDS §14.7): RTDB PATCH 는 `"history/12/items/9"` 같은 **경로 키**를 받는다.
   최상위 키 단위로만 보내면 그 키를 건드리는 순간 **키 전체가 통째 교체**돼, 같은 키의 다른 필드에 들어온
   외부 write 가 사라진다(예: 사용자가 할일을 체크하는 순간 /sweep 이 history 의 메모를 정제 → 정제분 소실).
   → 실제로 바뀐 **잎(leaf)** 만 보낸다. 부수 효과로 페이로드가 수백 KB → 수백 B 로 줄어든다(매 저장 history 전량 업로드 중단).
   ★안전 규약(이 코드의 존재 이유): 만든 패치를 **기준선에 실제로 적용해보고**(applyUpdates) 의도한 결과와
     canonical 일치할 때만 채택한다. 불일치·상한 초과·RTDB 금지문자 키·경로 겹침이면 **그 키만 통째 교체로 폴백**.
     즉 이 diff 에 버그가 있어도 결과는 '폴백'이지 '손상'이 아니다. */
const DP_CAP = 300;                       /* 경로 수 상한 — 넘으면 통째 교체가 더 싸고 안전 */
const DP_BADKEY = /[.#$/[\]]/;            /* RTDB 경로에 쓸 수 없는 문자 */
const isPlainObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const dpJoin = (p, k) => (p ? p + "/" + k : String(k));
/* base→cur 로 가는 잎 단위 갱신을 out.u 에 모은다. 상한 초과·불가 키면 false(=폴백 신호). */
const deepDiff = (base, cur, prefix, out) => {
  if (out.n > DP_CAP) return false;
  if (canonJson(base) === canonJson(cur)) return true;
  const bothArr = Array.isArray(base) && Array.isArray(cur);
  const bothObj = isPlainObj(base) && isPlainObj(cur);
  if (!bothArr && !bothObj) { out.u[prefix] = cur; out.n++; return out.n <= DP_CAP; } /* 잎 or 타입 변경 → 이 지점 통째 */
  if (bothArr) {
    for (let i = 0; i < cur.length; i++) {
      if (i >= base.length) { out.u[dpJoin(prefix, i)] = cur[i]; out.n++; }
      else if (!deepDiff(base[i], cur[i], dpJoin(prefix, i), out)) return false;
      if (out.n > DP_CAP) return false;
    }
    for (let i = cur.length; i < base.length; i++) { out.u[dpJoin(prefix, i)] = null; out.n++; } /* 줄어든 꼬리 삭제 */
    return out.n <= DP_CAP;
  }
  for (const k of Object.keys(cur)) {
    if (DP_BADKEY.test(k)) return false;
    if (!Object.prototype.hasOwnProperty.call(base, k)) { out.u[dpJoin(prefix, k)] = cur[k]; out.n++; }
    else if (!deepDiff(base[k], cur[k], dpJoin(prefix, k), out)) return false;
    if (out.n > DP_CAP) return false;
  }
  for (const k of Object.keys(base)) {
    if (Object.prototype.hasOwnProperty.call(cur, k)) continue;
    if (DP_BADKEY.test(k)) return false;
    out.u[dpJoin(prefix, k)] = null; out.n++;
  }
  return out.n <= DP_CAP;
};
/* RTDB 다중경로 갱신을 로컬에서 재현 — 자기검증용. null=삭제, 빈 컨테이너=삭제(RTDB 실측 의미론). */
const applyUpdates = (root, updates) => {
  const r = JSON.parse(JSON.stringify(root === undefined ? null : root));
  const box = { v: r };
  for (const path of Object.keys(updates)) {
    const segs = path.split("/");
    let node = box, key = "v";
    for (const s of segs) {
      if (node[key] === null || typeof node[key] !== "object") node[key] = {};
      node = node[key]; key = s;
    }
    node[key] = updates[path];
  }
  return box.v;
};
/* RTDB 는 null·빈 배열·빈 객체를 저장하지 않는다 → 비교 전에 같은 규칙으로 정규화. 배열의 꼬리 null 은 잘라낸다. */
const dpNormalize = (v) => {
  if (Array.isArray(v)) {
    const a = v.map(dpNormalize);
    while (a.length && (a[a.length - 1] === null || a[a.length - 1] === undefined)) a.pop();
    return a.length ? a : null; /* ★빈 배열 = RTDB 가 저장하지 않음 = '없음'. 빈 객체와도 **같은 상태**다 —
                                   둘을 구분하면 자기검증이 의미 없는 차이로 실패해 매번 통째 폴백한다(속성테스트 92/1500 적발). */
  }
  if (isPlainObj(v)) {
    const o = {};
    for (const k of Object.keys(v)) { const x = dpNormalize(v[k]); if (x !== null && x !== undefined) o[k] = x; }
    return Object.keys(o).length ? o : null; /* 빈 객체도 동일 */
  }
  return v === undefined ? null : v;
};
/* 경로가 서로 조상/자손이면 RTDB 가 거부한다 → 사전 차단(재귀 구조상 안 나오지만 계약을 코드로 못박음). */
const dpOverlaps = (paths) => {
  const s = [...paths].sort();
  for (let i = 1; i < s.length; i++) if (s[i] === s[i - 1] || s[i].startsWith(s[i - 1] + "/")) return true;
  return false;
};
const resetSyncState = () => { _syncBase = null; }; /* ★워크스페이스 전환 = 다른 blob → 기준선 폐기(E2 클래스 방지) */
/* 보낼 변경분만 추린다. null=기준선에 없음(=기준 모름) → 호출측이 통째 PUT. */
const diffForPatch = (data) => {
  if (!_syncBase || !data) return null;
  const out = {};
  try {
    const EMPTY = new Set([undefined, "null", "[]", "{}"]); /* 클라우드에 '없음'과 동치인 정규화 표현 */
    for (const k of Object.keys(data)) {
      const cur = canonJson(data[k]);
      const was = _syncBase[k];
      if (cur === was) continue;
      if (emptyish(data[k]) && EMPTY.has(was)) continue; /* 둘 다 '비어있음' = 같은 상태(헛된 write 방지) */
      out[k] = data[k];
    }
    /* 앱이 **소유한** 키인데 이번 데이터에 없음 = 삭제 의도(PUT 의 '키 누락=삭제'를 재현).
       ★소유 목록 밖의 키(외부 도구가 blob 에 심은 것)는 **절대 건드리지 않는다** — 이게 통째 PUT 보다 나은 지점. */
    for (const k of SYNC_OWNED) {
      if (!Object.prototype.hasOwnProperty.call(data, k) && !EMPTY.has(_syncBase[k])) out[k] = null;
    }
    return refineToLeafPaths(out); /* ★최상위 키 교체 → 실제 바뀐 잎만으로 정련(검증 통과 시에만) */
  } catch { return null; }
};
/* 최상위 키 통째 교체를 **잎 경로 갱신**으로 낮춘다. 키마다 독립 판정 — 한 키가 폴백해도 나머지는 이득을 본다.
   ★채택 조건: deepDiff 성공 + 경로 겹침 없음 + **기준선에 적용한 결과가 의도값과 canonical 일치**. 하나라도 어긋나면 그 키는 통째 교체(=오늘 동작). */
const refineToLeafPaths = (whole) => {
  let baseObj = null;
  try { baseObj = _syncBaseRaw ? JSON.parse(_syncBaseRaw) : null; } catch { baseObj = null; }
  if (!baseObj) return whole;
  const out = {};
  for (const k of Object.keys(whole)) {
    const cur = whole[k], base = baseObj[k];
    const diffable = (Array.isArray(cur) || isPlainObj(cur)) && (Array.isArray(base) || isPlainObj(base));
    if (!diffable) { out[k] = cur; continue; } /* 삭제(null)·잎·타입 불일치는 그대로 통째 */
    const acc = { u: {}, n: 0 };
    let good = false;
    try { good = deepDiff(base, cur, k, acc) && acc.n > 0 && !dpOverlaps(Object.keys(acc.u)); } catch { good = false; }
    if (good) {
      try {
        const sim = applyUpdates({ [k]: base }, acc.u);
        good = canonJson(dpNormalize(sim[k])) === canonJson(dpNormalize(cur)); /* ★자기검증 */
      } catch { good = false; }
    }
    if (good) { for (const p of Object.keys(acc.u)) out[p] = acc.u[p]; }
    else out[k] = cur;
  }
  if (dpOverlaps(Object.keys(out))) return whole; /* 최종 안전망: 겹치면 RTDB 가 거부하므로 통째로 */
  return out;
};

/* 클라우드 저장: Firebase PATCH(바뀐 키만) — 기준선 없으면 PUT (2초 디바운스) */
let _saveTimer = null, _pendingData = null, _pendingPath = null;
const cloudSave = (data) => {
  /* ★P0 계측 부착(2026-07-17·§14.8 ⑤): 이 blob 을 마지막으로 쓴 기기(lastWriter) + 이 기기가 겪은 최근 GAS 실패(calFailures).
     백스톱이 45분마다 blob 을 읽어 로그에 영속시킨다. 한계(수용): ⓐ 실패는 *다음* 저장 때 실림(add 실패는 최대 45s 뒤라 직전
     저장 이후일 수 있음 — 계속 쓰면 곧 실리고 탭닫기 flush 도 있음) ⓑ 다른 기기 저장이 LWW 로 덮어씀(단 **실패한 기기가 곧
     쓰는 기기**다 = RTDB 는 통과하고 GAS 만 막히므로 실패는 실린다. 백스톱 로그가 영속 사본). */
  data = { ...data, lastWriter: { devId: DEV_ID, at: new Date().toISOString() } };
  _pendingData = data; /* ★자정 리로드·탭닫기 flush용으로 대기 데이터 보관(2026-07-04) */
  /* ★E2(2026-07-05): 저장 대상 경로를 '예약 시점'에 고정(closure). 디바운스 2초 내 워크스페이스 전환 시
     flush가 fbDataUrl()로 새 WS.fbPath를 읽어 옛 워크스페이스 블롭을 반대편(/data↔/personal)에 덮어쓰던
     치명 버그 차단(WS는 모듈 전역·전환 시 리마운트돼도 _saveTimer는 생존). */
  const path = WS.fbPath; _pendingPath = path;
  const url = "https://taskmgr-sync-default-rtdb.firebaseio.com/" + path + ".json";
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    _saveTimer = null;
    const el = document.getElementById("sync-status");
    if (el) { el.textContent = "☁️ 저장중..."; el.style.color = "#F59E0B"; }
    const q = await authParam();
    /* ★바뀐 키만 PATCH(기준선 없으면 통째 PUT). recurrings 를 **보내야 할 때만** 외부 필드 보존 —
       안 보내면 그 키는 애초에 건드리지 않으므로 병합도 네트워크 왕복도 불필요(대부분의 저장이 여기 해당). */
    const patch = diffForPatch(data);
    const sendRec = !!(patch && Object.prototype.hasOwnProperty.call(patch, "recurrings"));
    const sendAll = data;
    const payload = patch ? { ...patch, ...(sendRec ? { recurrings: sendAll.recurrings } : {}) } : sendAll;
    fetch(url + q, {
      method: patch ? "PATCH" : "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(r => {
      /* RTDB는 401(권한거부)에도 유효한 JSON 바디를 주므로 r.ok를 반드시 확인 */
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(() => {
      _pendingData = null;
      setSyncBase(sendAll); /* ★성공 = 클라우드는 이제 이 내용 → 다음 저장의 diff 기준 */
      if (el) { el.textContent = "☁️ 동기화됨"; el.style.color = "#10B981"; setTimeout(() => { el.textContent = "☁️"; el.style.color = "#9ca3af"; }, 2000); }
    }).catch(() => {
      if (el) { el.textContent = "☁️ 실패"; el.style.color = "#EF4444"; setTimeout(() => { el.textContent = "☁️"; el.style.color = "#9ca3af"; }, 3000); }
    });
  }, 2000);
};
/* ★디바운스 중인 저장을 즉시 flush(2026-07-04) — 자정 리로드/탭닫기로 2초 저장이 소멸하는 것 방지. keepalive로 언로드에도 도달 시도 */
const flushCloudSave = async () => {
  if (!_pendingData) return;
  clearTimeout(_saveTimer); _saveTimer = null;
  const data = _pendingData; const path = _pendingPath || WS.fbPath; _pendingData = null; /* ★E2: 예약 시점 경로로 flush(전환돼도 옛 데이터는 옛 경로로) */
  const url = "https://taskmgr-sync-default-rtdb.firebaseio.com/" + path + ".json";
  /* ★언로드 경로라 네트워크 왕복을 더 붙이면 flush 자체가 유실될 수 있다 → 캐시(_sweptCache)만 동기 적용.
     캐시는 직전 cloudSave 가 채워두므로 '편집 → 2초 내 탭닫기' 창에서도 직전 관측값이 살아 있다.
     ★여기서도 바뀐 키만 PATCH. 성공 확인이 불가능한 경로라 기준선(_syncBase)은 갱신하지 않는다(다음 저장이 조금 더 보내면 그만·안전측). */
  try {
    const q = await authParam();
    const patch = diffForPatch(data);
    const sendAll = data;
    const sendRec = !!(patch && Object.prototype.hasOwnProperty.call(patch, "recurrings"));
    const payload = patch ? { ...patch, ...(sendRec ? { recurrings: sendAll.recurrings } : {}) } : sendAll;
    await fetch(url + q, { method: patch ? "PATCH" : "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), keepalive: true });
  } catch {}
};

/* 클라우드 로드: Firebase GET (1회 요청). 실패와 '빈 DB'를 구분해 반환 —
   로드 실패 시 클라우드 저장을 계속 차단해야 stale 로컬이 클라우드를 덮지 않는다. */
const cloudLoad = async () => {
  try {
    const q = await authParam();
    const r = await fetch(fbDataUrl() + q);
    if (!r.ok) return { ok: false, status: r.status };
    return { ok: true, data: await r.json() };
  } catch { return { ok: false }; }
};


/* (cleanup 2026-07-31) 파일 첨부 배선 전량 제거 — 업로드/다운로드 유틸·편집창 첨부 섹션(이미 죽은 코드)·
   회고 첨부 상자·앱 상태까지. 생애 1건(2026-06-10) 사용 후 50일 0건, RTDB 저장소는 비어 있었음(고아 0).
   기존 blob 에 남은 옛 키는 **삭제하지 않는다**(비파괴 — SYNC_OWNED 에서 빠져 손대지 않음).
   제거된 식별자 목록은 커밋 메시지 참조. */

/* ─── 반복 태스크 ─── */
const DAYS_KO = ["일", "월", "화", "수", "목", "금", "토"];
const getTodayDow = () => new Date().getDay(); /* 0=일 ~ 6=토 */
const getWeekId = () => { const d = new Date(); d.setHours(0,0,0,0); const jan1 = new Date(d.getFullYear(),0,1); return `${d.getFullYear()}-W${Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7)}`; }; /* ★자정 정규화(2026-07-06): 시각 의존 weekId 경계 흔들림 제거 → 당일 인스턴스 period가 미래 placeholder(자정 계산 weekIdOf)와 항상 일치(주간 중복 방지) */
const getMonthId = () => { const d = new Date(); return `${d.getFullYear()}-M${d.getMonth()+1}`; };
/* ★주N회 전환 대상 id(2026-07-07): 마이그레이션이 count로 바꾸는 5개. 전환 직후 로드 tick에서 상태(type)가 아직 안 퍼져
   generateRecurringTasks·futureEvtDone가 stale하게 weekly/daily로 읽어 인스턴스·예정이벤트를 만드는 레이스 방지 —
   이 id는 '영구 count'라 type 무관하게 항상 스킵(적대검증 R1/R3). */
const COUNT_MIG_IDS = new Set(["q1omsdk", "h7gayxj", "w02xa9w", "dcfei54", "rt_english"]);
const generateRecurringTasks = (recurrings, tasks, projects, history) => {

  /* 완료(done)되어 tasks[]에서 빠진 인스턴스도 history.orig에 full 스냅샷 보존됨

  const histInstances = [];
  (history || []).forEach(h => (h.items || []).forEach(it => { if (it.orig && it.orig.recurringId) histInstances.push(it.orig); }));
  const allInstances = [...tasks, ...histInstances];

    /* ★weekly 복원(2026-09-12 소유자 결정): 캘린더를 걷으면서 당일 글랜스가 사라져, 그 요일 당일에만 인스턴스를 만들던 2026-08-02b 동작으로 되돌린다. 주간 그림은 루틴 탭 스트립이 따로 갖는다 — 다른 탭이라 "한 화면에 두 자리" 문제가 아니다. */
    if (r.type === "count" || COUNT_MIG_IDS.has(r.id)) return; /* 주N회(count)만 제외 — 오늘 할 일에 인스턴스를 안 만들고 스트립 카운터(＋/−)에서만 센다. id-스킵=전환 tick 레이스 방지 */
    const type = r.type || "weekly";

    if (type === "daily") {

    } else if (type === "weekly") {
      const days = r.dows || (r.dow != null ? [r.dow] : []); /* 복수 요일(dows) 지원 · 기존 dow 폴백(2026-07-04) */
      const multi = days.length > 1;
      const ovs = (!multi && r.overrides) ? r.overrides : null; /* ★회차 override(단일요일 weekly) */
      /* ★cross-week 이동 지원(2026-07-13 적대검증): TODAY가 어떤 회차의 override 날짜면 그 회차키(원래 주)로 생성 → recurOccurrences가 얹은 placeholder(period=그 회차키)와 멱등 재연결.

    const legacyTag = `[recurring:${r.id}:${period}]`;
    if (allInstances.some(t => (t.recurringId === r.id && t.recurringPeriod === period) || t.notes?.includes(legacyTag))) return;

};

  const TASK_MIGRATION = {
    "독파모 3~4차 300% 전성비 달성 가능할지?": "waiting",
  };
  data.tasks = data.tasks.map(t => {

    if (t.planDate === undefined) t = { ...t, planDate: "" };

      return ns;
    })};
    return t;
  });

};

/* ★savedAt 정규화(2026-07-25·PDS §14.7 ②-(c) **savedAt 형식 계약**): LWW 비교는 ISO 문자열 기준인데,
   외부 도구(하네스 스크립트·수동 PATCH)가 unix epoch ms **숫자**로 bump 하면 JS 관계연산이 "한쪽이 숫자면
   양변을 Number 로 강제"하는 규칙 때문에 ISO 문자열이 **NaN** 이 되어 비교가 **항상 false** 가 된다.
   그러면 그 write 는 '더 최신'이 아니라 **앱이 영원히 채택 못 하는 값**이 되고, 앱은 stale 메모리를 유지하다
   다음 저장에서 blob 전체를 PUT 해 그 write 를 **통째로 되돌린다**.
   ⚠ 2026-07-19 `sweptThrough` 유실이 정확히 이것 — 열린 탭뿐 아니라 **새 탭·하드리프레시에서도** 결정론적으로
   실패했고, 숫자는 L2027 '다른 기기 변경' 경고 조건(`typeof === "string"`)도 통과 못 해 **채택 실패와 경고 실패가
   동시** 발생 → 8일간 무증상. 캘린더 desc 가 6795자까지 자라 GAS URL 임계를 넘긴 사고(§14.8 ⑥)의 상류 원인.
   ★계약 자체는 **도구측이 ISO 를 쓰는 것**(scripts/sweep_write.ps1 이 준수·write-back 검증까지 함)이고,
   이 정규화는 그 위반을 **조용히 삼키지 않기 위한 방어**다(다른 도구가 또 숫자를 써도 최소한 채택·경고는 산다).
   숫자는 unix **ms** 로 해석 — 실측된 유일한 위반 형식(`ToUnixTimeMilliseconds()`). */
const normSavedAt = (v) => {
  if (typeof v === "string") return v;
  if (typeof v === "number" && isFinite(v)) { try { return new Date(v).toISOString(); } catch { return ""; } }
  return "";
};

/* ★순서 바꾸기(2026-09-14 소유자 요청으로 복원) — 오늘 탭 목록에서만.
   2026-09-13 에 걷어냈다가 되살렸다. 복원 범위는 **순서 바꾸기 하나**이고,
   목록 밖으로 끌어 「오늘에서 내리기」는 되살리지 않는다(순서 바꾸기와 겹쳌 오발동하던 자리). */
const useDragReorder = (onReorder, attr = "data-task-card") => {
  const SEL = "[" + attr + "]";
  const st = useRef(null);
  const clearAll = () => {
    document.querySelectorAll(".drop-indicator-before, .drop-indicator-after")
      .forEach(el => el.classList.remove("drop-indicator-before", "drop-indicator-after"));
  };
  const finish = (commit) => {
    const s = st.current; if (!s) return;
    st.current = null;
    clearAll();
    if (s.card) { s.card.style.opacity = ""; s.card.style.transform = ""; }
    document.body.style.userSelect = "";
    if (commit && s.moved && s.target && s.target.id !== s.id) onReorder(s.id, s.target.id, s.target.pos);
  };
  return {
    onPointerDown: (id, e) => {
      if (e.button != null && e.button > 0) return; /* 왼쪽 버튼·터치만 */
      e.preventDefault(); e.stopPropagation();      /* HTML5 dragstart 와 텍스트 선택을 함께 막는다 */
      const card = e.currentTarget.closest(SEL);
      st.current = { id, card, moved: false, target: null };
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
      document.body.style.userSelect = "none";
      if (card) { card.style.opacity = "0.45"; card.style.transform = "scale(0.99)"; }
    },
    onPointerMove: (e) => {
      const s = st.current; if (!s) return;
      e.preventDefault();
      s.moved = true;
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const card = under && under.closest ? under.closest(SEL) : null;
      clearAll();
      if (!card || card === s.card) { s.target = null; return; }
      const tid = card.getAttribute(attr);
      if (!tid || tid === s.id) { s.target = null; return; }
      const r = card.getBoundingClientRect();
      /* 삽입 위치는 **카드 본체(.task-row)** 의 중앙으로 잰다 — 하위 항목을 펼친 카드는
         바깥 상자가 훨씬 길어서 바깥 기준으로 재면 겨냥한 자리와 결과가 어긋난다. */
      const row = card.querySelector(".task-row");
      const rr = row ? row.getBoundingClientRect() : r;
      const pos = e.clientY < rr.top + rr.height / 2 ? "before" : "after";
      card.classList.add(pos === "before" ? "drop-indicator-before" : "drop-indicator-after");
      s.target = { id: tid, pos };
    },
    onPointerUp: () => finish(true),
    onPointerCancel: () => finish(false),
  };
};
const TaskRow = ({ task, onDone, onDel, onFocus, showProj, projects, onEdit, onUpdate, dragHandlers }) => {

    setAddSub(false); setShowSubs(true);
  };

  /* 카드에 남는 HTML5 드래그는 **섹션 이동 전용**이다(오늘로 보내기 / 오늘에서 내리기).

/* ─── 드래그 정렬 훅 ─── */
/* ★포인터 기반 순서변경(2026-09-07 · 소유자 「모바일 PC 전부 안 됨」).
   옛 방식은 HTML5 draggable 이었는데 그것은 **휴대폰 터치로는 시작조차 되지 않는다**(브라우저가 손가락에
   dragstart 를 발생시키지 않는다). 소유자는 평소 휴대폰으로 쓰므로 그 경로가 통째로 죽어 있었다.
   → Pointer Events 로 바꾼다. 마우스·터치·펜이 같은 코드를 타므로 PC 와 휴대폰이 한 경로가 된다.
   손잡이(⠿)를 잡을 때만 시작한다: 카드 아무 데나 잡으면 목록 스크롤과 싸우게 된다.
   버튼은 늘리지 않는다(소유자 요청) — 이미 있는 손잡이를 휴대폰에서도 보이게 하는 것으로 끝낸다. */

  const [t, setT] = useState(""); const [s, setS] = useState("action"); const [p, setP] = useState(defProj || ""); const [f, setF] = useState(false); const [sd, setSd] = useState(""); const [sl, setSl] = useState(""); const [pd, setPd] = useState(""); const r = useRef();

  const go = () => { if (!t.trim() || !p) return; onAdd({ text: t.trim(), status: s, project: p, focus: f, scheduledDate: sd, scheduledLabel: sl, planDate: pd }); setT(""); setS("action"); setF(false); setSd(""); setSl(""); setPd(""); r.current?.focus(); };
  return (
    <div className="form-row" style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
      <input ref={r} style={S.inp} placeholder="새 할일 입력..." value={t} onChange={e => setT(e.target.value)} onKeyDown={e => e.key === "Enter" && go()} />
      <StSel value={s} onChange={setS} compact />
      {!defProj && <PrSel value={p} onChange={setP} projects={projects} highlight={!!t.trim() && !p} />}
      <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
        <span style={{ fontSize: 10, color: "#6366F1", fontWeight: 600 }}>📆</span>
        <input type="date" style={{ ...S.fld, width: 130, flex: "none", fontSize: 11 }} value={pd} onChange={e => setPd(e.target.value)} title="📆 언제할지 (선택)" />
      </div>
      <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
        <span style={{ fontSize: 10, color: "#9ca3af" }}>마감</span>
        <input type="date" style={{ ...S.fld, width: 130, flex: "none", fontSize: 11 }} value={sd} onChange={e => setSd(e.target.value)} title="마감일 (선택)" />
      </div>
      <button className="star-btn" style={{ ...S.star(f), border: "1px solid #e5e7eb", borderRadius: 5, width: 28, height: 28 }} onClick={() => setF(!f)} title="오늘 집중">
        {f ? "★" : "☆"}
      </button>
      <button style={S.btn()} onClick={go}>추가</button>
    </div>
  );
};

/* ═══ 계획 요약 (planDate 기준 오늘/이번주) ═══ */
const PlanDateSummary = ({ tasks, projects, onEdit }) => {
  const planned = useMemo(() => {
    const items = [];
    tasks.forEach(t => {
      if (t.status !== "done" && t.planDate) items.push(t);
      (t.subtasks || []).forEach(s => { if (s.status !== "done" && s.planDate) items.push({ ...s, project: t.project, _parentId: t.id }); });
    });
    return items;
  }, [tasks]);
  const weekPlan = planned.filter(t => { const d = diffDays(t.planDate); return d !== null && d > 0 && d <= 7; }).sort((a, b) => a.planDate.localeCompare(b.planDate));
  const overduePlan = planned.filter(t => { const d = diffDays(t.planDate); return d !== null && d < 0 && !isStaleRoutine(t); }).sort((a, b) => a.planDate.localeCompare(b.planDate));
  const [weekOpen, setWeekOpen] = useState(false);
  if (!weekPlan.length && !overduePlan.length) return null;
  const PlanItem = ({ t }) => {
    const p = projects.find(x => x.id === t.project);
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
        <Badge st={t.status} />
        <span style={{ color: "#374151", flex: 1 }}>{t.text}</span>
        {p && <span style={{ fontSize: 10, color: "#9ca3af" }}>#{p.name}</span>}
        {t._parentId && <span style={{ fontSize: 9, color: "#9ca3af" }}>↳</span>}
        <button style={{ ...S.gh, fontSize: 10, padding: "1px 5px" }} onClick={() => onEdit(t, t._parentId)}>✏️</button>
      </div>
    );
  };
  return (
    <div style={{ marginBottom: 12 }}>
      {overduePlan.length > 0 && <div style={{ background: "linear-gradient(135deg, #FEF2F2 0%, #FECACA 100%)", border: "1px solid #FCA5A5", borderRadius: 8, padding: "10px 14px", marginBottom: 8 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#991B1B", marginBottom: 4 }}>📆 지난 계획 미처리 ({overduePlan.length}건)</div>
        {overduePlan.map(t => <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
          <span style={{ fontSize: 10, color: "#DC2626", fontWeight: 600 }}>{fd(t.planDate)}</span><PlanItem t={t} />
        </div>)}
      </div>}
      {weekPlan.length > 0 && <div style={{ background: "linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%)", border: "1px solid #C4B5FD", borderRadius: 8, padding: "10px 14px", marginBottom: 8 }}>
        <div onClick={() => setWeekOpen(!weekOpen)} style={{ fontSize: 13, fontWeight: 600, color: "#6D28D9", marginBottom: weekOpen ? 4 : 0, cursor: "pointer", userSelect: "none", display: "flex", alignItems: "center", gap: 6 }}><span style={{ fontSize: 11 }}>{weekOpen ? "▼" : "▶"}</span> 📆 이번주 계획 ({weekPlan.length}건)</div>
        {weekOpen && weekPlan.map(t => <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
          <span style={{ fontSize: 10, color: "#6D28D9", fontWeight: 600 }}>{fd(t.planDate)}</span><PlanItem t={t} />
        </div>)}
      </div>}
    </div>
  );
};

/* ═══ 마감 알림 (서브태스크 포함) ═══ */
const ScheduleAlerts = ({ tasks, projects, onEdit }) => {
  const allScheduled = useMemo(() => {
    const items = [];
    tasks.forEach(t => {
      if (t.status !== "done" && t.scheduledDate) items.push({ type: "task", data: t, parent: null });
      (t.subtasks || []).forEach(s => {
        if (s.status !== "done" && s.scheduledDate) items.push({ type: "sub", data: s, parent: t });
      });
    });
    return items;
  }, [tasks]);
  const overdue = allScheduled.filter(i => diffDays(i.data.scheduledDate) < 0).sort((a, b) => a.data.scheduledDate.localeCompare(b.data.scheduledDate));
  const soon = allScheduled.filter(i => { const d = diffDays(i.data.scheduledDate); return d >= 0 && d <= 7; }).sort((a, b) => a.data.scheduledDate.localeCompare(b.data.scheduledDate));
  if (!overdue.length && !soon.length) return null;
  const AlertItem = ({ item }) => {
    const p = projects.find(x => x.id === (item.type === "task" ? item.data.project : item.parent.project));
    const dl = deadlineInfo(item.data.scheduledDate);
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
        <span style={S.dlBdg(dl)}>{dl.icon} {dl.label}</span>
        {item.type === "sub" && <span style={{ fontSize: 10, color: "#9ca3af" }}>↳</span>}
        <span style={{ color: "#374151", flex: 1 }}>{item.data.text}</span>
        {p && <span style={{ fontSize: 10, color: "#9ca3af" }}>#{p.name}</span>}
        <button style={{ ...S.gh, fontSize: 10, padding: "1px 5px" }} onClick={() => item.type === "task" ? onEdit(item.data) : onEdit(item.data, item.parent.id)}>✏️</button>
      </div>
    );
  };
  return (
    <div style={{ marginBottom: 12 }}>
      {overdue.length > 0 && <div style={S.alertOverdue}><div style={{ fontSize: 13, fontWeight: 600, color: "#991B1B", marginBottom: 6 }}>🔴 마감 초과 ({overdue.length}건)</div>{overdue.map((item, i) => <AlertItem key={i} item={item} />)}</div>}

    </div>
  );
};

/* ═══ 오늘 뷰 (서브태스크 집중 포함) ═══ */
const TodayView = ({ tasks, projects, recurrings, onDone, onDel, onFocus, onAdd, onEdit, onUpdate, onPlanToday, onClearToday, onReorder }) => {
  const dragHandlers = useDragReorder(onReorder);


  /* 오늘 할 일 = 수행날짜가 오늘이거나 지난(미완료) — 별(집중)과 무관(2026-06-30). 지난 미완료 루틴 제외.
     날짜가 있으면(미래 포함) 그 날 자동 표출 = 백로그도 특정 시점 surface(someday 상태 폐지 2026-07-04). */
  const onToday = (t) => !!(t.planDate && t.planDate <= TODAY && !isStaleRoutine(t));
  const { focusedTasks, focusedSubs } = useMemo(() => {
    /* ★자동 재정렬 제거(2026-09-07 · 소유자 「나머지는 내가 알아서 정렬할 수 있게」).
       옛 코드는 projSortKey(루틴>프로젝트>버킷>기타) 로 매 렌더마다 다시 줄을 세웠다. 그 값이 네 가지뿐이라
       **다른 무리에 속한 카드끼리는 순서를 바꿀 수 없었다** — 드롭은 성공하는데 카드가 자기 무리 안의
       엉뚱한 자리로 튀거나, 무리에 혼자면 제자리로 돌아왔다. 이제 목록 순서의 정본은 tasks 배열이고,
       그 배열은 손잡이 드래그가 직접 고친다. 과제 종류 정렬은 **과제 선택 드롭다운에만** 남긴다
       (sortProjsForSelect). */
    const ft = tasks.filter(t => t.status !== "done" && onToday(t));
    const fs = [];
    tasks.forEach(t => { (t.subtasks || []).forEach(s => { if (s.status !== "done" && s.planDate && s.planDate <= TODAY) fs.push({ sub: s, parent: t }); }); });
    return { focusedTasks: ft, focusedSubs: fs };
  }, [tasks, projects, recurrings]); /* recurrings dep(2026-07-12): pk→projSortKey→isRoutineProj가 ROUTINE_REC_PROJ_IDS(recurrings 파생) 참조 → 반복 추가/비활성으로 루틴 도출이 바뀔 때 오늘 정렬 즉시 재계산(stale 방지) */
  const totalFocused = focusedTasks.length + focusedSubs.length;
  const unfocusedActions = tasks.filter(t => t.status === "action" && !onToday(t) && !isStaleRoutine(t));
  const waitingAll = tasks.filter(t => t.status === "waiting" && !onToday(t) && !isStaleRoutine(t));
  const [showRest, setShowRest] = useState(false);

  /* 집중 그룹: 일반 task + 서브태스크 통합 */
  const focusGroups = useMemo(() => {
    const groups = {};
    SK.forEach(k => { groups[k] = []; });
    focusedTasks.forEach(t => groups[t.status]?.push({ type: "task", data: t }));
    /* ★하위 항목을 그 상위 항목 **바로 아래**에 넣는다(2026-09-08 · 소유자 실측).
       옛 코드는 상위를 전부 넣은 뒤 하위를 통째로 뒤에 몰아넣었다. 그래서 하위는 목록 끝에 홀로
       떨어졌고, 상위를 끌어 옮겨도 따라오지 않았다. 게다가 하위의 순서 변경은 같은 상위 안에서만
       뜻이 있으므로, 그 상위의 하위가 오늘 하나뿐이면 **옮길 상대가 없어 아예 움직이지 않았다**
       (업무 「기술전문위원회 과제설명회 발표자료 준비」 아래 「질문 리스트 정리, 공유」 1건이 그 경우).
       상위 밑에 붙이면 상위를 옮길 때 하위가 함께 따라가므로 그 자체로 해결된다.
       상위가 같은 상태 그룹에 없으면(상태가 다르거나 상위가 오늘 목록에 없으면) 종전대로 뒤에 붙인다. */
    focusedSubs.forEach(({ sub, parent }) => {
      const g = groups[sub.status];
      if (!g) return;
      const at = g.findIndex(x => x.type === "task" && x.data.id === parent.id);
      if (at < 0) { g.push({ type: "sub", data: sub, parent, underParent: false }); return; }
      let i = at + 1; /* 이미 이 상위에 붙은 하위가 있으면 그 뒤로 */
      while (i < g.length && g[i].type === "sub" && g[i].parent.id === parent.id) i++;
      g.splice(i, 0, { type: "sub", data: sub, parent, underParent: true });
    });
    return SK.map(k => ({ k, label: STATUSES[k].label, items: groups[k] })).filter(g => g.items.length > 0);
  }, [focusedTasks, focusedSubs]);

  const toggleSubInParent = (parentId, subId, field) => {
    const parent = tasks.find(t => t.id === parentId);
    if (!parent || !onUpdate) return;
    if (field === "focus") onUpdate({ ...parent, subtasks: (parent.subtasks || []).map(s => s.id === subId ? { ...s, focus: !s.focus } : s) });
    if (field === "done") onUpdate({ ...parent, subtasks: (parent.subtasks || []).map(s => s.id === subId ? { ...s, status: s.status === "done" ? "action" : "done" } : s) });
  };

  const renderItem = (item) => {
    if (item.type === "task") return <TaskRow key={item.data.id} task={item.data} projects={projects} showProj dragHandlers={dragHandlers} onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} />;
    return (
      <div key={item.data.id} style={item.underParent
        /* ★상위 바로 아래에 붙은 하위는 카드를 펼쳤을 때와 **같은 모양**으로 보인다(2026-09-08):
           들여쓰기 + 왼쪽 세로선. 상위 이름을 다시 적는 대신 위치와 선으로 소속을 보인다. */
        ? { marginLeft: 20, borderLeft: "2px solid #d1d5db", paddingLeft: 4 }
        : { paddingLeft: 8 }}>
        {!item.underParent && <div style={{ fontSize: 10, color: "#9ca3af", paddingLeft: 30 }}>↳ {item.parent.text}</div>}
        <SubRow sub={item.data}
          onToggleFocus={() => toggleSubInParent(item.parent.id, item.data.id, "focus")}
          onToggleDone={() => toggleSubInParent(item.parent.id, item.data.id, "done")}
          onDel={() => onUpdate && onUpdate({ ...item.parent, subtasks: (item.parent.subtasks || []).filter(s => s.id !== item.data.id) })}
          onEdit={() => onEdit(item.data, item.parent.id)} />
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0" }}>
        <div style={{ fontSize: 13, color: "#6b7280" }}>
          {fd(TODAY)} — 오늘 할 일 <strong style={{ color: "#F59E0B" }}>{totalFocused}</strong>개
          {unfocusedActions.length > 0 && <span> · 다음행동 {unfocusedActions.length}</span>}
          {waitingAll.length > 0 && <span> · 대기중 {waitingAll.length}</span>}
        </div>
      </div>
      <PlanDateSummary tasks={tasks} projects={projects} onEdit={onEdit} />
      <ScheduleAlerts tasks={tasks} projects={projects} onEdit={onEdit} />
      <AddForm projects={projects} onAdd={onAdd} />
      {totalFocused > 0 ? (
        <div style={{ marginTop: 16 }}>
          <div style={S.focusBanner}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#92400E", marginBottom: 4 }}>📆 오늘 할 일 ({totalFocused})</div>
            <div style={{ fontSize: 11, color: "#A16207" }}>수행날짜가 오늘이거나 지난 항목</div>
          </div>
          {focusGroups.map(g => (
            <div key={g.k} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 11, color: "#9ca3af", fontWeight: 500, padding: "2px 10px", marginBottom: 2 }}>{STATUSES[g.k]?.icon} {g.label}</div>
              {g.items.map(renderItem)}
            </div>
          ))}
        </div>
      ) : (
        <div style={{ ...S.emp, marginTop: 16 }}>할일의 수행날짜(📆)를 오늘로 설정하세요</div>
      )}
      <div style={{ marginTop: 20 }}>
        <div style={{ ...S.secT, cursor: "pointer", userSelect: "none" }} onClick={() => setShowRest(!showRest)}>
          {showRest ? "▼" : "▶"} 전체 현황
          <span style={S.cnt(unfocusedActions.length + waitingAll.length)}>{unfocusedActions.length + waitingAll.length}</span>
        </div>
        {showRest && (
          <div>
            {unfocusedActions.length > 0 && <div style={S.sec}><div style={{ fontSize: 12, fontWeight: 500, color: "#3B82F6", marginBottom: 6 }}>🔵 다음행동 ({unfocusedActions.length})</div>{unfocusedActions.map(t => <TaskRow key={t.id} task={t} projects={projects} showProj onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} />)}</div>}
            {waitingAll.length > 0 && <div style={S.sec}><div style={{ fontSize: 12, fontWeight: 500, color: "#F59E0B", marginBottom: 6 }}>⏳ 대기중 ({waitingAll.length})</div>{waitingAll.map(t => <TaskRow key={t.id} task={t} projects={projects} showProj onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} />)}</div>}
          </div>
        )}
      </div>
    </div>
  );
};

/* ★긴 줄 접기(2026-09-14 소유자) — 메모 한 건이 화면을 다 먹거나 URL 한 줄이 세 줄로 감기는 것을 막는다.
   접힌 상태에서도 첫 줄은 보이므로 무엇인지 알아볼 수 있다. 누르면 펼쳐진다. */
const Clamp = ({ text, lines }) => {
  const [open, setOpen] = useState(false);
  const n = lines || 2;
  const long = (text || "").length > 90 || (text || "").split(String.fromCharCode(10)).length > n;
  const isUrl = /^https?:\/\//.test((text || "").trim());
  if (isUrl) {
    const u = text.trim();
    const short = u.length > 60 ? u.slice(0, 58) + "…" : u;
    return <a href={u} target="_blank" rel="noreferrer" style={{ color: "#4338CA", wordBreak: "break-all", fontSize: 12 }} title={u}>{short}</a>;
  }
  if (!long) return <span style={{ whiteSpace: "pre-wrap" }}>{text}</span>;
  return (
    <span>
      <span style={{ whiteSpace: "pre-wrap", display: "-webkit-box", WebkitLineClamp: open ? "unset" : n, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{text}</span>
      <span onClick={() => setOpen(!open)} style={{ fontSize: 11, color: "#6366F1", cursor: "pointer", userSelect: "none" }}>{open ? "▲ 접기" : "▼ 더보기"}</span>
    </span>
  );
};
/* ★메모 CRUD(2026-09-14 소유자) — 적은 것을 고치고 지울 수 있어야 한다.
   저장 자리는 히스토리의 그 항목이라 수정·삭제가 곧 그 기록을 고치는 것이다(되돌리기 제공). */
const MemoRow = ({ m, onEdit, onDelete }) => {

      <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
        <button style={{ ...S.btn("#4338CA"), fontSize: 11 }} onClick={() => { onEdit(m.date, m.idx, draft); setEditing(false); }}>저장</button>
        <button style={{ ...S.gh, fontSize: 11 }} onClick={() => { setDraft(m.text); setEditing(false); }}>취소</button>
      </div>
    </div>
  );
  return (
    <div style={{ fontSize: 12, padding: "5px 0", borderBottom: "1px dotted #e5e7eb" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <span style={{ fontSize: 10, color: "#9ca3af", flex: 1 }}>{(m.date || "").slice(5)}{m.from ? " · " + m.from + "에서" : ""}</span>
        <button style={{ ...S.gh, fontSize: 10, padding: "0 5px" }} onClick={() => setEditing(true)} title="고치기">✏️</button>
        <button style={{ ...S.gh, fontSize: 10, padding: "0 5px", color: "#EF4444" }} onClick={() => onDelete(m.date, m.idx)} title="지우기">✕</button>
      </div>
      <div style={{ marginTop: 2 }}><Clamp text={m.text} lines={3} /></div>
    </div>
  );
};
/* ═══ 영역 카드 (개인=영역 · 업무=과제) ═══
   ★2026-09-14 소유자 결정 — 루틴 탭과 유형별 탭을 여기 하나로 합쳤다.
   카드 하나에 그 영역의 **세션 · 할일 · 메모**가 다 들어온다. 접힘이 기본이다.
   ★새 항목 종류를 만들지 않는다: 「생각·개선안」은 그냥 **날짜 없는 할일**이고 이미 그렇게 쓰이고 있었다
     (실측 2026-09-14: 개인 날짜 없는 할일 23건 = 글감·링크·미뤄둔 작업). 오늘 탭에 안 뜨고 여기에만 있다.
   ★카드 머리 숫자는 **실제 수행**만 — 세션 n/목표. 생각이 쌓인 양은 성과가 아니다(소유자). */
const AreaView = ({ tasks, projects, recurrings, history, onDone, onDel, onFocus, onAdd, onEdit, onAddProj, onEditProj, onDelProj, onUpdate, isWork, setRecurrings, onUpdateRecurring, onAddSession, onRemoveSession, onAddMemo, onEditMemo, onDeleteMemo, onSetFocus }) => {
  const [open, setOpen] = useState(new Set()); /* 항상 접힌 상태로 시작한다. 열린 할일이 있다고 자동으로 펼치지 않는다 */
  const [np, setNp] = useState("");
  const [memoMore, setMemoMore] = useState(new Set());  /* 메모 더보기 — 카드별 */
  const [memoDraft, setMemoDraft] = useState({});        /* 영역별 메모 입력 중인 글 */
  const [newFor, setNewFor] = useState("");             /* 새 세션 폼을 연 영역 */
  const wkNow = getWeekId();
  const doneSet = routineDoneSet(tasks, history);
  const delRec = (id) => { if (!window.confirm("이 반복 세션을 지울까요?")) return;
    setRecurrings(prev => SEED_ROUTINE_IDS.has(id) ? prev.map(r => r.id === id ? { ...r, disabled: true } : r) : prev.filter(r => r.id !== id)); };
  const tog = id => setOpen(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  /* ★참조 무결성(2026-07-26·소유자): 과제 ↔ 반복 태스크. 헤더 숫자가 **미완료 할일만** 세던 탓에
     반복 3개짜리 살아있는 영역과 참조 0인 고아 과제가 화면에서 똑같이 "0" 으로 보였다 → 둘 다 문제였다:
     ⓐ 진짜 고아(참조 0)가 안 보여 몇 주째 방치 ⓑ **살아있는 걸 고아로 오인해 삭제**하기 쉬움.
     → 반복 개수를 헤더에 드러내고(🔁N), 반복이 붙은 과제는 **삭제를 막는다**. */
  const recOf = (pid) => (recurrings || []).filter(r => !r.disabled && r.project === pid);
  const renderProj = (p) => {
    const pt = tasks.filter(t => t.project === p.id && t.status !== "done" && !t.recurringId); /* 반복 인스턴스는 세션 줄이 맡는다 */
    const recs = recOf(p.id);
    const memo = areaRecaps(p.id, recurrings, history);

    const sTgt = sess.reduce((a, b) => a + b.tgt, 0), sDone = sess.reduce((a, b) => a + Math.min(b.n, b.tgt), 0);

/* 지난 루틴 소급 체크 — 루틴 × 지난 N일 그리드. 칸 클릭 = 그날 완료 체크/해제(2026-07-01) */
/* ─── 주N회 루틴(2026-07-07): 지정 요일이 유동적인 루틴(예: 보컬 월·수·토)을 '이번 주 N회 목표'로 추적.
   목표=freqPerWeek 우선, 없으면 지정 요일 수(dows.length). 완료수=이번 주 done 회차(옮긴 날·➕추가 세션 포함).
   현재 구조 유지: 요일별 예정 인스턴스는 그대로, 위에 '주 N회' 카운트 층만 얹음. ─── */
/* ★2026-08-02: weekly(특정일) 도 스트립 대상으로 편입. 목표=1(불변식 I2가 weekly=요일 1개를 강제).
   왜: weekly 는 그 요일 당일 '오늘 할 일'에만 뜨고 다음날 isStaleRoutine 으로 사라진다 →
   그날 앱을 안 열면 그 주 회차를 영영 못 누른다. 실측 사고: 링글은 매주 수강했는데 앱 기록은 2주치가 비었고,

const routineWeekTarget = (r) => r.type === "count" ? (r.freqPerWeek || 1) : r.type === "weekly" ? 1 : 0; /* 매일·매월은 0=스트립 제외 */
const routineDoneSet = (tasks, history) => { const s = new Set();
  (tasks || []).forEach(t => { if (t.recurringId && t.status === "done" && !t.cancelled) s.add(t.recurringId + "|" + (t.recurringPeriod || t.planDate)); });
  (history || []).forEach(day => (day.items || []).forEach(it => { if (it.type === "done" && !it.cancelled && !it.memoOnly && it.orig && it.orig.recurringId) s.add(it.orig.recurringId + "|" + (it.orig.recurringPeriod || day.date)); })); /* ★취소(cancelled)=카운트 제외(2026-07-07·B안). ★memoOnly=📝메모만(카운트 무관·2026-07-08)도 제외 */
  return s; };
const weekDoneCount = (doneSet, rid, wk) => { let n = 0; doneSet.forEach(k => { const i = k.indexOf("|"); const id = k.slice(0, i), per = k.slice(i + 1); if (id === rid && (per === wk || per.indexOf(wk + "-") === 0)) n++; }); return n; };
/* ★영역 단위 메모(2026-09-12 소유자 결정): 어느 루틴 칸에 적었든 같은 영역이면 다음 회차에 도착한다.
   보컬을 예로 들면 레슨에서 받은 교정과 연습에서 나온 발견이 한 흐름이어야 하는데, 종전에는 같은
   recurringId 끼리만 모여서 레슨 칸에 적은 것이 연습 회차에서 영영 안 보였다(보컬이 돌던 이유는
   소유자가 손으로 옮겨 적었기 때문이고 시스템이 합쳐 준 적은 없다).
   ★출처를 반드시 붙인다 — 코치가 한 말인지 내가 찾은 것인지 구분돼야 한다.
   ★2026-09-14 소유자 결정 — 정제된 메모를 접는 sweptThrough 기전을 폐기했다. 한 번도 접힌 적이 없었고
     (쓰기 5회 중 8루틴 가운데 2개만 값이 들어가 기준선이 늘 빈 문자열이었다) 앱·스크립트·검사기 세 곳에
     걸친 유지비만 들었다. 이제 정리한 메모는 일요일에 일지로 옮긴 뒤 그 자리에서 ✕ 로 지운다. */
const areaRecaps = (projectId, recurrings, history) => {
  const nameOf = {};
  (recurrings || []).forEach(r => { if (r.project === projectId) nameOf[r.id] = r.text || ""; });
  const items = [];
  (history || []).forEach(day => (day.items || []).forEach((it, idx) => {
    const o = it.orig;

    const text = (o.recap || "").trim(); if (!text) return;   /* ★회고만. 참조용 메모(notes)는 그 태스크 안에 둔다 */

  }));

        다음 세션의 화해 비교를 이겨 클라우드를 덮는다(2026-06-10 사고와 동일 클래스).

  const firstSaveSkip = useRef(true);
  useEffect(() => {

    const data = { tasks, projects, history, recurrings, savedAt: new Date().toISOString() };
    lastSavedAtRef.current = data.savedAt; /* ★C2: 저장한 savedAt을 기준으로 갱신 */
    saveToStorage(data);

  }, [tasks, projects, history, recurrings]);

  const showT = (msg, undo) => setToast({ msg, undo });
  const hideT = () => setToast(null);
  const nowTime = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };

  const addHistItem = (item) => {

  const removeHistItem = (matchFn) => {

  /* 서브태스크 완료 done 항목 제거 — 모든 날짜 검색(완료 취소·서브 삭제 시; 익일 취소도 처리) */
  const removeHistDoneSub = (subId) => {

  const syncSubDoneHist = (prevTask, nextTask) => {
    if (!nextTask) return;

    const nextSubs = nextTask.subtasks || [];
    const prevById = new Map(prevSubs.map(s => [s.id, s]));
    const nextById = new Map(nextSubs.map(s => [s.id, s]));

  /* (2026-06-23 ④-b) setRoutineHist 제거 — 루틴=daily 반복 할일, RoutineSection 폐지. */
  /* 반복 정의 수정(실행방법·시간) + 진행중 인스턴스에 전파(2026-07-01) */
  const updateRecurring = (id, patch) => {

    setRecurrings(p => p.map(r => r.id === id ? { ...r, ...patch } : r));
    /* 인스턴스 전파 키(text/project/time/protocol). dows·type은 정의만 바꾸고 미래 생성에 반영 */
    if (!["protocol", "time", "text", "project"].some(k => k in patch)) return;
    const merge = (t) => ({ ...t,

  /* 지난 루틴 소급 체크/해제(2026-07-01): 완료=history done 항목 + 미완료 인스턴스 정리 / 해제=반대 */
  const addRoutineSession = (rid, memo) => {
    const rec = recurrings.find(r => r.id === rid); if (!rec) return;
    const wk = getWeekId();
    const isWeekly = rec.type === "weekly";
    /* ★weekly 초과 기록 허용(2026-08-08 소유자 지시 — "레슨·링글도 다른 것들과 똑같이 초과 등록되게").
       규칙: **그 주 첫 회차만 정규키(wk), 2회차부터는 고유키(wk-x…)**.
       · 첫 회차가 정규키인 이유 = 그 주 예정 인스턴스와 같은 키여야 두 표시자리(오늘 할 일 / 주간 스트립)가
         같은 회차를 가리켜 **한 세션이 2회로 잡히지 않는다**. 이것이 2026-08-02 가드의 실제 목적이었고 그대로 보존한다.
       · 2회차부터 고유키인 이유 = routineDoneSet 이 Set 이라 같은 키는 합쳐져 **아무리 눌러도 1** 이었다(이번 지시의 증상).
       · 이중계상 경로가 안 생기는 근거 = 2회차를 누르는 시점엔 그 주 정규 인스턴스가 이미 완료로 흡수돼(아래 pend) tasks[]에 없다.
       옛 하드블록(`>=1 이면 토스트 후 return`)은 제거 — 그것이 초과 등록을 막던 직접 원인. */
    const already = weekDoneCount(routineDoneSet(tasks, history), rid, wk);
    const period = (isWeekly && already === 0) ? wk : wk + "-x" + gid(); /* count: 고유 회차키 → 연타 언더카운트 레이스 없음(적대검증 C1b) */
    /* 그 주 대기 인스턴스가 있으면 그것을 완료로 흡수한다 — 안 그러면 tasks[] 에 유령으로 남는다(실측: 링글 rdbvi29 가 그렇게 열린 채였다). */
    const pend = isWeekly ? (tasks || []).find(t => t.recurringId === rid && (t.recurringPeriod || "") === wk && t.status !== "done" && !t.cancelled) : null;
    const proj = projects.find(p => p.id === rec.project);
    const memoTrim = (memo || "").trim();
    const orig = pend
      ? { ...pend, status: "done", recurringPeriod: period, recap: memoTrim || pend.recap || "" }
      : { id: gid(), text: rec.text, status: "done", project: rec.project || "proj_etc", recurringId: rid, recurringPeriod: period, recap: memoTrim, planDate: TODAY, planTime: rec.time || "", protocol: rec.protocol || "", createdAt: TODAY, subtasks: [] };
    setHistory(prev => { const item = { type: "done", text: orig.text, projectName: proj ? proj.name : "", project: orig.project, orig, time: nowTime() };
      const ex = prev.find(h => h.date === TODAY); if (ex) return prev.map(h => h.date === TODAY ? { ...h, items: [...h.items, item] } : h); return [...prev, { date: TODAY, items: [item] }]; });
    if (pend) setTasks(prev => prev.filter(t => t.id !== pend.id)); /* 완료로 흡수됐으므로 대기 목록에서 뺀다(일반 완료와 같은 처리) */
    showT("\"" + rec.text + "\" 기록 ✅ (" + ((isWeekly && already === 0) ? "이번 주 완료" : "이번 주 +1") + (memoTrim ? " · 회고 저장" : "") + ")", null);
  };

  /* 주N회 −(2026-07-07): 이번 주 '가장 최근' 완료 1건 취소(잘못 체크·오카운트 정정). history done 우선(➕·요일체크 공통), 없으면 tasks done.
     ★최근성=(날짜,시간) 최대로 선택(적대검증 R1: history 배열이 삽입순이라 소급체크가 뒤에 붙어도 실제 최신을 고름). 식별=orig.id(안정키). */
  const removeRoutineSession = (rid) => {
    const wk = getWeekId();
    const inWk = (per) => per === wk || (per || "").indexOf(wk + "-") === 0;
    let target = null, bestKey = "";
    (history || []).forEach(h => (h.items || []).forEach(it => { if (it.type === "done" && !it.cancelled && !it.memoOnly && it.orig && it.orig.recurringId === rid && inWk(it.orig.recurringPeriod)) { const key = (h.date || "") + "T" + (it.time || "00:00"); if (key >= bestKey) { bestKey = key; target = { kind: "hist", date: h.date, origId: it.orig.id }; } } })); /* ★memoOnly(📝메모만)=세션 아님 → − 취소 대상서 제외(2026-07-08) */
    if (!target) { const td = (tasks || []).filter(t => t.recurringId === rid && t.status === "done" && !t.cancelled && inWk(t.recurringPeriod || t.planDate)); if (td.length) { target = { kind: "task", taskId: td[td.length - 1].id }; } }
    if (!target) { showT("이번 주 취소할 완료 기록이 없습니다", null); return; }
    /* ★B안(2026-07-07): −는 기록을 삭제하지 않고 cancelled 표시 → 카운트만 −1, 히스토리엔 취소선으로 남아 '↺ 복원'으로 언제든 되살림.
       토스트 '되돌리기'=즉시 복원(=cancelled 해제). */
    if (target.kind === "hist") {
      setHistory(prev => prev.map(h => h.date === target.date ? { ...h, items: (h.items || []).map(it => (it.orig && it.orig.id === target.origId) ? { ...it, cancelled: true } : it) } : h));
      const rec0 = recurrings.find(r => r.id === rid);
      showT("이번 주 완료 1건 취소 — 히스토리서 복원 가능", () => { setHistory(prev => prev.map(h => h.date === target.date ? { ...h, items: (h.items || []).map(it => (it.orig && it.orig.id === target.origId) ? { ...it, cancelled: false } : it) } : h)); hideT(); }); /* R1(2026-07-08): 되돌리기=능동 재-lay(closure history엔 target 아직 non-cancelled→excludeId 없이 메모 포함)로 즉시 복귀. futureThrough:"" 리셋 레이스·once-per-mount futureEvtDone 의존 제거 */
    } else {
      setTasks(prev => prev.map(t => t.id === target.taskId ? { ...t, cancelled: true } : t));
      showT("이번 주 완료 1건 취소 — 복원 가능", () => { setTasks(prev => prev.map(t => t.id === target.taskId ? { ...t, cancelled: false } : t)); hideT(); });
    }
  };

  /* 주N회 '📝 메모만'(2026-07-08): 세션 카운트 없이 발견/메모만 기록 → 루틴 탭 영역 카드에 모인다.
     '수행은 안 했지만 남길 게 있는' 경우(예: 레슨만 받은 날) 자리. memoOnly=true → routineDoneSet·− 스캔·완료수서 제외(카운트 무관),
     routineMemoText엔 포함(비취소 done+notes)돼 이월. 히스토리서 ✏️(editHistMemo)·🗑(deleteHistMemo)로 수정/삭제·↺복원 가능(2026-07-25). */
  /* ★영역 메모(2026-09-14 소유자) — 세션에 묶지 않는다. 어느 세션에서 나왔든 같은 영역이면 한 흐름이라
     「어디에 적을까」를 판단할 일이 없어야 한다. 세션 완료로 남긴 메모와 같은 자리에 쌓인다. */
  const addAreaRecap = (projectId, memo) => {
    const memoTrim = (memo || "").trim();
    if (!memoTrim) return;
    const proj = projects.find(p => p.id === projectId);
    const orig = { id: gid(), text: "", status: "done", project: projectId || "proj_etc", recap: memoTrim, planDate: TODAY, createdAt: TODAY };
    setHistory(prev => {
      const item = { type: "done", memoOnly: true, areaMemo: true, text: "", projectName: proj ? proj.name : "", project: orig.project, orig, time: nowTime() };
      const ex = prev.find(h => h.date === TODAY);
      if (ex) return prev.map(h => h.date === TODAY ? { ...h, items: [...h.items, item] } : h);

  };
  const addRoutineMemo = (rid, memo) => {
    const rec = recurrings.find(r => r.id === rid); if (!rec) return;
    const memoTrim = (memo || "").trim();
    if (!memoTrim) { showT("회고를 입력하세요(빈 칸은 저장하지 않습니다)", null); return; }
    const wk = getWeekId();
    const period = wk + "-m" + gid(); /* 메모전용 회차키(카운트 로직과 안 겹침) */
    const proj = projects.find(p => p.id === rec.project);
    const orig = { id: gid(), text: rec.text, status: "done", project: rec.project || "proj_etc", recurringId: rid, recurringPeriod: period, recap: memoTrim, planDate: TODAY, planTime: rec.time || "", protocol: rec.protocol || "", createdAt: TODAY, subtasks: [] };
    setHistory(prev => { const item = { type: "done", memoOnly: true, text: orig.text, projectName: proj ? proj.name : "", project: orig.project, orig, time: nowTime() };
      const ex = prev.find(h => h.date === TODAY); if (ex) return prev.map(h => h.date === TODAY ? { ...h, items: [...h.items, item] } : h); return [...prev, { date: TODAY, items: [item] }]; });
    showT("\"" + rec.text + "\" 회고 저장 ✅ (카운트 변화 없음)", null);
  };
  /* 완료 메모 삭제(2026-07-25 통일 → 같은 날 **전 완료항목으로 확장**·소유자: 업무·개인 공통):
     memoOnly=항목 취소 / done-with-memo=메모만 클리어(루틴이면 ★수행 카운트 유지).

     ★closure history 를 map(fn) 해 patched fresh 로 재-lay(setHistory 는 async 라 closure 는 아직 옛 상태). */
  const deleteHistMemo = (date, idx) => {
    const day = (history || []).find(h => h.date === date); const it0 = day && day.items[idx];
    if (!it0 || !it0.orig) return;
    const rid = it0.orig.recurringId; const rec0 = rid && recurrings.find(r => r.id === rid);
    const wasMemoOnly = !!it0.memoOnly; const oldNotes = it0.orig.recap || "";
    const del = (h) => h.date === date ? { ...h, items: (h.items || []).map((it, i) => i === idx
        ? (wasMemoOnly ? { ...it, cancelled: true } : { ...it, orig: { ...it.orig, recap: "" } }) : it) } : h;

    showT(wasMemoOnly ? "회고 삭제 · 되돌리기" : (rec0 ? "회고 삭제(카운트 유지) · 되돌리기" : "회고 삭제(완료 기록 유지) · 되돌리기"), () => {

  const editHistMemo = (date, idx, newText) => {

    const rid = it0.orig.recurringId; const rec0 = rid && recurrings.find(r => r.id === rid);

  const addTask = ({ text, status, project, focus, scheduledDate, scheduledLabel, planDate }) => {
    const proj = projects.find(p => p.id === project);
    const tid = gid();
    const pd = planDate || ""; /* ★2026-07-04: 폼 날짜 그대로(빈 값 허용) — 날짜 비우면 과제 안 백로그, 날짜 있으면 그 날 뜸. 강제 today 폐지 */
    const autoFocus = focus; /* 별=집중(날짜와 분리, 2026-06-30) — 오늘 표출은 수행날짜로 */
    const newTask = { id: tid, text, status, project, scheduledDate: scheduledDate || "", scheduledLabel: scheduledLabel || "", planDate: pd, createdAt: TODAY, notes: "", focus: autoFocus, subtasks: [] };
    setTasks(p => [...p, newTask]);

    }

  };

  const planToday = (id) => {

    setTasks(p => p.map(x => x.id === id ? updated : x));
    const proj = projects.find(p => p.id === t.project);

  /* '오늘 할 일'에서 내리기(전체 현황으로 드래그) → 수행날짜 비움(2026-07-01). */
  /* 오늘에서 내리기: 무조건 날짜 삭제 대신 얼럿 열기(변경/없앰/취소) — 놓침 방지(2026-07-04, 소유자) */
  const clearToday = (id) => { const t = tasks.find(x => x.id === id); if (!t || !t.planDate) return; setClearTarget(t); };
  const applyClearToday = (id, newDate) => { /* newDate="" → 날짜 없앰(백로그) / 날짜 → 그 날짜로 변경 */
    setClearTarget(null);
    const t = tasks.find(x => x.id === id); if (!t) return;
    const updated = { ...t, planDate: newDate || "" };
    setTasks(p => p.map(x => x.id === id ? updated : x));
    const proj = projects.find(p => p.id === t.project);
    addHistItem({ type: "edited", text: t.text, projectName: proj?.name || "", detail: newDate ? `📆 ${newDate}로 변경` : "📆 오늘에서 내림(날짜 없앰)", time: nowTime() });
  };
  const updateTask = (updated) => {
    const cur = tasks.find(t => t.id === updated.id);
    setTasks(p => p.map(t => t.id === updated.id ? updated : t));
    syncSubDoneHist(cur, updated);
  };

  const handleEdit = (taskOrSub, parentId) => setEditTarget({ task: taskOrSub, parentId: parentId || null });
  const handleEditSave = (updated) => {
    if (!editTarget) return;
    if (editTarget.parentId) {
      /* (폐지 2026-06-30) 수행날짜=오늘 자동별표 제거 — 별=집중 업무(날짜 무관) */
      setTasks(p => p.map(t => t.id === editTarget.parentId ? { ...t, subtasks: (t.subtasks || []).map(s => s.id === updated.id ? { ...updated, } : s) } : t));
      /* 서브태스크 완료 이력 동기(부모 과제 기준) */
      const par = tasks.find(t => t.id === editTarget.parentId);
      if (par) syncSubDoneHist(par, { ...par, subtasks: (par.subtasks || []).map(s => s.id === updated.id ? updated : s) });
    } else {
      const prev = tasks.find(t => t.id === updated.id);
      /* ★편집모달 덮어쓰기 방지(2026-07-04): 모달이 열려있는 동안 비동기로 찍힌 calEventId/calUpdated를
         스냅샷이 덮지 않게 현재값 우선 보존(서브도 id별로). 편집 필드는 updated 적용. */
      setTasks(p => p.map(t => t.id === updated.id ? { ...updated,
        subtasks: (updated.subtasks || []).map(ns => { const c = (t.subtasks || []).find(x => x.id === ns.id); return c ? { ...ns } : ns; }) } : t));
      if (!prev) return;
      const proj = projects.find(p => p.id === updated.project);
      const changes = [];
      if (prev.status !== updated.status) changes.push(`상태: ${STATUSES[prev.status]?.label || prev.status}→${STATUSES[updated.status]?.label || updated.status}`);
      if (prev.text !== updated.text) changes.push(`내용 수정`);
      if (prev.project !== updated.project) { const pp = projects.find(p => p.id === prev.project); changes.push(`과제: ${pp?.name || prev.project}→${proj?.name || updated.project}`); }
      if (prev.planDate !== updated.planDate) changes.push(`계획일: ${prev.planDate || "없음"}→${updated.planDate || "없음"}`);
      if (prev.scheduledDate !== updated.scheduledDate) changes.push(`마감일: ${prev.scheduledDate || "없음"}→${updated.scheduledDate || "없음"}`);
      if (prev.focus !== updated.focus) changes.push(updated.focus ? "⭐ 집중 설정" : "⭐ 집중 해제");
      if (prev.notes !== updated.notes) changes.push("메모 수정");
      if ((prev.recap || "") !== (updated.recap || "")) changes.push("회고 수정");
      if (changes.length > 0) {
        if (prev.status !== updated.status) {
          addHistItem({ type: "status", text: updated.text, projectName: proj?.name || "", from: prev.status, to: updated.status, detail: changes.join(" · "), time: nowTime() });
          showT(`${STATUSES[prev.status]?.label} → ${STATUSES[updated.status]?.label}`, () => { setTasks(p => p.map(t => t.id === updated.id ? prev : t)); hideT(); });
        } else {
          addHistItem({ type: "edited", text: updated.text, projectName: proj?.name || "", detail: changes.join(" · "), time: nowTime() });
        }
      }
    }
  };

  /* 되돌리기용 사본 — 원본 객체를 직접 고치지 않게 한다(하위 할일까지 새 객체). */
  const cloneTask = (t) => ({ ...t, subtasks: (t.subtasks || []).map(s => ({ ...s })) });
  /* ★메모와 회고를 가른다.
     메모(notes) = 그 일을 **할 때 볼 것**. 그 태스크를 펼칠 때만 보인다.
     회고(recap) = 그 일을 **하고 나서 남긴 것**. 영역 카드에 쌓이고 /sweep 이 수확한다.
     둘이 한 칸에 섞여 있어 영역 카드에 참조용 메모까지 떠 있었다. */
  const doneTask = (id) => {
    const task = tasks.find(t => t.id === id); if (!task) return;
    const proj = projects.find(p => p.id === task.project);
    const snap = { ...task, recap: (task.recap || "").trim() };
    setTasks(p => p.filter(t => t.id !== id));
    const subCount = (task.subtasks || []).length;
    addHistItem({ type: "done", text: task.text, projectName: proj?.name || "", project: task.project, orig: snap, subCount, time: nowTime() });
    showT(`"${task.text}" 완료`, () => {
      setTasks(p => [...p, cloneTask(snap)]);
      removeHistItem(it => it.type === "done" && it.orig?.id === id);
      hideT();
    });
  };

  const delTask = (id) => {
    const task = tasks.find(t => t.id === id); if (!task) return;
    const proj = projects.find(p => p.id === task.project);
    /* 자식 done 히스토리 고아 정리: 삭제 전 이 부모의 서브 done 항목 스냅샷 후 제거(undo 시 verbatim 복원) */
    const orphanSubDone = [];
    (history || []).forEach(h => (h.items || []).forEach(it => { if (it.type === "done" && it.isSub && it.subParent === id) orphanSubDone.push({ date: h.date, item: it }); }));
    setTasks(p => p.filter(t => t.id !== id));
    if (orphanSubDone.length) setHistory(prev => prev.map(h => ({ ...h, items: (h.items || []).filter(it => !(it.type === "done" && it.isSub && it.subParent === id)) })).filter(h => h.items.length > 0));
    /* 반복 인스턴스 삭제 시 orig(recurringId+period)를 남겨 '이 회차 건너뜀'으로 기록 → 같은 기간 재생성 방지(2026-07-03).
       반복 자체를 멈추려면 반복설정에서 삭제. */
    addHistItem({ type: "deleted", text: task.text, projectName: proj?.name || "", time: nowTime(),
      ...(task.recurringId ? { orig: { id: task.id, recurringId: task.recurringId, recurringPeriod: task.recurringPeriod, notes: task.notes } } : {}) });
    showT(`"${task.text}" 삭제됨`, () => {
      setTasks(p => [...p, cloneTask(task)]);
      if (orphanSubDone.length) setHistory(prev => { let next = [...prev]; orphanSubDone.forEach(({ date, item }) => { const ex = next.find(h => h.date === date); if (ex) next = next.map(h => h.date === date ? { ...h, items: [...h.items, item] } : h); else next = [...next, { date, items: [item] }]; }); return next; });
      removeHistItem(it => it.type === "deleted" && it.text === task.text);
      hideT();
    });
  };

  const restoreHist = (date, idx) => {
    setHistory(prev => {
      const day = prev.find(h => h.date === date); if (!day?.items[idx]) return prev;
      const item = day.items[idx];
      const restored0 = item.orig || { id: gid(), text: item.text, status: "action", project: projects.find(p => p.name === item.projectName)?.id || projects[0]?.id, scheduledDate: "", scheduledLabel: "", planDate: "",  createdAt: TODAY, notes: "", focus: false, subtasks: [] };
      const restored = cloneTask(restored0); /* 원본을 직접 고치지 않게 사본으로 되돌린다 */
      if (!restored.planDate) restored.planDate = TODAY;
      setTasks(p => [...p, restored]);
      const ni = day.items.filter((_, i) => i !== idx);
      if (!ni.length) return prev.filter(h => h.date !== date);
      return prev.map(h => h.date === date ? { ...h, items: ni } : h);
    });
    showT("할일로 복원됨", null);
  };
  /* 주N회 −취소 복원(2026-07-07·B안): cancelled 표시된 히스토리 완료를 되살림 → 다시 이번 주 카운트에 포함 */
  const uncancelHist = (date, idx) => {
    setHistory(prev => prev.map(h => h.date === date ? { ...h, items: (h.items || []).map((it, i) => i === idx ? { ...it, cancelled: false } : it) } : h));
    const day = (history || []).find(h => h.date === date); const it0 = day && day.items[idx]; const rid = it0 && it0.orig && it0.orig.recurringId;
    const rec0 = rid && recurrings.find(r => r.id === rid);
    showT(it0 && it0.memoOnly ? "회고 복원됨 (카운트 변화 없음)" : "복원됨 · 카운트 +1", null);
  };

  /* ★집중(2026-09-14 소유자 정의) — 「일반적인 루틴을 수행하고 남는 시간을 어디에 더 쓸지」다.
     tier 를 올리는 것이 아니라 **추가 투입처**를 하나 고르는 것이라, 표시는 영역 카드의 별 하나면 된다.
     루틴이든 프로젝트든 구분하지 않는다 — 시간은 하나의 통이다. 언제나 0개 또는 1개. */
  const setFocusArea = (pid) => {
    setProjects(prev => prev.map(p => p.id === pid ? { ...p, focus: !p.focus } : { ...p, focus: false }));
  };
  /* ★순서 바꾸기(2026-09-14 복원) — 오늘 탭 목록 안에서만. tasks 배열의 자리를 바꾼다.
     수행날짜·상태는 건드리지 않는다(구 「오늘에서 내리기」는 복원하지 않았다). */
  const reorderTask = (fromId, toId, pos) => {
    setTasks(prev => {
      const arr = [...prev];
      const fromIdx = arr.findIndex(t => t.id === fromId);
      if (fromIdx < 0) return prev;
      const [item] = arr.splice(fromIdx, 1);
      let toIdx = arr.findIndex(t => t.id === toId);
      if (toIdx < 0) return prev;
      if (pos === "after") toIdx++;
      arr.splice(toIdx, 0, item);
      return arr;
    });
  };
  const addProj = (name, kind = "project") => {
    const id = (kind === "bucket" ? "b_" : "p_") + gid();
    setProjects(p => [...p, { id, name, order: p.length, kind }]);
  };
  const editProj = (id, name) => setProjects(p => p.map(pr => pr.id === id ? { ...pr, name } : pr));
  const delProj = (id) => {
    /* ★참조 무결성 2겹(2026-07-26): UI(askDel)에서도 막지만 여기서도 막는다 — 호출 경로가 늘어도 불변식이 유지되도록.
       반복이 붙은 과제를 지우면 그 반복이 '없는 과제'를 가리키는 미아가 되고, 편집창 드롭다운이 첫 항목으로
       잘못 표시돼 저장 시 엉뚱한 영역으로 재배정된다(2026-06-30 실제 발생). */
    const attached = (recurrings || []).filter(r => !r.disabled && r.project === id);
    if (attached.length) { showT("반복 태스크 " + attached.length + "개가 붙어 있어 삭제할 수 없습니다 — 반복설정에서 먼저 옮기세요", null); return; }
    setProjects(p => p.filter(pr => pr.id !== id));
    setTasks(p => p.filter(t => t.project !== id));
  };

  const exportData = () => {
    const data = JSON.stringify({ tasks, projects, history, recurrings, exportedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `task-manager-${TODAY}.json`; a.click(); URL.revokeObjectURL(url);
  };
  /* 불러오기(JSON 복원) 철거 — 실사용 0회였고, 잘못 누르면 서버 데이터를 통째로 덮어쓰는 유일한 경로였다. */


  const allFocused = useMemo(() => {
    let c = 0;
    tasks.forEach(t => {
      if (t.status !== "done" && t.focus) c++; /* ★minor: ⭐=집중(focus)만 — planDate==오늘(루틴 4개 등) 오염 제거 */
      (t.subtasks || []).forEach(s => { if (s.status !== "done" && s.focus) c++; });
    });
    return c;
  }, [tasks]);
  const activeCnt = tasks.filter(t => t.status === "action").length;

  return (
    <div className="app-wrap" style={S.app}>
      <div className="hdr-wrap" style={S.hdr}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={S.ttl}>Task Manager</span>
          <button style={{ ...S.gh, fontWeight: 700, fontSize: 12, background: isWork ? "#EFF6FF" : "#FEF3C7", borderColor: isWork ? "#93C5FD" : "#FCD34D" }} onClick={onSwitchWs} title="업무 ⇄ 개인 전환">{WS.icon} {WS.label} ⇄</button>
          <span style={{ fontSize: 12, color: "#F59E0B", fontWeight: 600 }}>⭐{allFocused}</span>
          <span style={{ fontSize: 12, color: "#9ca3af" }}>다음행동 {activeCnt}건</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span id="sync-status" style={{ fontSize: 10, color: "#9ca3af" }}>☁️</span>
          <span style={{ fontSize: 10, color: "#10B981" }}>● 자동 저장</span>
          <button style={S.gh} onClick={exportData}>📤 백업</button>
          {FB_CONFIGURED && fbUser() && <button style={S.gh} title={fbUser().email || "로그아웃"} onClick={() => { if (window.confirm("로그아웃할까요? 이 기기에서 다시 로그인해야 합니다.")) fbAuth()?.signOut(); }}>🔒</button>}
        </div>
      </div>
      <div className="tab-bar" style={{ ...S.tabs, marginTop: 12 }}>
        {TABS_BY_WS[WS.key].map(t => <button key={t.id} style={S.tab(tab === t.id)} onClick={() => setTab(t.id)}>{t.icon} {t.label}</button>)}
      </div>
      <div style={{ marginTop: 8 }}>
        {/* B: 개인 루틴=매일 daily 반복 할일(TodayView). 옛 RoutineSection·setRoutineHist·sdToday 데드코드 제거(2026-06-23 ④-b). */}
        {tab === "today" && <><TodayView tasks={tasks} projects={projects} recurrings={recurrings} onDone={doneTask} onDel={delTask} onFocus={toggleFocus} onAdd={addTask} onEdit={handleEdit} onUpdate={updateTask} onPlanToday={planToday} onClearToday={clearToday} onReorder={reorderTask} /><RecurringSettings recurrings={recurrings} setRecurrings={setRecurrings} projects={projects} onUpdateRecurring={updateRecurring} /></>}
        {tab === "areas" && <AreaView tasks={tasks} projects={projects} recurrings={recurrings} history={history} onDone={doneTask} onDel={delTask} onFocus={toggleFocus} onAdd={addTask} onEdit={handleEdit} onAddProj={addProj} onEditProj={editProj} onDelProj={delProj} onUpdate={updateTask} isWork={isWork} setRecurrings={setRecurrings} onUpdateRecurring={updateRecurring} onAddSession={addRoutineSession} onRemoveSession={removeRoutineSession} onAddMemo={addAreaRecap} onEditMemo={editHistMemo} onDeleteMemo={deleteHistMemo} onSetFocus={setFocusArea} />}
        {tab === "history" && <HistoryView history={history} onRestore={restoreHist} onUncancel={uncancelHist} onEditMemo={editHistMemo} onDeleteMemo={deleteHistMemo} onSetFocus={setFocusArea} />}
      </div>
      {editTarget && <EditModal task={editTarget.task} projects={projects} onSave={handleEditSave} onClose={() => setEditTarget(null)} isSubtask={!!editTarget.parentId} isWork={isWork} />}
      {clearTarget && <ClearTodayModal task={clearTarget} onApply={(nd) => applyClearToday(clearTarget.id, nd)} onCancel={() => setClearTarget(null)} />}
      {toast && <Toast msg={toast.msg} onUndo={toast.undo} onX={hideT} />}
    </div>
  );
}

/* ═══ 인증 게이트 — 구글 로그인 1회/기기, 이후 영구세션(IndexedDB) ═══ */
function AuthGate() {
  const [state, setState] = useState("init"); /* init | signedout | signedin | open */
  const [err, setErr] = useState("");
  useEffect(() => {
    if (!FB_CONFIGURED) { setState("open"); return; } /* config 전 = 공개모드(기존 동작 유지) */
    const auth = fbAuth();
    if (!auth) { setState("open"); return; } /* SDK 로드 실패 시에도 흰 화면 대신 공개모드로 degrade */
    const unsub = auth.onAuthStateChanged(u => setState(u ? "signedin" : "signedout"));
    return () => unsub && unsub();
  }, []);

  /* popup 전용 — redirect 폴백은 쓰지 않는다: 호스팅(*.github.io)과 authDomain(firebaseapp.com)이
     달라 signInWithRedirect가 Safari/Firefox/최신 Chrome에서 조용히 실패함(Firebase 문서화된 제약). */
  const signIn = async () => {
    setErr("");
    const auth = fbAuth(); if (!auth) return;
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch (e) {
      const c = e && e.code;
      if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
        setErr("브라우저가 로그인 팝업을 차단했습니다. 주소창의 팝업 차단 아이콘에서 이 사이트의 팝업을 허용한 뒤 다시 눌러주세요.");
      } else if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") {
        setErr("로그인 창이 닫혔습니다. 다시 시도해 주세요.");
      } else if (c === "auth/operation-not-allowed") {
        setErr("Firebase 콘솔에서 Google 로그인 공급자를 켜야 합니다.");
      } else { setErr((e && e.message) || String(e)); }
    }
  };

  if (state === "init") return <div style={{ ...S.app, textAlign: "center", paddingTop: 100, color: "#9ca3af" }}>불러오는 중…</div>;
  if (state === "signedout") return (
    <div style={{ ...S.app, maxWidth: 380, textAlign: "center", paddingTop: 90 }}>
      <div style={{ fontSize: 40, marginBottom: 10 }}>🗂️</div>
      <div style={{ fontSize: 20, fontWeight: 700, color: "#111", marginBottom: 8 }}>Task Manager</div>
      <div style={{ fontSize: 13, color: "#6b7280", lineHeight: 1.6, marginBottom: 26 }}>내 데이터를 안전하게 — 이 기기에서 한 번만 로그인하면<br/>다음부터는 바로 열립니다.</div>
      <button onClick={signIn} style={{ display: "inline-flex", alignItems: "center", gap: 10, padding: "11px 22px", borderRadius: 8, border: "1px solid #d1d5db", background: "#fff", cursor: "pointer", fontSize: 14, fontWeight: 600, color: "#1f2937", boxShadow: "0 1px 2px rgba(0,0,0,0.06)" }}>
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="" /> 구글로 계속
      </button>
      {err && <div style={{ marginTop: 18, fontSize: 12, color: "#EF4444", lineHeight: 1.5 }}>{err}</div>}
    </div>
  );
  return <WorkspaceRoot />; /* signedin 또는 open */
}

/* ═══ 워크스페이스 루트 — 전환 시 App 리마운트(저장소 교체) ═══ */
function WorkspaceRoot() {
  const [wsKey, setWsKey] = useState(WS.key);
  const switchWs = () => {
    flushCloudSave(); /* ★E2(2026-07-05): 전환 전 대기 저장을 즉시 flush(예약 경로로) — 안 하면 2초 디바운스 중인 이 워크스페이스의 클라우드 저장이 새 워크스페이스 편집에 preempt돼 유실. flushCloudSave가 _pendingData/_pendingPath를 동기 캡처하므로 아래 WS 재할당 전 호출로 옛 경로 보존. */
    const nk = wsKey === "work" ? "personal" : "work";
    resetSyncState(); /* ★전환 = 다른 blob → PATCH diff 기준선 폐기(옛 워크스페이스 기준으로 새 blob 을 부분 write 하는 E2 클래스 사고 차단) */
    try { localStorage.setItem("tm-workspace", nk); } catch {}
    WS = WORKSPACES[nk];
    setWsKey(nk);
  };
  return <App key={wsKey} onSwitchWs={switchWs} />;
}

ReactDOM.render(<AuthGate />, document.getElementById("root"));
  </script>
</body>
</html>
