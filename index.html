  /* 반복 정의 수정(실행방법·시간) + 진행중 인스턴스에 전파(2026-07-01) */
  const updateRecurring = (id, patch) => {
    const newRec = { ...(recurrings.find(r => r.id === id) || {}), ...patch };
    setRecurrings(p => p.map(r => r.id === id ? { ...r, ...patch } : r));
    /* 인스턴스 전파 키(text/project/time/protocol). dows·type은 정의만 바꾸고 미래 생성에 반영 */
    if (!["protocol", "time", "text", "project"].some(k => k in patch)) return;
    const merge = (t) => ({ ...t,
      ...("protocol" in patch ? { protocol: patch.protocol } : {}),
      ...("time" in patch ? { planTime: patch.time } : {}),
      ...("text" in patch ? { text: patch.text } : {}),
      ...("project" in patch ? { project: patch.project } : {}) });
    const affected = tasks.filter(t => t.recurringId === id && t.status !== "done");
    setTasks(p => p.map(t => (t.recurringId === id && t.status !== "done") ? merge(t) : t));
  };
  /* 지난 루틴 소급 체크/해제(2026-07-01): 완료=history done 항목 + 미완료 인스턴스 정리 / 해제=반대 */
  /* ★＋ 뒤에도 「되돌리기」(2026-10-07). 잘못 누른 ＋ 를 바로잡는 길 = ＋ 직후 되돌리기 · 그 주 안 언제든 − · 히스토리 ↺. */
  const addRoutineSession = (rid, memo) => {
    const r = recordSession(rid, memo);
    if (r) showT(r.msg, () => { r.undo(); hideT(); });
  };
  const recordSession = (rid, memo) => {
    const rec = recurrings.find(r => r.id === rid); if (!rec) return null;
    const wk = getWeekId();
    const isWeekly = rec.type === "weekly";
    /* ★weekly 초과 기록 허용(2026-08-08 소유자 지시 — "레슨·링글도 다른 것들과 똑같이 초과 등록되게").
       규칙: **그 주 첫 회차만 정규키(wk), 2회차부터는 고유키(wk-x…)**.
       · 첫 회차가 정규키인 이유 = 그 주 예정 인스턴스와 같은 키여야 두 표시자리(오늘 할 일 / 영역 카드 ＋)가
         같은 회차를 가리켜 **한 세션이 2회로 잡히지 않는다**. 이것이 2026-08-02 가드의 실제 목적이었고 그대로 보존한다.
       · 2회차부터 고유키인 이유 = routineDoneSet 이 Set 이라 같은 키는 합쳐져 **아무리 눌러도 1** 이었다(이번 지시의 증상).
       · 이중계상 경로가 안 생기는 근거 = 2회차를 누르는 시점엔 그 주 정규 인스턴스가 이미 완료로 흡수돼(아래 pend) tasks[]에 없다.
       옛 하드블록(`>=1 이면 토스트 후 return`)은 제거 — 그것이 초과 등록을 막던 직접 원인. */
    const already = weekDoneCount(routineDoneSet(tasks, history), rid, wk);
    const period = (isWeekly && already === 0) ? wk : wk + "-x" + gid(); /* count: 고유 회차키 → 연타 언더카운트 레이스 없음(적대검증 C1b) */
    /* 그 주 대기 인스턴스가 있으면 그것을 완료로 흡수한다 — 안 그러면 tasks[] 에 유령으로 남는다(실측: 링글 rdbvi29 가 그렇게 열린 채였다). */
    /* 그 주 대기 인스턴스를 완료로 흡수한다. weekly 는 정규키(wk), count 는 오늘치(`wk-d오늘`)를 찾는다.
       흡수하지 않으면 ＋ 로 센 회차와 오늘 할 일에 남은 줄이 각각 세어져 **한 세션이 2회**가 된다. */
    const pend = (tasks || []).find(t => t.recurringId === rid && t.status !== "done" && !t.cancelled &&
      (isWeekly ? (t.recurringPeriod || "") === wk : (t.recurringPeriod || "").indexOf(wk + "-n") === 0)) || null;
    const proj = projects.find(p => p.id === rec.project);
    const memoTrim = (memo || "").trim();
    const orig = pend
      ? { ...pend, status: "done", recurringPeriod: period, recap: memoTrim || pend.recap || "" }
      : { id: gid(), text: rec.text, status: "done", project: rec.project || "proj_etc", recurringId: rid, recurringPeriod: period, recap: memoTrim, planDate: TODAY, planTime: rec.time || "", protocol: rec.protocol || "", createdAt: TODAY, subtasks: [] };
    setHistory(prev => { const item = { type: "done", text: orig.text, projectName: proj ? proj.name : "", project: orig.project, orig, time: nowTime() };
      const ex = prev.find(h => h.date === TODAY); if (ex) return prev.map(h => h.date === TODAY ? { ...h, items: [...h.items, item] } : h); return [...prev, { date: TODAY, items: [item] }]; });
    if (pend) setTasks(prev => prev.filter(t => t.id !== pend.id)); /* 완료로 흡수됐으므로 대기 목록에서 뺀다(일반 완료와 같은 처리) */
    return {
      msg: "\"" + rec.text + "\" 기록 ✅ (" + ((isWeekly && already === 0) ? "이번 주 완료" : "이번 주 +1") + (memoTrim ? " · 회고 저장" : "") + ")",
      /* 되돌리기 = 남긴 회차를 빼고, 흡수한 대기 인스턴스가 있으면 그대로 돌려놓는다 */
      undo: () => {
        setHistory(prev => prev.map(h => ({ ...h, items: (h.items || []).filter(it => !(it.type === "done" && it.orig && it.orig.id === orig.id)) })).filter(h => h.items.length > 0));
        if (pend) setTasks(prev => prev.some(t => t.id === pend.id) ? prev : [...prev, pend]);
      },
    };
  };

  /* 주N회 −(2026-07-07): 이번 주 '가장 최근' 완료 1건 취소(잘못 체크·오카운트 정정). history done 우선(➕·요일체크 공통), 없으면 tasks done.
     ★최근성=(날짜,시간) 최대로 선택(적대검증 R1: history 배열이 삽입순이라 소급체크가 뒤에 붙어도 실제 최신을 고름). 식별=orig.id(안정키). */
  const removeRoutineSession = (rid) => {
    const wk = getWeekId();
    const inWk = (per) => per === wk || (per || "").indexOf(wk + "-") === 0;
    let target = null, bestKey = "";
    (history || []).forEach(h => (h.items || []).forEach(it => { if (it.type === "done" && !it.cancelled && !it.memoOnly && it.orig && it.orig.recurringId === rid && inWk(it.orig.recurringPeriod)) { const key = (h.date || "") + "T" + (it.time || "00:00"); if (key >= bestKey) { bestKey = key; target = { kind: "hist", date: h.date, origId: it.orig.id }; } } })); /* ★memoOnly(📝메모만)=세션 아님 → − 취소 대상서 제외(2026-07-08) */
    if (!target) { const td = (tasks || []).filter(t => t.recurringId === rid && t.status === "done" && !t.cancelled && inWk(t.recurringPeriod || t.planDate)); if (td.length) { target = { kind: "task", taskId: td[td.length - 1].id }; } }
    if (!target) { showT("이번 주 취소할 완료 기록이 없습니다", null); return; }
    /* ★B안(2026-07-07): −는 기록을 삭제하지 않고 cancelled 표시 → 카운트만 −1, 히스토리엔 취소선으로 남아 '↺ 복원'으로 언제든 되살림.
       토스트 '되돌리기'=즉시 복원(=cancelled 해제). */
    if (target.kind === "hist") {
      setHistory(prev => prev.map(h => h.date === target.date ? { ...h, items: (h.items || []).map(it => (it.orig && it.orig.id === target.origId) ? { ...it, cancelled: true } : it) } : h));
      const rec0 = recurrings.find(r => r.id === rid);
      showT((rec0 ? "\"" + rec0.text + "\" " : "") + "이번 주 완료 1건 취소 — 히스토리서 복원 가능", () => { setHistory(prev => prev.map(h => h.date === target.date ? { ...h, items: (h.items || []).map(it => (it.orig && it.orig.id === target.origId) ? { ...it, cancelled: false } : it) } : h)); hideT(); }); /* R1(2026-07-08): 되돌리기=능동 재-lay(closure history엔 target 아직 non-cancelled→excludeId 없이 메모 포함)로 즉시 복귀. futureThrough:"" 리셋 레이스·once-per-mount futureEvtDone 의존 제거 */
    } else {
      setTasks(prev => prev.map(t => t.id === target.taskId ? { ...t, cancelled: true } : t));
      showT("이번 주 완료 1건 취소 — 복원 가능", () => { setTasks(prev => prev.map(t => t.id === target.taskId ? { ...t, cancelled: false } : t)); hideT(); });
    }
  };

  /* 주N회 '📝 메모만'(2026-07-08): 세션 카운트 없이 발견/메모만 기록 → 루틴 탭 영역 카드에 모인다.
     '수행은 안 했지만 남길 게 있는' 경우(예: 레슨만 받은 날) 자리. memoOnly=true → routineDoneSet·− 스캔·완료수서 제외(카운트 무관),
     routineMemoText엔 포함(비취소 done+notes)돼 이월. 히스토리서 ✏️(editHistMemo)·🗑(deleteHistMemo)로 수정/삭제·↺복원 가능(2026-07-25). */
  /* ★영역 메모(2026-09-14 소유자) — 세션에 묶지 않는다. 어느 세션에서 나왔든 같은 영역이면 한 흐름이라
     「어디에 적을까」를 판단할 일이 없어야 한다. 세션 완료로 남긴 메모와 같은 자리에 쌓인다. */
  const addAreaRecap = (projectId, memo) => {
    const memoTrim = (memo || "").trim();
    if (!memoTrim) return;
    const proj = projects.find(p => p.id === projectId);
    const orig = { id: gid(), text: "", status: "done", project: projectId || "proj_etc", recap: memoTrim, planDate: TODAY, createdAt: TODAY };
    setHistory(prev => {
      const item = { type: "done", memoOnly: true, areaMemo: true, text: "", projectName: proj ? proj.name : "", project: orig.project, orig, time: nowTime() };
      const ex = prev.find(h => h.date === TODAY);
      if (ex) return prev.map(h => h.date === TODAY ? { ...h, items: [...h.items, item] } : h);
      return [...prev, { date: TODAY, items: [item] }];
    });
    showT("회고 저장 ✅", null);
  };
  /* 완료 메모 삭제(2026-07-25 통일 → 같은 날 **전 완료항목으로 확장**·소유자: 업무·개인 공통):
     memoOnly=항목 취소 / done-with-memo=메모만 클리어(루틴이면 ★수행 카운트 유지).
      되돌리기 토스트로 복원.
     ★closure history 를 map(fn) 해 patched fresh 로 재-lay(setHistory 는 async 라 closure 는 아직 옛 상태). */
  const deleteHistMemo = (date, idx) => {
    const day = (history || []).find(h => h.date === date); const it0 = day && day.items[idx];
    if (!it0 || !it0.orig) return;
    const rid = it0.orig.recurringId; const rec0 = rid && recurrings.find(r => r.id === rid);
    const wasMemoOnly = !!it0.memoOnly; const oldNotes = it0.orig.recap || "";
    const del = (h) => h.date === date ? { ...h, items: (h.items || []).map((it, i) => i === idx
        ? (wasMemoOnly ? { ...it, cancelled: true } : { ...it, orig: { ...it.orig, recap: "" } }) : it) } : h;
    setHistory(prev => prev.map(del));
    showT(wasMemoOnly ? "회고 삭제 · 되돌리기" : (rec0 ? "회고 삭제(카운트 유지) · 되돌리기" : "회고 삭제(완료 기록 유지) · 되돌리기"), () => {
      const undo = (h) => h.date === date ? { ...h, items: (h.items || []).map((it, i) => i === idx
          ? (wasMemoOnly ? { ...it, cancelled: false } : { ...it, orig: { ...it.orig, recap: oldNotes } }) : it) } : h;
      setHistory(prev => prev.map(undo));
      hideT();
    });
  };
  /* 완료 메모 수정(2026-07-25 소유자 · 같은 날 전 완료항목으로 확장): orig.notes 편집 = **원본 수정**
     (최상위 완료 항목은 tasks[] 에서 빠지고 history.orig 이 유일 정본 — L2670·L2675).
     빈 텍스트면 삭제로 위임(사실상 삭제·완료 기록/카운트는 유지). */
  const editHistMemo = (date, idx, newText) => {
    const day = (history || []).find(h => h.date === date); const it0 = day && day.items[idx];
    if (!it0 || !it0.orig) return;
    const txt = (newText || "").trim();
    if (!txt) { deleteHistMemo(date, idx); return; } /* 빈 저장 = 삭제 위임(좀비 '📝메모만' 행 방지 + 되돌리기 제공·적대검증) */
    const rid = it0.orig.recurringId; const rec0 = rid && recurrings.find(r => r.id === rid);
    const ed = (h) => h.date === date ? { ...h, items: (h.items || []).map((it, i) => i === idx ? { ...it, orig: { ...it.orig, recap: txt } } : it) } : h;
    setHistory(prev => prev.map(ed));
    showT("회고 수정 ✅", null);
  };

  const addTask = ({ text, status, project, focus, scheduledDate, scheduledLabel, planDate }) => {
    const proj = projects.find(p => p.id === project);
    const tid = gid();
    const pd = planDate || ""; /* ★2026-07-04: 폼 날짜 그대로(빈 값 허용) — 날짜 비우면 과제 안 백로그, 날짜 있으면 그 날 뜸. 강제 today 폐지 */
    const autoFocus = focus; /* 별=집중(날짜와 분리, 2026-06-30) — 오늘 표출은 수행날짜로 */
    const newTask = { id: tid, text, status, project, scheduledDate: scheduledDate || "", scheduledLabel: scheduledLabel || "", planDate: pd, createdAt: TODAY, notes: "", focus: autoFocus, subtasks: [] };
    setTasks(p => [...p, newTask]);
    addHistItem({ type: "added", text, projectName: proj?.name || "", project, time: nowTime() });
  };

  const toggleFocus = (id) => {
    const task = tasks.find(t => t.id === id);
    if (task) {
      const proj = projects.find(p => p.id === task.project);
      addHistItem({ type: "edited", text: task.text, projectName: proj?.name || "", detail: !task.focus ? "⭐ 지금 먼저" : "⭐ 지금 먼저 해제", time: nowTime() });
    }
    setTasks(p => p.map(t => t.id === id ? { ...t, focus: !t.focus } : t));
  };
  /* '오늘 할 일'로 드래그 → 수행날짜를 오늘로(2026-06-30). */
  const planToday = (id) => {
    const t = tasks.find(x => x.id === id);
    if (!t || t.planDate === TODAY) return;
    const updated = { ...t, planDate: TODAY };
    setTasks(p => p.map(x => x.id === id ? updated : x));
    const proj = projects.find(p => p.id === t.project);
    addHistItem({ type: "edited", text: t.text, projectName: proj?.name || "", detail: "📆 오늘로", time: nowTime() });
  };
  /* '오늘 할 일'에서 내리기(전체 현황으로 드래그) → 수행날짜 비움(2026-07-01). */
  /* 오늘에서 내리기: 무조건 날짜 삭제 대신 얼럿 열기(변경/없앰/취소) — 놓침 방지(2026-07-04, 소유자) */
  const clearToday = (id) => { const t = tasks.find(x => x.id === id); if (!t || !t.planDate) return; setClearTarget(t); };
  const applyClearToday = (id, newDate) => { /* newDate="" → 날짜 없앰(백로그) / 날짜 → 그 날짜로 변경 */
    setClearTarget(null);
    const t = tasks.find(x => x.id === id); if (!t) return;
    const updated = { ...t, planDate: newDate || "" };
    setTasks(p => p.map(x => x.id === id ? updated : x));
    const proj = projects.find(p => p.id === t.project);
    addHistItem({ type: "edited", text: t.text, projectName: proj?.name || "", detail: newDate ? `📆 ${newDate}로 변경` : "📆 오늘에서 내림(날짜 없앰)", time: nowTime() });
  };
  const updateTask = (updated) => {
    const cur = tasks.find(t => t.id === updated.id);
    setTasks(p => p.map(t => t.id === updated.id ? updated : t));
    syncSubDoneHist(cur, updated);
  };

  const handleEdit = (taskOrSub, parentId) => setEditTarget({ task: taskOrSub, parentId: parentId || null });
  /* 하위 할일 줄의 ✕(2026-10-07) — 지금까지는 되돌리기 없이 지웠다. 5초 「되돌리기」를 준다.
     지울 때는 옛 경로처럼 updateTask → syncSubDoneHist 가 이 하위의 완료 이력을 걷고, 되돌릴 때는 걷힌 이력을 원래 날짜·시각 그대로 되살린다. */
  const delSub = (parentId, subId) => {
    const par = tasks.find(t => t.id === parentId); if (!par) return;
    const list = par.subtasks || []; const idx = list.findIndex(s => s.id === subId); if (idx < 0) return;
    const sub = list[idx];
    const doneSnap = [];
    (history || []).forEach(h => (h.items || []).forEach(it => { if (it.type === "done" && it.isSub && it.orig?.id === subId) doneSnap.push({ date: h.date, item: it }); }));
    updateTask({ ...par, subtasks: list.filter(s => s.id !== subId) });
    /* ★하위 삭제도 히스토리에 남긴다(2026-10-08 · 소유자 「이전에도 안남았던 것인지? 왜 안남게 한건지?」 — 처음부터 남지 않았다).
       할 일 삭제처럼 원본과 걷어 낸 완료 기록을 함께 남겨 5초가 지나도 히스토리 ↩ 로 상위 할 일 아래에 되살린다. */
    const proj = projects.find(p => p.id === par.project);
    addHistItem({ type: "deleted", isSub: true, subParent: parentId, parentText: par.text, text: sub.text, projectName: proj?.name || "", project: par.project, time: nowTime(),
      orig: { ...sub }, ...(doneSnap.length ? { subDone: doneSnap } : {}) });
    showT(`"${tName(sub.text)}" 삭제됨`, () => {
      removeHistItem(it => it.type === "deleted" && it.isSub && it.orig && it.orig.id === subId);
      setTasks(p => p.map(t => { if (t.id !== parentId) return t; const cur = t.subtasks || []; if (cur.some(s => s.id === subId)) return t;
        return { ...t, subtasks: [...cur.slice(0, idx), sub, ...cur.slice(idx)] }; }));
      if (doneSnap.length) setHistory(prev => { let next = [...prev]; doneSnap.forEach(({ date, item }) => { const ex = next.find(h => h.date === date); if (ex) next = next.map(h => h.date === date ? { ...h, items: [...h.items, item] } : h); else next = [...next, { date, items: [item] }]; }); return next; });
      hideT();
    });
  };
  const handleEditSave = (updated) => {
    if (!editTarget) return;
    if (editTarget.parentId) {
      /* (폐지 2026-06-30) 수행날짜=오늘 자동별표 제거 — 별=집중 업무(날짜 무관) */
      setTasks(p => p.map(t => t.id === editTarget.parentId ? { ...t, subtasks: (t.subtasks || []).map(s => s.id === updated.id ? { ...updated, } : s) } : t));
      /* 서브태스크 완료 이력 동기(부모 과제 기준) */
      const par = tasks.find(t => t.id === editTarget.parentId);
      if (par) syncSubDoneHist(par, { ...par, subtasks: (par.subtasks || []).map(s => s.id === updated.id ? updated : s) });
    } else {
      const prev = tasks.find(t => t.id === updated.id);
      /* ★편집모달 덮어쓰기 방지(2026-07-04): 모달이 열려있는 동안 비동기로 찍힌 calEventId/calUpdated를
         스냅샷이 덮지 않게 현재값 우선 보존(서브도 id별로). 편집 필드는 updated 적용. */
      setTasks(p => p.map(t => t.id === updated.id ? { ...updated,
        subtasks: (updated.subtasks || []).map(ns => { const c = (t.subtasks || []).find(x => x.id === ns.id); return c ? { ...ns } : ns; }) } : t));
      if (!prev) return;
      const proj = projects.find(p => p.id === updated.project);
      const changes = [];
      if (prev.status !== updated.status) changes.push(`상태: ${STATUSES[prev.status]?.label || prev.status}→${STATUSES[updated.status]?.label || updated.status}`);
      if (prev.text !== updated.text) changes.push(`내용 수정`);
      if (prev.project !== updated.project) { const pp = projects.find(p => p.id === prev.project); changes.push(`과제: ${pp?.name || prev.project}→${proj?.name || updated.project}`); }
      if (prev.planDate !== updated.planDate) changes.push(`계획일: ${prev.planDate || "없음"}→${updated.planDate || "없음"}`);
      if (prev.scheduledDate !== updated.scheduledDate) changes.push(`마감일: ${prev.scheduledDate || "없음"}→${updated.scheduledDate || "없음"}`);
      if (prev.focus !== updated.focus) changes.push(updated.focus ? "⭐ 지금 먼저" : "⭐ 지금 먼저 해제");
      if (!!prev.respPlan !== !!updated.respPlan) changes.push(updated.respPlan ? "업무 대응안에 포함" : "업무 대응안에서 뺌");
      if (prev.notes !== updated.notes) changes.push("메모 수정");
      if ((prev.recap || "") !== (updated.recap || "")) changes.push("회고 수정");
      if (changes.length > 0) {
        if (prev.status !== updated.status) {
          addHistItem({ type: "status", text: updated.text, projectName: proj?.name || "", from: prev.status, to: updated.status, detail: changes.join(" · "), time: nowTime() });
          showT(`${STATUSES[prev.status]?.label} → ${STATUSES[updated.status]?.label}`, () => { setTasks(p => p.map(t => t.id === updated.id ? prev : t)); hideT(); });
        } else {
          addHistItem({ type: "edited", text: updated.text, projectName: proj?.name || "", detail: changes.join(" · "), time: nowTime() });
        }
      }
    }
  };

  /* 되돌리기용 사본 — 원본 객체를 직접 고치지 않게 한다(하위 할일까지 새 객체). */
  const cloneTask = (t) => ({ ...t, subtasks: (t.subtasks || []).map(s => ({ ...s })) });
  /* ★메모와 회고를 가른다.
     메모(notes) = 그 일을 **할 때 볼 것**. 그 태스크를 펼칠 때만 보인다.
     회고(recap) = 그 일을 **하고 나서 남긴 것**. 영역 카드에 쌓이고 /sweep 이 수확한다.
     둘이 한 칸에 섞여 있어 영역 카드에 참조용 메모까지 떠 있었다. */
  const doneTask = (id) => {
    if (!doneGuard()) return; /* 0.6초 안 두 번째 완료는 무시(위 doneGuard) */
    const task = tasks.find(t => t.id === id); if (!task) return;
    const proj = projects.find(p => p.id === task.project);
    const snap = { ...task, recap: (task.recap || "").trim() };
    setTasks(p => p.filter(t => t.id !== id));
    const subCount = (task.subtasks || []).length;
    addHistItem({ type: "done", text: task.text, projectName: proj?.name || "", project: task.project, orig: snap, subCount, time: nowTime() });
    showT(`"${tName(task.text)}" 완료`, () => {
      setTasks(p => [...p, cloneTask(snap)]);
      removeHistItem(it => it.type === "done" && it.orig?.id === id);
      hideT();
    });
  };

  const delTask = (id) => {
    const task = tasks.find(t => t.id === id); if (!task) return;
    const proj = projects.find(p => p.id === task.project);
    /* 자식 done 히스토리 고아 정리: 삭제 전 이 부모의 서브 done 항목 스냅샷 후 제거(undo 시 verbatim 복원) */
    const orphanSubDone = [];
    (history || []).forEach(h => (h.items || []).forEach(it => { if (it.type === "done" && it.isSub && it.subParent === id) orphanSubDone.push({ date: h.date, item: it }); }));
    setTasks(p => p.filter(t => t.id !== id));
    if (orphanSubDone.length) setHistory(prev => prev.map(h => ({ ...h, items: (h.items || []).filter(it => !(it.type === "done" && it.isSub && it.subParent === id)) })).filter(h => h.items.length > 0));
    /* 반복 인스턴스 삭제 시 orig(recurringId+period)를 남겨 '이 회차 건너뜀'으로 기록 → 같은 기간 재생성 방지(2026-07-03).
       반복 자체를 멈추려면 반복설정에서 삭제. */
    addHistItem({ type: "deleted", text: task.text, projectName: proj?.name || "", time: nowTime(),
      ...(task.recurringId ? { orig: { id: task.id, recurringId: task.recurringId, recurringPeriod: task.recurringPeriod, notes: task.notes } }
        : { orig: cloneTask(task), ...(orphanSubDone.length ? { subDone: orphanSubDone } : {}) }) }); /* 일반 할 일은 원본(과 걷어 낸 하위 완료 기록)을 남겨 히스토리 ↩ 로 되살린다(2026-10-07 · 연달아 지우다 알림이 바뀌어도 나중에 살린다) */
    showT(`"${tName(task.text)}" 삭제됨`, () => {
      setTasks(p => [...p, cloneTask(task)]);
      if (orphanSubDone.length) setHistory(prev => { let next = [...prev]; orphanSubDone.forEach(({ date, item }) => { const ex = next.find(h => h.date === date); if (ex) next = next.map(h => h.date === date ? { ...h, items: [...h.items, item] } : h); else next = [...next, { date, items: [item] }]; }); return next; });
      removeHistItem(it => it.type === "deleted" && (it.orig ? it.orig.id === task.id : it.text === task.text)); /* 같은 제목의 다른 삭제 기록은 남긴다 */
      hideT();
    });
  };

  const restoreHist = (date, idx) => {
    /* ★반복 회차 줄(＋·요일 체크로 남은 루틴 1회)의 ↩ 는 − 와 같이 취소 표시만 한다(2026-10-07).
       예전에는 「완료」 상태 그대로 할 일 목록에 들어가 화면에는 안 보이면서 앱 숫자에는 남고, 히스토리만 읽는 주간 집계에서는 빠졌다. */
    const day0 = (history || []).find(h => h.date === date); const it0 = day0 && day0.items[idx];
    if (it0 && it0.type === "done" && it0.orig && it0.orig.recurringId && it0.orig.status === "done" && !it0.memoOnly) {
      const oid = it0.orig.id;
      setHistory(prev => prev.map(h => h.date === date ? { ...h, items: (h.items || []).map(it => (it.orig && it.orig.id === oid) ? { ...it, cancelled: true } : it) } : h));
      showT("\"" + (it0.text || "") + "\" 이번 주 완료 1건 취소 — 히스토리서 복원 가능", () => { setHistory(prev => prev.map(h => h.date === date ? { ...h, items: (h.items || []).map(it => (it.orig && it.orig.id === oid) ? { ...it, cancelled: false } : it) } : h)); hideT(); });
      return;
    }
    setHistory(prev => {
      const day = prev.find(h => h.date === date); if (!day?.items[idx]) return prev;
      const item = day.items[idx];
      const restored0 = item.orig || { id: gid(), text: item.text, status: "action", project: projects.find(p => p.name === item.projectName)?.id || projects[0]?.id, scheduledDate: "", scheduledLabel: "", planDate: "",  createdAt: TODAY, notes: "", focus: false, subtasks: [] };
      /* 그 할 일의 카드가 걷혔으면(종료 카드) 이름이 같은 카드 → 기타 업무(업무)로 되살린다. 둘 다 없으면 첫 카드로 자동 배정하지 않고
         원래 id 를 두어 수정 창이 「주제 선택…」으로 묻게 한다(첫 항목 자동 선택은 오분류를 부른다 — AddForm 과 같은 규칙).
         갈 카드가 없는 할 일은 영역 탭 어디에도 안 보이므로, 날짜가 없으면 오늘 할 일에 띄워 거기서 고르게 한다. */
      const liveProj = (id) => projects.some(p => p && p.id === id) ? id : ((projects.find(p => p && p.name === item.projectName) || projects.find(p => p && p.id === "proj_etc") || {}).id || id || "");
      const placeOrphan = (t) => { if (!t.planDate && !projects.some(p => p && p.id === t.project)) t.planDate = TODAY; return t; };
      if (item.type === "deleted" && item.isSub && item.orig) {
        /* 지운 하위: 상위 할 일이 남아 있으면 그 아래에, 없으면(상위도 지웠거나 끝냄) 같은 주제의 할 일로 되살린다 */
        const sub0 = { ...item.orig };
        setTasks(p => p.some(t => t.id === item.subParent)
          ? p.map(t => t.id === item.subParent && !(t.subtasks || []).some(x => x.id === sub0.id) ? { ...t, subtasks: [...(t.subtasks || []), sub0] } : t)
          : [...p, placeOrphan(cloneTask({ ...sub0, project: liveProj(item.project), status: sub0.status === "done" ? "action" : sub0.status, subtasks: [], createdAt: sub0.createdAt || TODAY }))]);
      } else {
      const restored = cloneTask(restored0); /* 원본을 직접 고치지 않게 사본으로 되돌린다 */
      restored.project = liveProj(restored.project);
      if (!restored.planDate && item.type !== "deleted") restored.planDate = TODAY; /* 지운 할 일은 원래 날짜(없으면 없음) 그대로 되살린다 */
      placeOrphan(restored);
      setTasks(p => [...p, restored]);
      }
      const ni = day.items.filter((_, i) => i !== idx);
      let next = !ni.length ? prev.filter(h => h.date !== date) : prev.map(h => h.date === date ? { ...h, items: ni } : h);
      /* 지운 할 일에 딸려 걷혔던 하위 완료 기록을 원래 날짜에 되돌린다(이미 있으면 두 번 넣지 않는다) — 알림의 되돌리기와 같은 결과 */
      if (item.type === "deleted" && Array.isArray(item.subDone)) {
        const has = new Set(); next.forEach(h => (h.items || []).forEach(it => { if (it.type === "done" && it.isSub && it.orig) has.add(it.orig.id); }));
        item.subDone.forEach(({ date: d, item: it }) => { if (!it || !it.orig || has.has(it.orig.id)) return;
          next = next.some(h => h.date === d) ? next.map(h => h.date === d ? { ...h, items: [...h.items, it] } : h) : [...next, { date: d, items: [it] }]; });
      }
      return next;
    });
    showT("할일로 복원됨", null);
  };
  /* 주N회 −취소 복원(2026-07-07·B안): cancelled 표시된 히스토리 완료를 되살림 → 다시 이번 주 카운트에 포함 */
  const uncancelHist = (date, idx) => {
    setHistory(prev => prev.map(h => h.date === date ? { ...h, items: (h.items || []).map((it, i) => i === idx ? { ...it, cancelled: false } : it) } : h));
    const day = (history || []).find(h => h.date === date); const it0 = day && day.items[idx]; const rid = it0 && it0.orig && it0.orig.recurringId;
    const rec0 = rid && recurrings.find(r => r.id === rid);
    showT(it0 && it0.memoOnly ? "회고 복원됨 (카운트 변화 없음)" : "복원됨 · 카운트 +1", null);
  };

  /* ★집중(2026-09-14 소유자 정의) — 「일반적인 루틴을 수행하고 남는 시간을 어디에 더 쓸지」다.
     tier 를 올리는 것이 아니라 **추가 투입처**를 하나 고르는 것이라, 표시는 영역 카드의 별 하나면 된다.
     루틴이든 프로젝트든 구분하지 않는다 — 시간은 하나의 통이다. 언제나 0개 또는 1개. */
  const setFocusArea = (pid) => {
    /* 바뀐 것을 알리고 되돌릴 수 있게 하고, 히스토리에 한 줄 남긴다(2026-10-07) — 10-05~06 사이에 집중 별이 꺼졌는데 기록이 없어 이유를 알 수 없었다. */
    const before = projects.map(p => ({ id: p.id, focus: !!p.focus }));
    const tgt = projects.find(p => p.id === pid); const old = projects.find(p => p.focus && p.id !== pid);
    setProjects(prev => prev.map(p => p.id === pid ? { ...p, focus: !p.focus } : { ...p, focus: false }));
    if (!tgt) return;
    const detail = tgt.focus ? `⭐ 집중 해제: ${tgt.name}` : `⭐ 집중: ${old ? old.name + " → " : ""}${tgt.name}`;
    const hid = gid();
    addHistItem({ type: "edited", text: tgt.name, projectName: tgt.name, project: tgt.id, detail, focusArea: true, hid, time: nowTime() });
    showT(detail.replace("⭐ ", ""), () => {
      setProjects(prev => prev.map(p => { const b = before.find(x => x.id === p.id); return b ? { ...p, focus: b.focus } : p; }));
      removeHistItem(it => it.focusArea && it.hid === hid);
      hideT();
    });
  };
  /* ★순서 바꾸기(2026-09-14 복원) — 오늘 탭 목록 안에서만. tasks 배열의 자리를 바꾼다.
     수행날짜·상태는 건드리지 않는다(구 「오늘에서 내리기」는 복원하지 않았다). */
  const reorderTask = (fromId, toId, pos) => {
    setTasks(prev => {
      const arr = [...prev];
      const fromIdx = arr.findIndex(t => t.id === fromId);
      if (fromIdx < 0) return prev;
      const [item] = arr.splice(fromIdx, 1);
      let toIdx = arr.findIndex(t => t.id === toId);
      if (toIdx < 0) return prev;
      if (pos === "after") toIdx++;
      arr.splice(toIdx, 0, item);
      return arr;
    });
  };
  /* (cleanup 2026-10-08) addProj·editProj·delProj 제거 — 영역·과제 카드의 생성·삭제·이름 수정은 소유자 요청으로 코드에서 한다
     (AreaView 맨 아래 ★주석). 카드를 걷는 길은 RETIRED_PROJ_IDS(개인 · S4a)·RETIRED_WORK_PROJ_IDS(업무 · workRetireDone)이고,
     두 곳 모두 할 일·반복(꺼진 것 포함)이 붙은 카드는 걷지 않는다(참조 무결성 · 2026-06-30 사고). */

  const exportData = () => {
    const data = JSON.stringify({ tasks, projects, history, recurrings, exportedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([data], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `task-manager-${TODAY}.json`; a.click(); URL.revokeObjectURL(url);
  };
  /* 불러오기(JSON 복원) 철거 — 실사용 0회였고, 잘못 누르면 서버 데이터를 통째로 덮어쓰는 유일한 경로였다. */


  const allFocused = useMemo(() => {
    let c = 0;
    tasks.forEach(t => {
      if (t.status !== "done" && t.focus) c++; /* ★minor: ⭐=집중(focus)만 — planDate==오늘(루틴 4개 등) 오염 제거 */
      (t.subtasks || []).forEach(s => { if (s.status !== "done" && s.focus) c++; });
    });
    return c;
  }, [tasks]);
  const activeCnt = tasks.filter(t => t.status === "action").length;

  return (
    <div className="app-wrap" style={S.app}>
      <div className="hdr-wrap" style={S.hdr}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span style={S.ttl}>Task Manager</span>
          <button style={{ ...S.gh, fontWeight: 700, fontSize: 12, background: isWork ? "#EFF6FF" : "#FEF3C7", borderColor: isWork ? "#93C5FD" : "#FCD34D" }} onClick={onSwitchWs} title="업무 ⇄ 개인 전환">{WS.icon} {WS.label} ⇄</button>
          <span style={{ fontSize: 12, color: "#F59E0B", fontWeight: 600 }}>⭐{allFocused}</span>
          <span style={{ fontSize: 12, color: "#9ca3af" }}>다음행동 {activeCnt}건</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span id="sync-status" style={{ fontSize: 10, color: "#9ca3af" }}>☁️</span>
          <span style={{ fontSize: 10, color: "#10B981" }}>● 자동 저장</span>
          <button style={S.gh} onClick={exportData}>📤 백업</button>
          {FB_CONFIGURED && fbUser() && <button style={S.gh} title={fbUser().email || "로그아웃"} onClick={() => { if (window.confirm("로그아웃할까요? 이 기기에서 다시 로그인해야 합니다.")) fbAuth()?.signOut(); }}>🔒</button>}
        </div>
      </div>
      <div className="tab-bar" style={{ ...S.tabs, marginTop: 12 }}>
        {TABS_BY_WS[WS.key].map(t => <button key={t.id} style={S.tab(tab === t.id)} onClick={() => setTab(t.id)}>{t.icon} {t.label}</button>)}
      </div>
      <div ref={tabTopRef} style={{ marginTop: 8 }}>
        {/* B: 개인 루틴=매일 daily 반복 할일(TodayView). 옛 RoutineSection·setRoutineHist·sdToday 데드코드 제거(2026-06-23 ④-b). */}
        {tab === "today" && <><TodayView onDelSub={delSub} tasks={tasks} projects={projects} recurrings={recurrings} history={history} onDone={doneTask} onDel={delTask} onFocus={toggleFocus} onAdd={addTask} onEdit={handleEdit} onUpdate={updateTask} onPlanToday={planToday} onClearToday={clearToday} onReorder={reorderTask} onAddSession={addRoutineSession} onRemoveSession={removeRoutineSession} /><RecurringSettings recurrings={recurrings} setRecurrings={setRecurrings} projects={projects} onUpdateRecurring={updateRecurring} tasks={tasks} history={history} /></>}
        {tab === "areas" && <AreaView onDelSub={delSub} tasks={tasks} projects={projects} recurrings={recurrings} history={history} onDone={doneTask} onDel={delTask} onFocus={toggleFocus} onAdd={addTask} onEdit={handleEdit} onUpdate={updateTask} isWork={isWork} setRecurrings={setRecurrings} onUpdateRecurring={updateRecurring} onAddSession={addRoutineSession} onRemoveSession={removeRoutineSession} onAddMemo={addAreaRecap} onEditMemo={editHistMemo} onDeleteMemo={deleteHistMemo} onSetFocus={setFocusArea} />}
        {tab === "history" && <HistoryView history={history} onRestore={restoreHist} onUncancel={uncancelHist} onEditMemo={editHistMemo} onDeleteMemo={deleteHistMemo} onSetFocus={setFocusArea} />}
      </div>
      {editTarget && <EditModal task={editTarget.task} projects={projects} onSave={handleEditSave} onClose={() => setEditTarget(null)} isSubtask={!!editTarget.parentId} isWork={isWork} />}
      {clearTarget && <ClearTodayModal task={clearTarget} onApply={(nd) => applyClearToday(clearTarget.id, nd)} onCancel={() => setClearTarget(null)} />}
      {toast && <Toast key={toast.k} msg={toast.msg} onUndo={toast.undo} onX={hideT} />}
    </div>
  );
}

/* ═══ 인증 게이트 — 구글 로그인 1회/기기, 이후 영구세션(IndexedDB) ═══ */
function AuthGate() {
  const [state, setState] = useState("init"); /* init | signedout | signedin | open */
  const [err, setErr] = useState("");
  useEffect(() => {
    if (!FB_CONFIGURED) { setState("open"); return; } /* config 전 = 공개모드(기존 동작 유지) */
    const auth = fbAuth();
    if (!auth) { setState("open"); return; } /* SDK 로드 실패 시에도 흰 화면 대신 공개모드로 degrade */
    const unsub = auth.onAuthStateChanged(u => setState(u ? "signedin" : "signedout"));
    return () => unsub && unsub();
  }, []);

  /* popup 전용 — redirect 폴백은 쓰지 않는다: 호스팅(*.github.io)과 authDomain(firebaseapp.com)이
     달라 signInWithRedirect가 Safari/Firefox/최신 Chrome에서 조용히 실패함(Firebase 문서화된 제약). */
  const signIn = async () => {
    setErr("");
    const auth = fbAuth(); if (!auth) return;
    const provider = new firebase.auth.GoogleAuthProvider();
    try {
      await auth.signInWithPopup(provider);
    } catch (e) {
      const c = e && e.code;
      if (c === "auth/popup-blocked" || c === "auth/operation-not-supported-in-this-environment") {
        setErr("브라우저가 로그인 팝업을 차단했습니다. 주소창의 팝업 차단 아이콘에서 이 사이트의 팝업을 허용한 뒤 다시 눌러주세요.");
      } else if (c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request") {
        setErr("로그인 창이 닫혔습니다. 다시 시도해 주세요.");
      } else if (c === "auth/operation-not-allowed") {
        setErr("Firebase 콘솔에서 Google 로그인 공급자를 켜야 합니다.");
      } else { setErr((e && e.message) || String(e)); }
    }
  };

  if (state === "init") return <div style={{ ...S.app, textAlign: "center", paddingTop: 100, color: "#9ca3af" }}>불러오는 중…</div>;
  if (state === "signedout") return (
    <div style={{ ...S.app, maxWidth: 380, textAlign: "center", paddingTop: 90 }}>
      <div style={{ fontSize: 40, marginBottom: 10 }}>🗂️</div>
      <div style={{ fontSize: 20, fontWeight: 700, color: "#111", marginBottom: 8 }}>Task Manager</div>
      <div style={{ fontSize: 13, color: "#6b7280", lineHeight: 1.6, marginBottom: 26 }}>내 데이터를 안전하게 — 이 기기에서 한 번만 로그인하면<br/>다음부터는 바로 열립니다.</div>
      <button onClick={signIn} style={{ display: "inline-flex", alignItems: "center", gap: 10, padding: "11px 22px", borderRadius: 8, border: "1px solid #d1d5db", background: "#fff", cursor: "pointer", fontSize: 14, fontWeight: 600, color: "#1f2937", boxShadow: "0 1px 2px rgba(0,0,0,0.06)" }}>
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" height="18" alt="" /> 구글로 계속
      </button>
      {err && <div style={{ marginTop: 18, fontSize: 12, color: "#EF4444", lineHeight: 1.5 }}>{err}</div>}
    </div>
  );
  return <WorkspaceRoot />; /* signedin 또는 open */
}

/* ═══ 워크스페이스 루트 — 전환 시 App 리마운트(저장소 교체) ═══ */
function WorkspaceRoot() {
  const [wsKey, setWsKey] = useState(WS.key);
  const switchWs = () => {
    flushCloudSave(); /* ★E2(2026-07-05): 전환 전 대기 저장을 즉시 flush(예약 경로로) — 안 하면 2초 디바운스 중인 이 워크스페이스의 클라우드 저장이 새 워크스페이스 편집에 preempt돼 유실. flushCloudSave가 _pendingData/_pendingPath를 동기 캡처하므로 아래 WS 재할당 전 호출로 옛 경로 보존. */
    const nk = wsKey === "work" ? "personal" : "work";
    resetSyncState(); /* ★전환 = 다른 blob → PATCH diff 기준선 폐기(옛 워크스페이스 기준으로 새 blob 을 부분 write 하는 E2 클래스 사고 차단) */
    try { localStorage.setItem("tm-workspace", nk); } catch {}
    WS = WORKSPACES[nk];
    setWsKey(nk);
  };
  return <App key={wsKey} onSwitchWs={switchWs} />;
}

ReactDOM.render(<AuthGate />, document.getElementById("root"));
  </script>
</body>
</html>
