  <!-- ★CDN exact pin(2026-07-25 소유자 지시) — bare major(`@18`·`@7`)는 **버전 고정이 아니다**.
       unpkg 의 major URL 은 302 리다이렉트 + `max-age=60` 이라 새 패치/마이너가 나오면 **1분 안에** 전 사용자에게
       자동 승급된다(반면 exact URL 은 `max-age=31536000` = 사실상 불변). 6/17 전체 백지 사고가 정확히 이 기전
       (`@babel/standalone` 비고정 → v8 자동승급 → automatic JSX runtime 이 import 방출 → UMD 에서 백지)이었고,
       그때 `@7` 로 major 만 막은 것은 **같은 사고를 한 자릿수 좁힌 것이지 없앤 게 아니다**.
       고정 시점 실측: `@18`→18.3.1, `@7`→7.29.7 로 해석되며 exact URL 과 **바이트 동일**(sha256 대조) →
       이 고정은 동작 변경 0. babel 7.29.7 은 CI 핀(`@babel/core@7.29.7`, pages.yml)과 **정확히 일치**한다.
       ⚠ 승급은 **의도적으로만** — 이 줄의 버전을 직접 올릴 것. build.js 스모크가 bare major 재발을 차단한다.
       ※babel 태그는 배포본에서 build.js 가 제거하므로 프로덕션 무영향(원본 파일을 직접 열 때만 사용). -->
  <!-- ★SRI(integrity) 2단 방어(2026-07-25 소유자 지시) — exact pin 과 **다른 층**이다.
       exact pin = "무엇을 주문할지" 고정 / SRI = "받은 게 진짜인지" 확인.
       주소가 맞아도 CDN 이 침해되면 다른 내용물이 올 수 있고(2024 polyfill.io: 도메인 매각 후
       10만+ 사이트에 악성코드 배포·각 사이트는 코드 한 줄 안 바꿨는데 감염), 브라우저는 그걸 그냥 실행한다.
       integrity 가 있으면 지문 불일치 시 **실행을 거부**한다. 이 앱은 구글 로그인 토큰 + 개인 데이터
       (루틴·메모·회고) 전체에 접근 가능한 컨텍스트라, 여기 들어온 코드는 앱과 동등한 권한을 갖는다.
       ⚠ 버전을 올리면 **integrity 도 반드시 같이** 갱신할 것 — 안 하면 브라우저가 실행을 거부해
       6/17 과 같은 백지 증상이 된다. `verify-sri.js` 가 배포 前 실파일과 대조해 이 실수를 차단한다.
       해시 출처: unpkg 와 jsdelivr(독립 미러)에서 받은 파일의 sha384 가 **일치**함을 대조 확인. -->
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-ezQ6HS3FLspd9te19o2McUV6FAK091+GG7KO54f/R8DKgCDi7fULhapNrd5LY+vG" src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

  <!-- Firebase (Auth 로그인). compat 빌드 = 빌드툴 없이 전역 firebase 사용.
       파일 저장은 Storage 대신 RTDB(/files, base64) — Storage는 신규 프로젝트에서 유료플랜 필수라 미사용 -->
  <!-- ★firebase 도 SRI(2026-07-25): react 만 봉인하고 여기를 열어두면 문이 반만 닫힌다 —
       같은 페이지에서 실행되는 이상 권한은 동일하다. gstatic 은 구글 직영이라 unpkg 보다 침해가
       훨씬 어렵지만, 비용이 같으니 막는다. `crossorigin` 은 SRI 필수 조건이며 gstatic 이
       `Access-Control-Allow-Origin: *` 를 주는 것을 확인하고 추가했다(안 주는데 붙이면 로드가 깨진다).
       한계(정직): npm 미러가 있는 react 와 달리 gstatic 빌드는 **독립 대조처가 없어**,
       반복 fetch 재현성만 확인했다(=지금 서빙되는 것을 고정한 것이지 '정본'과 대조한 게 아님). -->
  <script crossorigin="anonymous" integrity="sha384-sEVIly94UBRLKWdkYoPpSG7GD/e79YHMrxVyZaOk712Ga7+EAw6w1EFi+xBzBdd+" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script crossorigin="anonymous" integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <div id="root"></div>
  <script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;

/* ─── 상수 ─── */
const STATUSES = {
  action: { label: "다음행동", color: "#3B82F6", bg: "#EFF6FF", icon: "🔵" },
  waiting: { label: "대기중", color: "#F59E0B", bg: "#FFFBEB", icon: "⏳" },
  someday: { label: "나중에", color: "#9CA3AF", bg: "#F9FAFB", icon: "💤" },
  done: { label: "완료", color: "#10B981", bg: "#ECFDF5", icon: "✅" },
};
const SK = Object.keys(STATUSES).filter(k => k !== "done" && k !== "someday"); /* ★2026-07-04: 나중에(someday) 상태 폐지 — 미룸=미래 수행날짜, 막연한 백로그=날짜 없음. 대기중 유지. (STATUSES[someday]는 옛 데이터 안전 렌더용으로 정의만 남김) */
/* 업무 채널 마커(🧠🎯✍️) 폐지(2026-06-26) → develop 버킷(지식·교훈·글감, kind:bucket)으로 대체. MARKERS 상수 제거(2026-06-28, 회고탭 재구성으로 마지막 참조 소멸). 예측은 폐지. */

const TABS_BY_WS = {
  work: [
    { id: "today", label: "오늘", icon: "⭐" },
    { id: "projects", label: "과제별", icon: "📁" },
    /* 회고 탭 복원(2026-06-28): 6/26 제거는 소유자 정정(번복) — 업무도 내가 남긴 회고 확인 + 지난 task 회고 CRUD 필요.
       마커 폐지에 맞춰 RecapView 업무 타깃 = 마커별 → 프로젝트·develop 버킷·완료별로 재구성. ⚠️ vault 연동스펙 canon 갱신 [개선:B]. */
    { id: "channels", label: "회고", icon: "🔎" },
    { id: "history", label: "히스토리", icon: "📜" },
  ],
  /* 과제 맥락(memos) 탭은 계속 제거 유지(2026-06-26) → 로컬 `Desktop\과제 맥락.md`(계정경계·기밀). memos 데이터는 /data에 백업 잔존(미표시). 회고(recap)와 별개. */
  personal: [
    { id: "today", label: "오늘", icon: "⭐" },
    { id: "projects", label: "유형별", icon: "📁" },
    { id: "channels", label: "회고", icon: "🔎" },
    { id: "history", label: "히스토리", icon: "📜" },
  ],
};

/* 로컬 시간 기준 오늘 날짜 (UTC가 아닌 KST 등 현지 시간) */
let TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
/* 자정 경과 시 자동 갱신 (60초마다 체크) — ★리로드 前 대기중 저장 flush(2026-07-04) */
setInterval(async () => { const d = new Date(); const now = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; if (now !== TODAY) { TODAY = now; try { await flushCloudSave(); } catch {} window.location.reload(); } }, 60000);
/* ★탭 닫기/숨김 시 대기중 저장 flush(2026-07-04, best-effort keepalive) */
window.addEventListener("pagehide", () => { try { flushCloudSave(); } catch {} });
const gid = () => Math.random().toString(36).slice(2, 9);
const fd = (d) => { const t = new Date(d); return `${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,"0")}.${String(t.getDate()).padStart(2,"0")}`; };
const diffDays = (dateStr) => {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const today = new Date(TODAY + "T00:00:00");
  return Math.round((target - today) / 86400000);
};
const deadlineInfo = (dateStr) => {
  const d = diffDays(dateStr);
  if (d === null) return null;
  if (d < 0) return { label: `${-d}일 초과`, color: "#DC2626", bg: "#FEF2F2", icon: "🔴" };
  if (d === 0) return { label: "오늘 마감", color: "#EA580C", bg: "#FFF7ED", icon: "🟠" };
  if (d <= 7) return { label: `D-${d}`, color: "#D97706", bg: "#FFFBEB", icon: "🟡" };
  return { label: `D-${d}`, color: "#6B7280", bg: "#F3F4F6", icon: "" };
};

/* ─── Google Apps Script (캘린더 전용) ─── */
const GAS_URL = "https://script.google.com/macros/s/AKfycby1EJPrhqE7wOQQXd-vjwSIuyRwiAoq0Jc8gsELPq-5uWa8cIweFmfdKP1GmGTnWDAawg/exec";

/* ─── Firebase (Auth 로그인 + Realtime DB 동기화 + Storage 파일) ─── */
/* ▼▼▼ Firebase 콘솔 > 프로젝트설정 > 웹앱 config 을 여기에 붙여넣기 ▼▼▼
   apiKey / messagingSenderId / appId 만 채우면 됨 (나머지는 taskmgr-sync 고정값).
   storageBucket 은 콘솔 값 그대로 (보통 taskmgr-sync.appspot.com 또는 .firebasestorage.app). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCzx9YiZhjEF5RQB3m48zqa8k8eUMTI8b8",
  authDomain: "taskmgr-sync.firebaseapp.com",
  databaseURL: "https://taskmgr-sync-default-rtdb.firebaseio.com",
  projectId: "taskmgr-sync",
  storageBucket: "taskmgr-sync.firebasestorage.app",
};
/* ▲▲▲ config 끝 ▲▲▲ */
/* config 미입력(PASTE_) 상태면 인증 비활성 = 기존 공개모드 그대로 동작(앱 안 깨짐). */
const FB_CONFIGURED = !!FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE");
if (FB_CONFIGURED && window.firebase && !firebase.apps.length) {
  try { firebase.initializeApp(FIREBASE_CONFIG); } catch (e) { console.error("[Firebase init]", e); }
}
const fbAuth = () => (FB_CONFIGURED && window.firebase && typeof firebase.auth === "function") ? firebase.auth() : null;
const fbUser = () => { try { return fbAuth()?.currentUser || null; } catch { return null; } };

const fbDataUrl = () => "https://taskmgr-sync-default-rtdb.firebaseio.com/" + WS.fbPath + ".json";
/* 로그인 상태면 ID 토큰을 ?auth= 로 붙여 인증 (잠근 DB 통과). 미로그인/미설정이면 빈 문자열=공개모드. */
const authParam = async () => {
  try { const u = fbUser(); if (u) return "?auth=" + await u.getIdToken(); } catch {}
  return "";
};
/* ★C3(2026-07-04): GAS 토큰을 RTDB /calToken(소유자 uid로 잠긴 경로)에서 읽어와 calSync에 첨부.
   미설정이면 빈 값 → GAS도 opt-in이라 기존대로 동작. 설정 후엔 owner만 토큰을 얻어 GAS 호출 가능(익명 차단). */
let _calToken = "";
const loadCalToken = async () => {
  try { const u = fbUser(); if (!u) return; const at = "?auth=" + await u.getIdToken();
    const res = await fetch("https://taskmgr-sync-default-rtdb.firebaseio.com/calToken.json" + at);
    if (res.ok) { const t = await res.json(); if (typeof t === "string" && t) _calToken = t; }
  } catch {}
};

/* ★기기 계측(P0·2026-07-17·PDS §14.8 ⑤): "미동기가 회사 PC 에서만 나나?" 는 **기기 식별자가 없어 판정 불가**였다(§14.8 ③).
   프록시 차단·GAS 콜드스타트·탭 닫힘·네트워크 글리치가 전부 동일 지문(savedAt 은 갱신됐는데 calEventId 만 빔)을 남겨 비진단적.
   → devId(기기) + failMode(왜) 두 축을 심어 1주 관측으로 실증한다. ★관측 전 원인 단정 금지.
   저장은 **blob 안**(/personal·/data)에만 — RTDB 규칙(SECURITY_SETUP.md §2)이 data·personal·files·calToken 4개만 잠그고
   catch-all 이 없어 **기본 거부** → /calFailures 같은 신규 최상위 경로는 앱(idToken)이 못 쓴다(2026-07-17 실측 401).
   blob 하위는 규칙이 상속되므로 소유자의 Firebase 콘솔 수동작업 0. */
const DEV_ID = (() => {
  try {
    let d = localStorage.getItem("tm-devid");
    if (!d) { d = "d_" + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); localStorage.setItem("tm-devid", d); }
    return d;
  } catch { return "eph_" + Math.random().toString(36).slice(2, 8); } /* localStorage 막힌 환경(L1896 주석) → 세션 한정 id. 무기록보다 나음 */
})();
const _calFailBuf = []; /* 실패 링버퍼(캡 20) — calSync 가 재시도 소진 후 push, cloudSave 가 blob 에 실어보냄(별도 write 경로 불필요) */
const calLogFailure = (rec) => { try { _calFailBuf.push(rec); if (_calFailBuf.length > 20) _calFailBuf.splice(0, _calFailBuf.length - 20); } catch {} };

/* ★결함 B 완화 — 외부 소유 필드 보존(2026-07-25·PDS §14.7): 아래 저장은 blob **전체를 PUT** 한다.
   그래서 앱이 로드한 뒤에 외부 도구가 RTDB 에 직접 쓴 값은, 그 탭이 다음에 저장하는 순간 통째로 되돌아간다
   (2026-07-19 sweptThrough 유실. 주원인이던 결함 A[savedAt 을 숫자로 bump → LWW 영구 false]는 normSavedAt 으로 막혔지만,
    이건 **탭이 오래 열려 있기만 해도** 재발하는 구조적 경로다 — 일요일 /sweep 이 도는 동안 폰·PC 탭이 떠 있으면 그대로 걸린다).
   → PUT 직전에 클라우드 recurrings 를 읽어 `sweptThrough` 만 **id 매칭**으로 되살린다.
   ★대상이 이 필드 하나인 이유: 앱이 **읽기만 하고 절대 쓰지 않는** 유일한 필드다.
     - `futureThrough` 는 앱이 futureEvtDone 에서 계속 쓰므로 **보존하면 안 된다**(앱이 정본).
     - `calEventId` 는 백스톱이 ETag 조건부로 쓰고 45분마다 재수렴 = **자가치유**라 굳이 필요 없다.
     - `sweptThrough` 만이 주1회·비자가치유 → 잃으면 다음 정제까지 일주일 내내 글랜스가 안 줄어든다(= §14.8 ⑥ URL 사고의 상류).
   ★앱이 쓰지 않는 필드만 만지므로 '삭제 되살림' 위험이 없다 — 통짜 병합을 거부한 M2(2026-07-04) 판단과 충돌하지 않는다.
   ★실패하면 조용히 원본 그대로 PUT. 저장 자체는 어떤 경우에도 막지 않는다(가드는 개선이지 의존 대상이 아님). */
let _sweptCache = null; /* id → sweptThrough (마지막으로 관측한 클라우드 값) — 언로드 flush 는 네트워크를 못 타므로 이 캐시로 적용 */
const applySwept = (data) => {
  try {
    if (!_sweptCache || !Array.isArray(data.recurrings)) return data;
    let hit = 0;
    const merged = data.recurrings.map(x => {
      const c = _sweptCache.get(x && x.id);
      if (c && c !== (x && x.sweptThrough)) { hit++; return { ...x, sweptThrough: c }; }
      return x;
    });
    return hit ? { ...data, recurrings: merged } : data;
  } catch { return data; }
};
const preserveForeign = async (data, path, q) => {
  try {
    if (!Array.isArray(data.recurrings) || !data.recurrings.length) return applySwept(data);
    const r = await fetch("https://taskmgr-sync-default-rtdb.firebaseio.com/" + path + "/recurrings.json" + q);
    if (!r.ok) return applySwept(data);
    const cloud = await r.json();
    if (!Array.isArray(cloud)) return applySwept(data);
    _sweptCache = new Map(cloud.filter(Boolean).map(c => [c.id, c.sweptThrough]));
    const out = applySwept(data);
    if (out !== data) console.warn("[sync] 외부 write 보존 — sweptThrough 를 클라우드 값으로 되살림(주간 정제 결과 유실 방지)");
    return out;
  } catch { return applySwept(data); }
};

/* ★★결함 B 근본 해결(2026-07-26·PDS §14.7): **통째 PUT → 바뀐 키만 PATCH**.
   지금까지 저장은 blob 전체를 PUT 했다 → 앱이 안 건드린 키까지 매번 덮어써서, 로드 후 외부 도구가 쓴 값이
   그 탭의 다음 저장에 통째로 되돌아갔다(= 결함 B). PATCH 는 **본문에 없는 키를 건드리지 않으므로**,
   앱이 손대지 않은 키는 아예 쓰지 않는다 = 경쟁 자체가 사라진다(구조적 차단·경쟁창 0).
   ★ETag 조건부 PUT(if-match)은 **브라우저에서 불가**로 실측 확인(2026-07-26): RTDB 응답에
     `Access-Control-Expose-Headers` 가 없어 fetch 가 ETag 헤더를 읽지 못한다(서버측 백스톱은 가능 → 거기선 계속 사용).
     Firebase SDK 트랜잭션은 firebase-database-compat 추가가 필요해 CDN 의존 1개 증설(6/17 백지 사고 클래스) → 채택 안 함.
   ★실측 검증한 PATCH 의미론(scratch 경로·2026-07-26): 본문에 없는 키 불변 / `null`=삭제 / 빈 배열·빈 객체=키 삭제(PUT 과 동형) / 빈 본문 `{}`=200 no-op.
   ★잔여: **같은 키를 동시에** 쓰면 그 키는 여전히 통째 교체된다(예: 사용자가 반복설정을 편집하는 순간 /sweep 이 sweptThrough 를 씀)
     → 그 좁은 창은 preserveForeign(위)이 필드 단위로 방어한다. 두 겹.
   ★기준선(_syncBase)=**'우리가 아는 클라우드의 내용'**. 로드/저장 성공 시 갱신. 없으면 통째 PUT 으로 안전 폴백. */
const SYNC_OWNED = ["tasks", "projects", "history", "recurrings", "memos", "files", "savedAt", "lastWriter", "calFailures"];
/* ★비교는 반드시 **정규화(canonical)** 로 — E2E 가 잡은 결함(2026-07-26): RTDB 는 객체 키를 **정렬해서** 돌려주는데
   `JSON.stringify` 는 삽입순서를 보존한다 → 내용이 같아도 문자열이 달라 전 키가 '바뀜'으로 오판되고,
   그러면 안 바뀐 키까지 다시 보내 이 설계의 목적(경쟁창 0)이 통째로 무력화된다. 키를 정렬해 직렬화한다. */
const canonJson = (v) => {
  if (v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return "[" + v.map(canonJson).join(",") + "]";
  return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canonJson(v[k])).join(",") + "}";
};
/* RTDB 는 빈 배열·빈 객체·null 을 **저장하지 않는다**(실측) → 로컬의 [] / {} 와 클라우드의 '키 없음'은 같은 상태다.
   이걸 구분하면 매 저장마다 헛된 삭제 write 가 나간다. */
const emptyish = (v) => v === null || v === undefined
  || (Array.isArray(v) && v.length === 0)
  || (typeof v === "object" && !Array.isArray(v) && Object.keys(v).length === 0);
let _syncBase = null; /* { key: 정규화 문자열 } */
const setSyncBase = (obj) => {
  try { const b = {}; for (const k of Object.keys(obj || {})) b[k] = canonJson(obj[k]); _syncBase = b; }
  catch { _syncBase = null; } /* 직렬화 실패(순환참조 등) → 기준선 포기 = 다음 저장은 통째 PUT(안전측) */
};
const resetSyncState = () => { _syncBase = null; _sweptCache = null; }; /* ★워크스페이스 전환 = 다른 blob → 기준선 폐기(E2 클래스 방지) */
/* 보낼 변경분만 추린다. null=기준선에 없음(=기준 모름) → 호출측이 통째 PUT. */
const diffForPatch = (data) => {
  if (!_syncBase || !data) return null;
  const out = {};
  try {
    const EMPTY = new Set([undefined, "null", "[]", "{}"]); /* 클라우드에 '없음'과 동치인 정규화 표현 */
    for (const k of Object.keys(data)) {
      const cur = canonJson(data[k]);
      const was = _syncBase[k];
      if (cur === was) continue;
      if (emptyish(data[k]) && EMPTY.has(was)) continue; /* 둘 다 '비어있음' = 같은 상태(헛된 write 방지) */
      out[k] = data[k];
    }
    /* 앱이 **소유한** 키인데 이번 데이터에 없음 = 삭제 의도(PUT 의 '키 누락=삭제'를 재현).
       ★소유 목록 밖의 키(외부 도구가 blob 에 심은 것)는 **절대 건드리지 않는다** — 이게 통째 PUT 보다 나은 지점. */
    for (const k of SYNC_OWNED) {
      if (!Object.prototype.hasOwnProperty.call(data, k) && !EMPTY.has(_syncBase[k])) out[k] = null;
    }
  } catch { return null; }
  return out;
};

/* 클라우드 저장: Firebase PATCH(바뀐 키만) — 기준선 없으면 PUT (2초 디바운스) */
let _saveTimer = null, _pendingData = null, _pendingPath = null;
const cloudSave = (data) => {
  /* ★P0 계측 부착(2026-07-17·§14.8 ⑤): 이 blob 을 마지막으로 쓴 기기(lastWriter) + 이 기기가 겪은 최근 GAS 실패(calFailures).
     백스톱이 45분마다 blob 을 읽어 로그에 영속시킨다. 한계(수용): ⓐ 실패는 *다음* 저장 때 실림(add 실패는 최대 45s 뒤라 직전
     저장 이후일 수 있음 — 계속 쓰면 곧 실리고 탭닫기 flush 도 있음) ⓑ 다른 기기 저장이 LWW 로 덮어씀(단 **실패한 기기가 곧
     쓰는 기기**다 = RTDB 는 통과하고 GAS 만 막히므로 실패는 실린다. 백스톱 로그가 영속 사본). */
  data = { ...data, lastWriter: { devId: DEV_ID, at: new Date().toISOString() }, ...(_calFailBuf.length ? { calFailures: _calFailBuf.slice(-20) } : {}) };
  _pendingData = data; /* ★자정 리로드·탭닫기 flush용으로 대기 데이터 보관(2026-07-04) */
  /* ★E2(2026-07-05): 저장 대상 경로를 '예약 시점'에 고정(closure). 디바운스 2초 내 워크스페이스 전환 시
     flush가 fbDataUrl()로 새 WS.fbPath를 읽어 옛 워크스페이스 블롭을 반대편(/data↔/personal)에 덮어쓰던
     치명 버그 차단(WS는 모듈 전역·전환 시 리마운트돼도 _saveTimer는 생존). */
  const path = WS.fbPath; _pendingPath = path;
  const url = "https://taskmgr-sync-default-rtdb.firebaseio.com/" + path + ".json";
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    _saveTimer = null;
    const el = document.getElementById("sync-status");
    if (el) { el.textContent = "☁️ 저장중..."; el.style.color = "#F59E0B"; }
    const q = await authParam();
    /* ★바뀐 키만 PATCH(기준선 없으면 통째 PUT). recurrings 를 **보내야 할 때만** 외부 필드 보존 —
       안 보내면 그 키는 애초에 건드리지 않으므로 병합도 네트워크 왕복도 불필요(대부분의 저장이 여기 해당). */
    const patch = diffForPatch(data);
    const sendRec = !!(patch && Object.prototype.hasOwnProperty.call(patch, "recurrings"));
    const sendAll = (!patch || sendRec) ? await preserveForeign(data, path, q) : data;
    const payload = patch ? { ...patch, ...(sendRec ? { recurrings: sendAll.recurrings } : {}) } : sendAll;
    fetch(url + q, {
      method: patch ? "PATCH" : "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(r => {
      /* RTDB는 401(권한거부)에도 유효한 JSON 바디를 주므로 r.ok를 반드시 확인 */
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(() => {
      _pendingData = null;
      setSyncBase(sendAll); /* ★성공 = 클라우드는 이제 이 내용 → 다음 저장의 diff 기준 */
      if (el) { el.textContent = "☁️ 동기화됨"; el.style.color = "#10B981"; setTimeout(() => { el.textContent = "☁️"; el.style.color = "#9ca3af"; }, 2000); }
    }).catch(() => {
      if (el) { el.textContent = "☁️ 실패"; el.style.color = "#EF4444"; setTimeout(() => { el.textContent = "☁️"; el.style.color = "#9ca3af"; }, 3000); }
    });
  }, 2000);
};
/* ★디바운스 중인 저장을 즉시 flush(2026-07-04) — 자정 리로드/탭닫기로 2초 저장이 소멸하는 것 방지. keepalive로 언로드에도 도달 시도 */
const flushCloudSave = async () => {
  if (!_pendingData) return;
  clearTimeout(_saveTimer); _saveTimer = null;
  const data = _pendingData; const path = _pendingPath || WS.fbPath; _pendingData = null; /* ★E2: 예약 시점 경로로 flush(전환돼도 옛 데이터는 옛 경로로) */
  const url = "https://taskmgr-sync-default-rtdb.firebaseio.com/" + path + ".json";
  /* ★언로드 경로라 네트워크 왕복을 더 붙이면 flush 자체가 유실될 수 있다 → 캐시(_sweptCache)만 동기 적용.
     캐시는 직전 cloudSave 가 채워두므로 '편집 → 2초 내 탭닫기' 창에서도 직전 관측값이 살아 있다.
     ★여기서도 바뀐 키만 PATCH. 성공 확인이 불가능한 경로라 기준선(_syncBase)은 갱신하지 않는다(다음 저장이 조금 더 보내면 그만·안전측). */
  try {
    const q = await authParam();
    const patch = diffForPatch(data);
    const sendAll = applySwept(data);
    const sendRec = !!(patch && Object.prototype.hasOwnProperty.call(patch, "recurrings"));
    const payload = patch ? { ...patch, ...(sendRec ? { recurrings: sendAll.recurrings } : {}) } : sendAll;
    await fetch(url + q, { method: patch ? "PATCH" : "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload), keepalive: true });
  } catch {}
};

/* 클라우드 로드: Firebase GET (1회 요청). 실패와 '빈 DB'를 구분해 반환 —
   로드 실패 시 클라우드 저장을 계속 차단해야 stale 로컬이 클라우드를 덮지 않는다. */
const cloudLoad = async () => {
  try {
    const q = await authParam();
    const r = await fetch(fbDataUrl() + q);
    if (!r.ok) return { ok: false, status: r.status };
    return { ok: true, data: await r.json() };
  } catch { return { ok: false }; }
};

/* ─── 파일 업로드 (RTDB /files 에 base64 저장 — 같은 잠금 규칙 적용, 로그인 필요) ───
   메타({id,name,size,...})는 task.attachments/files 상태에, 실제 bytes 는 /files/<id> 별도 경로에.
   /data 자동저장 블롭과 분리되어 있어 매 저장마다 파일이 재전송되지 않는다. */
const RTDB_FILES_URL = "https://taskmgr-sync-default-rtdb.firebaseio.com/files/";
const FILE_MAX_BYTES = 20 * 1024 * 1024; /* base64 +33% 감안, DB 저장 방식의 실용 한도 */
const uploadFile = (file, onProgress) => new Promise((resolve, reject) => {
  const u = fbUser();
  if (!FB_CONFIGURED || !u) { reject(new Error("파일 업로드는 로그인 후 사용 가능합니다")); return; }
  if (file.size > FILE_MAX_BYTES) { reject(new Error("20MB 이하 파일만 업로드할 수 있습니다")); return; }
  const reader = new FileReader();
  reader.onerror = () => reject(new Error("파일 읽기 실패"));
  reader.onload = async () => {
    try {
      const b64 = String(reader.result).split(",")[1] || "";
      const token = await u.getIdToken();
      const fid = gid();
      const meta = { id: fid, name: file.name, mimeType: file.type || "application/octet-stream", size: file.size, uploadedAt: new Date().toISOString(), store: "rtdb" };
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", RTDB_FILES_URL + fid + ".json?auth=" + token);
      xhr.setRequestHeader("Content-Type", "application/json");
      if (onProgress && xhr.upload) xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(Math.round(e.loaded / e.total * 100)); };
      xhr.onload = () => { (xhr.status >= 200 && xhr.status < 300) ? resolve(meta) : reject(new Error("업로드 실패 (HTTP " + xhr.status + ")")); };
      xhr.onerror = () => reject(new Error("업로드 실패 (네트워크)"));
      xhr.send(JSON.stringify({ name: meta.name, mimeType: meta.mimeType, size: meta.size, uploadedAt: meta.uploadedAt, data: b64 }));
    } catch (e) { reject(e); }
  };
  reader.readAsDataURL(file);
});
const deleteStoredFile = async (att) => {
  try {
    const u = fbUser(); if (!u || !att || !att.id) return;
    const token = await u.getIdToken();
    await fetch(RTDB_FILES_URL + att.id + ".json?auth=" + token, { method: "DELETE" });
  } catch {}
};
const downloadAttachment = async (att) => {
  try {
    const u = fbUser(); if (!u) { alert("로그인 후 사용 가능합니다"); return; }
    const token = await u.getIdToken();
    const r = await fetch(RTDB_FILES_URL + att.id + ".json?auth=" + token);
    if (!r.ok) { alert("다운로드 실패 (HTTP " + r.status + ")"); return; }
    const f = await r.json();
    if (!f || !f.data) { alert("파일이 저장소에 없습니다 (삭제되었을 수 있음)"); return; }
    const bin = atob(f.data);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const blob = new Blob([bytes], { type: f.mimeType || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = f.name || att.name || "file"; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) { alert("다운로드 실패: " + ((e && e.message) || e)); }
};
const fmtSize = (b) => b >= 1048576 ? (b/1048576).toFixed(1)+" MB" : b >= 1024 ? Math.round(b/1024)+" KB" : (b||0)+" B";

/* (S3·cleanup 2026-06-16) 회사 캘린더 가져오기(COMPANY_GAS_URL/KEY·companyFetchEvents) 제거 — 인박스 탭과 함께 폐지(inert였음). */

const GCAL_URL = GAS_URL;
/* ★URL 단일 조립기(2026-07-25·PDS §14.8 ⑥): 전송 URL 을 만드는 곳은 **여기 하나뿐**이어야 한다.
   예산 가드(calFitParams)가 길이를 재는 식과 실제 전송하는 식이 갈리면 가드가 조용히 거짓말한다
   (이번 조사에서 python 미러가 실측과 5~11자 어긋난 게 정확히 그 클래스). calSyncOnce 도 이걸 쓴다. */
const calBuildUrl = (action, params, cb) =>
  `${GCAL_URL}?${new URLSearchParams({ ...params, action, callback: cb, ...(_calToken ? { token: _calToken } : {}) })}`;
/* ─── 캘린더 JSONP 동기화 (add / update / delete) ─── */
/* ★P0 계측(2026-07-17·§14.8 ⑤): 세 실패 경로는 **원래도 코드에 구분돼 있었으나 전부 동일한 {success:false} 로 뭉개져 버려졌다**
   — 그래서 "프록시냐 콜드스타트냐"가 판정 불가였다(§14.8 ③). failMode+ms 를 실어 진단 가능하게 만든다:
     onerror = 스크립트 **로드 자체** 실패(네트워크/프록시 차단·보통 <1s) / timeout = 콜백 미도래(GAS 콜드스타트·45s) / gas = GAS 가 거절(토큰 게이트 등).
   ★성공 객체는 **원본 그대로 통과**(호출측이 eventId/events/updated/idempotent 를 읽음 — 건드리면 안 됨). */
const calSyncOnce = (action, params) => new Promise((resolve) => {
  const t0 = Date.now();
  const cb = "_gcal_" + gid();
  const fin = (r) => { clearTimeout(timer); delete window[cb]; if (s.parentNode) s.remove(); resolve(r); };
  const timer = setTimeout(() => fin({ success: false, failMode: "timeout", ms: Date.now() - t0 }), 45000); /* GAS가 느림(실측 update~29s·list~15-19s) → 45s로(2026-07-03). 20s는 update가 타임아웃돼 '보류' 다발이었음 */
  window[cb] = (r) => {
    if (!r) return fin({ success: false, failMode: "empty", ms: Date.now() - t0 });
    if (r.success === false) return fin({ ...r, failMode: "gas", ms: Date.now() - t0 });
    return fin(r); /* 성공 = 원본 무변경 */
  };
  const s = document.createElement("script");
  s.src = calBuildUrl(action, params, cb); /* ★조립은 calBuildUrl 하나로 일원화(2026-07-25) — 가드가 재는 식과 반드시 동일 */
  s.onerror = () => fin({ success: false, failMode: "onerror", ms: Date.now() - t0 });
  document.body.appendChild(s);

const migrateData = (data) => {

  const TASK_MIGRATION = {
    "독파모 3~4차 300% 전성비 달성 가능할지?": "waiting",
  };

    if (t.status === "someday") t = { ...t, status: "action" };
    if ((t.subtasks || []).some(s => s.status === "someday")) t = { ...t, subtasks: t.subtasks.map(s => s.status === "someday" ? { ...s, status: "action" } : s) };
    /* scheduled 상태 → action 전환, 과거 마감일은 제거 */
    if (t.status === "scheduled") {
      const isPast = t.scheduledDate && new Date(t.scheduledDate + "T00:00:00") < new Date(TODAY + "T00:00:00");
      t = { ...t, status: "action", scheduledDate: isPast ? "" : (t.scheduledDate || ""), scheduledLabel: isPast ? "" : (t.scheduledLabel || "") };

    if (t.planDate === undefined) t = { ...t, planDate: "" };

    if (t.calUpdated === undefined) t = { ...t, calUpdated: 0 };
    if (t.attachments === undefined) t = { ...t, attachments: [] };

    if (t.subtasks?.length) t = { ...t, subtasks: t.subtasks.map(s => {
      let ns = s.status === "scheduled" ? { ...s, status: "action" } : { ...s };
      if (ns.planDate === undefined) ns = { ...ns, planDate: "" };
      if (ns.calUpdated === undefined) ns = { ...ns, calUpdated: 0 };
      return ns;
    })};
    return t;
  });

};

   외부 도구(하네스 스크립트·수동 PATCH)가 unix epoch ms **숫자**로 bump 하면 JS 관계연산이 "한쪽이 숫자면
   양변을 Number 로 강제"하는 규칙 때문에 ISO 문자열이 **NaN** 이 되어 비교가 **항상 false** 가 된다.
   그러면 그 write 는 '더 최신'이 아니라 **앱이 영원히 채택 못 하는 값**이 되고, 앱은 stale 메모리를 유지하다
   다음 저장에서 blob 전체를 PUT 해 그 write 를 **통째로 되돌린다**.
   ⚠ 2026-07-19 `sweptThrough` 유실이 정확히 이것 — 열린 탭뿐 아니라 **새 탭·하드리프레시에서도** 결정론적으로
   실패했고, 숫자는 L2027 '다른 기기 변경' 경고 조건(`typeof === "string"`)도 통과 못 해 **채택 실패와 경고 실패가
   동시** 발생 → 8일간 무증상. 캘린더 desc 가 6795자까지 자라 GAS URL 임계를 넘긴 사고(§14.8 ⑥)의 상류 원인.
   ★계약 자체는 **도구측이 ISO 를 쓰는 것**(scripts/sweep_write.ps1 이 준수·write-back 검증까지 함)이고,
   이 정규화는 그 위반을 **조용히 삼키지 않기 위한 방어**다(다른 도구가 또 숫자를 써도 최소한 채택·경고는 산다).
   숫자는 unix **ms** 로 해석 — 실측된 유일한 위반 형식(`ToUnixTimeMilliseconds()`). */
const normSavedAt = (v) => {
  if (typeof v === "string") return v;
  if (typeof v === "number" && isFinite(v)) { try { return new Date(v).toISOString(); } catch { return ""; } }
  return "";
};

/* ─── 공통 컴포넌트 ─── */
const Toast = ({ msg, onUndo, onX }) => {
  useEffect(() => { const t = setTimeout(onX, 5000); return () => clearTimeout(t); }, [onX]);
  return <div style={S.tst}><span>{msg}</span>
    {onUndo && <button style={S.tstB} onClick={onUndo}>되돌리기</button>}
    <button style={{ ...S.tstB, color: "#9ca3af", border: "none" }} onClick={onX}>✕</button>

};

const Badge = ({ st }) => <span style={S.bdg(st)}>{STATUSES[st]?.label}</span>;
const StSel = ({ value, onChange, compact }) => (
  <select style={{ ...S.sel, ...(compact ? { padding: "3px 6px", fontSize: 11 } : {}) }} value={value} onChange={e => onChange(e.target.value)}>
    {SK.map(k => <option key={k} value={k}>{STATUSES[k].label}</option>)}
  </select>
);
/* 드롭다운 정렬: 프로젝트 → 그 외(버킷) → 기타(petc) 맨끝. 업무(kind 없음)는 전부 동일군 → 원순서 유지(안정정렬) */
const projSortKey = (p) => isRoutineProj(p) ? 0 : (p && p.kind === "project") ? 1 : (p && (p.id === "petc" || p.id === "proj_etc")) ? 3 : 2; /* 루틴(kind 또는 반복보유) 먼저 = isRoutineProj로 자동 도출 반영(2026-07-12) */
const sortProjsForSelect = (projects) => [...(projects || [])].sort((a, b) => projSortKey(a) - projSortKey(b));
const PrSel = ({ value, onChange, projects, highlight }) => (
  <select style={{ ...S.sel, ...(highlight ? { borderColor: "#F59E0B", background: "#FFFBEB" } : {}) }} value={value || ""} onChange={e => onChange(e.target.value)}>
    <option value="">{WS.key === "personal" ? "주제 선택…" : "과제 선택…"}</option>{/* 개인=주제(영역), 업무=과제(정부과제) 2026-07-08 */}
    {sortProjsForSelect(projects).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
  </select>
);
const StarBtn = ({ on, onClick }) => (
  <button style={S.star(on)} onClick={e => { e.stopPropagation(); onClick(); }} title={on ? "집중 업무 해제" : "집중 업무 표시"}>
    {on ? "★" : "☆"}
  </button>
);

/* ─── SubRow (서브태스크 행) ─── */

  const [h, setH] = useState(false);
  const [showNotes, setShowNotes] = useState(false);
  const isDone = sub.status === "done";
  const dl = sub.scheduledDate ? deadlineInfo(sub.scheduledDate) : null;
  return (
    <div style={{ ...S.row, padding: "4px 8px", opacity: isDone ? 0.45 : 1 }} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}>
      <StarBtn on={sub.focus} onClick={onToggleFocus} />
      <button onClick={onToggleDone} title={isDone ? "되돌리기" : "완료"}
        style={{ width: 16, height: 16, borderRadius: "50%", border: `2px solid ${STATUSES[sub.status]?.color || "#ccc"}`, background: isDone ? STATUSES.done.color : "transparent", cursor: "pointer", flexShrink: 0, marginTop: 2 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
          <Badge st={sub.status} />
          {sub.planDate && <span style={{ fontSize: 9, color: "#6366F1", fontWeight: 600, background: "#EEF2FF", padding: "0px 4px", borderRadius: 4 }}>📆 {fd(sub.planDate)}{sub.planTime ? " 🕒" + sub.planTime : ""}</span>}
          {dl && <span style={S.dlBdg(dl)}>{dl.icon} {dl.label}</span>}
          {sub.scheduledDate && <span style={{ fontSize: 9, color: "#6B7280" }}>마감 {fd(sub.scheduledDate)}</span>}
          {sub.scheduledLabel && <span style={{ fontSize: 9, color: "#9ca3af" }}>({sub.scheduledLabel})</span>}
          {sub.calEventId && <span style={{ fontSize: 8, color: "#10B981", fontWeight: 600, background: "#ECFDF5", padding: "0px 3px", borderRadius: 4 }}>📅✓</span>}
          {sub.notes && <span onClick={(e) => { e.stopPropagation(); setShowNotes(!showNotes); }} style={{ cursor: "pointer", fontSize: 9, color: showNotes ? "#8B5CF6" : "#c4b5fd", background: showNotes ? "#F3E8FF" : "transparent", padding: "1px 3px", borderRadius: 4, userSelect: "none" }}>📝</span>}
        </div>
        <div style={{ ...S.txt, fontSize: 12.5, textDecoration: isDone ? "line-through" : "none", color: isDone ? "#9ca3af" : "#1a1a1a" }}>{sub.text}</div>
        {sub.notes && showNotes && <div style={{ marginTop: 3, fontSize: 11, background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 5, padding: "3px 7px", color: "#92400E", whiteSpace: "pre-wrap" }}><span style={{ fontSize: 8, fontWeight: 700, opacity: 0.65, marginRight: 5 }}>📝</span>{sub.notes}</div>}
      </div>
      {h && <div style={{ display: "flex", gap: 3, flexShrink: 0 }}>
        {(sub.planDate || sub.scheduledDate) && onCal && <button style={{ ...S.gh, fontSize: 10 }} onClick={onCal} title={sub.calEventId ? "캘린더 동기화" : "캘린더에 추가"}>{sub.calEventId ? "📅↻" : "📅+"}</button>}
        <button style={{ ...S.gh, fontSize: 10 }} onClick={onEdit}>✏️</button>
        <button style={{ ...S.gh, color: "#EF4444", fontSize: 10 }} onClick={onDel}>✕</button>
      </div>}
    </div>
  );
};

/* ─── SubAddForm (서브태스크 추가) ─── */
const SubAddForm = ({ onAdd, onCancel }) => {
  const [t, setT] = useState(""); const [s, setS] = useState("action"); const [sd, setSd] = useState(""); const [pd, setPd] = useState(TODAY); const [f, setF] = useState(false); const r = useRef();
  useEffect(() => { r.current?.focus(); }, []);
  const go = () => { if (!t.trim()) return; onAdd({ text: t.trim(), status: s, focus: f, scheduledDate: sd, scheduledLabel: "", planDate: pd }); };
  return (
    <div className="form-row" style={{ display: "flex", gap: 4, alignItems: "center", flexWrap: "wrap", padding: "4px 0" }}>
      <StarBtn on={f} onClick={() => setF(!f)} />
      <input ref={r} style={{ ...S.inp, fontSize: 12 }} placeholder="하위 할일..." value={t} onChange={e => setT(e.target.value)} onKeyDown={e => { if (e.key === "Enter") go(); if (e.key === "Escape") onCancel(); }} />
      <StSel value={s} onChange={setS} compact />
      <div style={{ display: "flex", gap: 3, alignItems: "center" }}><span style={{ fontSize: 10, color: "#6366F1" }}>📆</span><input type="date" style={{ ...S.fld, width: 118, flex: "none", fontSize: 11 }} value={pd} onChange={e => setPd(e.target.value)} title="📆 언제할지 (선택)" /></div>
      <div style={{ display: "flex", gap: 3, alignItems: "center" }}><span style={{ fontSize: 10, color: "#9ca3af" }}>마감</span><input type="date" style={{ ...S.fld, width: 118, flex: "none", fontSize: 11 }} value={sd} onChange={e => setSd(e.target.value)} title="마감일 (선택)" /></div>
      <button style={S.btn()} onClick={go}>추가</button>
      <button style={S.gh} onClick={onCancel}>취소</button>

/* ─── TaskRow (서브태스크 확장 + 드래그 정렬) ─── */
const TaskRow = ({ task, onDone, onDel, onFocus, showProj, projects, onEdit, onUpdate, dragHandlers }) => {
  const [h, setH] = useState(false);
  const [showSubs, setShowSubs] = useState(false);
  const [addSub, setAddSub] = useState(false);
  const [showNotes, setShowNotes] = useState(false);
  const subs = task.subtasks || [];
  const doneSubCnt = subs.filter(s => s.status === "done").length;
  const p = projects?.find(x => x.id === task.project);

  const handleAddSub = ({ text, status, focus, scheduledDate, scheduledLabel, planDate }) => {
    if (!onUpdate) return;
    const pd = planDate || TODAY;
    onUpdate({ ...task, subtasks: [...subs, { id: gid(), text, status, focus, scheduledDate: scheduledDate || "", scheduledLabel: scheduledLabel || "", planDate: pd, notes: "", createdAt: TODAY }] }); /* 별=집중(날짜와 분리, 2026-06-30) */
    setAddSub(false); setShowSubs(true);
  };

  /* 드래그 props (상/하 삽입 위치 표시) */
  const dh = dragHandlers || {};
  const clearIndicator = (el) => { el.classList.remove("drop-indicator-before", "drop-indicator-after"); };
  const dragProps = dh.onDragStart ? {
    draggable: true,
    onDragStart: (e) => { dh.onDragStart(task.id); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/task-id", task.id); } catch {} e.currentTarget.style.opacity = "0.35"; e.currentTarget.style.transform = "scale(0.98)"; },
    onDragEnd: (e) => { e.currentTarget.style.opacity = "1"; e.currentTarget.style.transform = ""; dh.onDragEnd?.(); },
    onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; const rect = e.currentTarget.getBoundingClientRect(); const midY = rect.top + rect.height / 2; clearIndicator(e.currentTarget); e.currentTarget.classList.add(e.clientY < midY ? "drop-indicator-before" : "drop-indicator-after"); e.currentTarget.dataset.dropPos = e.clientY < midY ? "before" : "after"; },
    onDragEnter: (e) => { e.preventDefault(); },
    onDragLeave: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) clearIndicator(e.currentTarget); },
    onDrop: (e) => { e.preventDefault(); const pos = e.currentTarget.dataset.dropPos || "before"; clearIndicator(e.currentTarget); dh.onDrop?.(task.id, pos); },
  } : {};

  return (
    <div {...dragProps}>
      <div className="task-row" style={{ ...S.row, background: h ? "#f8fafc" : task.focus ? "#FFFDF5" : "transparent", cursor: dh.onDragStart ? "grab" : "default", transition: "border 0.15s, transform 0.15s" }} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} onTouchStart={() => setH(true)}>
        {dh.onDragStart && <span className="grip" style={{ color: "#d1d5db", fontSize: 11, cursor: "grab", flexShrink: 0, marginTop: 3, userSelect: "none" }} title="드래그하여 순서 변경">⠿</span>}
        <StarBtn on={task.focus} onClick={() => onFocus(task.id)} />
        <button onClick={() => onDone(task.id)} title="완료"
          style={{ width: 18, height: 18, borderRadius: "50%", border: `2px solid ${STATUSES[task.status]?.color || "#ccc"}`, background: "transparent", cursor: "pointer", flexShrink: 0, marginTop: 2 }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
            <Badge st={task.status} />
            {task.planDate && <span style={{ fontSize: 10, color: "#6366F1", fontWeight: 600, background: "#EEF2FF", padding: "1px 5px", borderRadius: 6 }}>📆 {fd(task.planDate)}{task.planTime ? " 🕒" + task.planTime : ""}</span>}
            {task.scheduledDate && (() => { const dl = deadlineInfo(task.scheduledDate); return dl ? <span style={S.dlBdg(dl)}>{dl.icon} {dl.label}</span> : null; })()}
            {task.scheduledDate && <span style={{ fontSize: 10, color: "#6B7280" }}>마감 {fd(task.scheduledDate)}</span>}
            {task.scheduledLabel && <span style={{ fontSize: 10, color: "#9ca3af" }}>({task.scheduledLabel})</span>}
            {subs.length > 0 && <span style={S.progBdg}>{doneSubCnt}/{subs.length}</span>}
            {showProj && p && <span style={{ fontSize: 11, color: "#9ca3af" }}>#{p.name}</span>}
            {task.calEventId && <span style={{ fontSize: 9, color: "#10B981", fontWeight: 600, background: "#ECFDF5", padding: "1px 4px", borderRadius: 4 }} title="캘린더 연동됨">📅✓</span>}
            {(task.attachments || []).length > 0 && <span style={{ fontSize: 9, color: "#6366F1", fontWeight: 600, background: "#EEF2FF", padding: "1px 4px", borderRadius: 4 }} title="첨부파일">📎{task.attachments.length}</span>}
            {/* (2026-06-26) 마커 표시 폐지 — 채널=프로젝트 버킷 */}
            {task.notes && <span onClick={(e) => { e.stopPropagation(); setShowNotes(!showNotes); }} style={{ cursor: "pointer", fontSize: 10, color: showNotes ? "#92400E" : "#B45309", background: showNotes ? "#FEF3C7" : "#FFFBEB", border: "1px solid #FDE68A", padding: "1px 5px", borderRadius: 4, userSelect: "none" }}>📝 메모</span>}
          </div>
          <div style={S.txt}>{task.text}</div>
          {task.notes && showNotes && <div style={{ marginTop: 4, fontSize: 12, background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 6, padding: "5px 9px", color: "#92400E", whiteSpace: "pre-wrap" }}><span style={{ fontSize: 9, fontWeight: 700, opacity: 0.65, marginRight: 6 }}>📝 메모</span>{task.notes}</div>}
        </div>
        <div className="task-actions" style={{ display: h ? "flex" : "none", gap: 3, flexShrink: 0, alignItems: "center" }}>
          {(task.planDate || task.scheduledDate) && <button style={{ ...S.gh, fontSize: 10, padding: "2px 5px" }} onClick={() => addToCalendar(task, projects, (ok, msg, eventId) => { if(ok && eventId && onUpdate) onUpdate({...task, calEventId: eventId}); const el = document.getElementById("cal-toast"); if(el){el.textContent=ok?"✅ "+msg:"❌ "+msg;el.style.display="block";setTimeout(()=>el.style.display="none",2000);} })} title={task.calEventId ? "캘린더 동기화" : "캘린더에 추가"}>{task.calEventId ? "📅↻" : "📅+"}</button>}
          {subs.length > 0 && <button style={S.gh} onClick={() => setShowSubs(!showSubs)} title="하위 할일">{showSubs ? "▲" : "▼"}</button>}
          <button style={{ ...S.gh, fontSize: 10 }} onClick={() => { setAddSub(!addSub); if (!addSub) setShowSubs(true); }} title="하위 할일 추가">+sub</button>
          <button style={S.gh} onClick={() => onEdit(task)}>✏️</button>
          <button style={{ ...S.gh, color: "#EF4444" }} onClick={() => onDel(task.id)}>✕</button>
        </div>
      </div>
      {showSubs && subs.length > 0 && (
        <div style={{ marginLeft: 20, borderLeft: "2px solid #e5e7eb", paddingLeft: 4, marginBottom: 4 }}>
          {subs.map(s => (
            <SubRow key={s.id} sub={s}
              onToggleFocus={() => onUpdate && onUpdate({ ...task, subtasks: subs.map(x => x.id === s.id ? { ...x, focus: !x.focus } : x) })}
              onToggleDone={() => onUpdate && onUpdate({ ...task, subtasks: subs.map(x => x.id === s.id ? { ...x, status: x.status === "done" ? "action" : "done" } : x) })}
              onDel={() => onUpdate && onUpdate({ ...task, subtasks: subs.filter(x => x.id !== s.id) })}
              onEdit={() => onEdit(s, task.id)}
              onCal={() => addToCalendar(subCalObj(s, task), projects, (ok, msg, eventId, updated) => { if (ok && eventId && onUpdate) onUpdate({ ...task, subtasks: subs.map(x => x.id === s.id ? { ...x, calEventId: eventId, calUpdated: updated || Date.now() } : x) }); const el = document.getElementById("cal-toast"); if (el) { el.textContent = ok ? "✅ " + msg : "❌ " + msg; el.style.display = "block"; setTimeout(() => el.style.display = "none", 2000); } })}
            />
          ))}
        </div>
      )}
      {addSub && (
        <div style={{ marginLeft: 28, marginBottom: 6 }}>
          <SubAddForm onAdd={handleAddSub} onCancel={() => setAddSub(false)} />
        </div>
      )}
    </div>
  );
};

/* ─── 드래그 정렬 훅 ─── */
const useDragReorder = (onReorder) => {
  const dragRef = useRef(null);
  return {
    onDragStart: (id) => { dragRef.current = id; },
    onDragEnter: () => {},
    onDragEnd: () => { dragRef.current = null; },
    onDrop: (targetId, pos) => { if (dragRef.current && dragRef.current !== targetId) { onReorder(dragRef.current, targetId, pos); dragRef.current = null; } },
  };
};

/* ─── 첨부파일 섹션 (EditModal·파일 탭 공용) ─── */
/* deferred 모드(EditModal): Storage 부수효과를 모달의 저장/취소와 일치시킨다 —
   업로드는 즉시 하되 '취소' 시 롤백 삭제, 삭제는 예약만 했다가 '저장' 시 실행. */
const AttachmentSection = ({ attachments, onChange, deferred, onBusy }) => {
  const [uploading, setUploading] = useState(0); /* 0=idle, 1~100=진행% */
  const [err, setErr] = useState("");
  const inRef = useRef();
  const canUpload = FB_CONFIGURED && !!fbUser();
  const list = attachments || [];
  const pick = async (e) => {
    const file = e.target.files?.[0]; e.target.value = "";
    if (!file) return;
    setErr(""); setUploading(1); if (onBusy) onBusy(true);
    try {
      const att = await uploadFile(file, p => setUploading(Math.max(1, p)));
      if (deferred) deferred.uploads.current.push(att);
      onChange([...list, att]);
    } catch (ex) { setErr((ex && ex.message) || String(ex)); }
    setUploading(0); if (onBusy) onBusy(false);
  };
  const remove = (att) => {
    if (deferred) {
      if (!window.confirm('"' + att.name + '" 첨부를 삭제할까요? (저장을 눌러야 확정)')) return;
      deferred.deletes.current.push(att);
      onChange(list.filter(a => a.id !== att.id));
      return;
    }
    if (!window.confirm('"' + att.name + '" 첨부를 삭제할까요? (저장소 파일도 함께 삭제)')) return;
    deleteStoredFile(att);
    onChange(list.filter(a => a.id !== att.id));
  };
  return (
    <div>
      <div style={S.lbl}>📎 첨부파일</div>
      {list.map(a => (
        <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, padding: "3px 0" }}>
          <a href="#" onClick={(e) => { e.preventDefault(); downloadAttachment(a); }} style={{ color: "#3B82F6", flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", cursor: "pointer" }} title="클릭하여 다운로드">📎 {a.name}</a>
          <span style={{ color: "#9ca3af", fontSize: 10, flexShrink: 0 }}>{fmtSize(a.size)}</span>
          <button style={{ ...S.gh, fontSize: 10, color: "#EF4444", flexShrink: 0 }} onClick={() => remove(a)}>✕</button>
        </div>
      ))}
      {canUpload ? (
        <div style={{ marginTop: 4 }}>
          <input ref={inRef} type="file" style={{ display: "none" }} onChange={pick} />
          {uploading > 0
            ? <span style={{ fontSize: 12, color: "#F59E0B" }}>⬆️ 업로드 중… {uploading}%</span>
            : <button style={{ ...S.gh, fontSize: 11 }} onClick={() => inRef.current?.click()}>+ 파일 첨부</button>}
        </div>
      ) : (
        <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 2 }}>파일 업로드는 Firebase 설정(로그인) 후 사용 가능</div>
      )}
      {err && <div style={{ fontSize: 11, color: "#EF4444", marginTop: 2 }}>{err}</div>}
    </div>
  );
};

/* ═══ 계획 요약 (planDate 기준 오늘/이번주) ═══ */
const PlanDateSummary = ({ tasks, projects, onEdit }) => {
  const planned = useMemo(() => {
    const items = [];
    tasks.forEach(t => {
      if (t.status !== "done" && t.planDate) items.push(t);
      (t.subtasks || []).forEach(s => { if (s.status !== "done" && s.planDate) items.push({ ...s, project: t.project, _parentId: t.id }); });
    });
    return items;
  }, [tasks]);
  const weekPlan = planned.filter(t => { const d = diffDays(t.planDate); return d !== null && d > 0 && d <= 7; }).sort((a, b) => a.planDate.localeCompare(b.planDate));
  const overduePlan = planned.filter(t => { const d = diffDays(t.planDate); return d !== null && d < 0 && !isStaleRoutine(t); }).sort((a, b) => a.planDate.localeCompare(b.planDate));
  const [weekOpen, setWeekOpen] = useState(false);
  if (!weekPlan.length && !overduePlan.length) return null;
  const PlanItem = ({ t }) => {
    const p = projects.find(x => x.id === t.project);
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
        <Badge st={t.status} />
        <span style={{ color: "#374151", flex: 1 }}>{t.text}</span>
        {p && <span style={{ fontSize: 10, color: "#9ca3af" }}>#{p.name}</span>}
        {t._parentId && <span style={{ fontSize: 9, color: "#9ca3af" }}>↳</span>}
        <button style={{ ...S.gh, fontSize: 10, padding: "1px 5px" }} onClick={() => onEdit(t, t._parentId)}>✏️</button>
      </div>
    );
  };
  return (
    <div style={{ marginBottom: 12 }}>
      {overduePlan.length > 0 && <div style={{ background: "linear-gradient(135deg, #FEF2F2 0%, #FECACA 100%)", border: "1px solid #FCA5A5", borderRadius: 8, padding: "10px 14px", marginBottom: 8 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#991B1B", marginBottom: 4 }}>📆 지난 계획 미처리 ({overduePlan.length}건)</div>
        {overduePlan.map(t => <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
          <span style={{ fontSize: 10, color: "#DC2626", fontWeight: 600 }}>{fd(t.planDate)}</span><PlanItem t={t} />
        </div>)}
      </div>}
      {weekPlan.length > 0 && <div style={{ background: "linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%)", border: "1px solid #C4B5FD", borderRadius: 8, padding: "10px 14px", marginBottom: 8 }}>
        <div onClick={() => setWeekOpen(!weekOpen)} style={{ fontSize: 13, fontWeight: 600, color: "#6D28D9", marginBottom: weekOpen ? 4 : 0, cursor: "pointer", userSelect: "none", display: "flex", alignItems: "center", gap: 6 }}><span style={{ fontSize: 11 }}>{weekOpen ? "▼" : "▶"}</span> 📆 이번주 계획 ({weekPlan.length}건)</div>
        {weekOpen && weekPlan.map(t => <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
          <span style={{ fontSize: 10, color: "#6D28D9", fontWeight: 600 }}>{fd(t.planDate)}</span><PlanItem t={t} />
        </div>)}
      </div>}
    </div>
  );
};

/* ═══ 마감 알림 (서브태스크 포함) ═══ */
const ScheduleAlerts = ({ tasks, projects, onEdit }) => {
  const allScheduled = useMemo(() => {
    const items = [];
    tasks.forEach(t => {
      if (t.status !== "done" && t.scheduledDate) items.push({ type: "task", data: t, parent: null });
      (t.subtasks || []).forEach(s => {
        if (s.status !== "done" && s.scheduledDate) items.push({ type: "sub", data: s, parent: t });
      });
    });
    return items;
  }, [tasks]);
  const overdue = allScheduled.filter(i => diffDays(i.data.scheduledDate) < 0).sort((a, b) => a.data.scheduledDate.localeCompare(b.data.scheduledDate));
  const soon = allScheduled.filter(i => { const d = diffDays(i.data.scheduledDate); return d >= 0 && d <= 7; }).sort((a, b) => a.data.scheduledDate.localeCompare(b.data.scheduledDate));
  if (!overdue.length && !soon.length) return null;
  const AlertItem = ({ item }) => {
    const p = projects.find(x => x.id === (item.type === "task" ? item.data.project : item.parent.project));
    const dl = deadlineInfo(item.data.scheduledDate);
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
        <span style={S.dlBdg(dl)}>{dl.icon} {dl.label}</span>
        {item.type === "sub" && <span style={{ fontSize: 10, color: "#9ca3af" }}>↳</span>}
        <span style={{ color: "#374151", flex: 1 }}>{item.data.text}</span>
        {p && <span style={{ fontSize: 10, color: "#9ca3af" }}>#{p.name}</span>}
        <button style={{ ...S.gh, fontSize: 10, padding: "1px 5px" }} onClick={() => item.type === "task" ? onEdit(item.data) : onEdit(item.data, item.parent.id)}>✏️</button>
      </div>
    );
  };
  return (
    <div style={{ marginBottom: 12 }}>
      {overdue.length > 0 && <div style={S.alertOverdue}><div style={{ fontSize: 13, fontWeight: 600, color: "#991B1B", marginBottom: 6 }}>🔴 마감 초과 ({overdue.length}건)</div>{overdue.map((item, i) => <AlertItem key={i} item={item} />)}</div>}
      {soon.length > 0 && <div style={S.alertSoon}><div style={{ fontSize: 13, fontWeight: 600, color: "#9A3412", marginBottom: 6 }}>🟡 7일 이내 마감 ({soon.length}건)</div>{soon.map((item, i) => <AlertItem key={i} item={item} />)}</div>}
    </div>
  );
};

/* ═══ 오늘 뷰 (서브태스크 집중 포함) ═══ */
const TodayView = ({ tasks, projects, recurrings, onDone, onDel, onFocus, onAdd, onEdit, onUpdate, onReorder, onPlanToday, onClearToday }) => {
  const dragHandlers = useDragReorder(onReorder);
  const [dragOverToday, setDragOverToday] = useState(false);
  const [dragOverRest, setDragOverRest] = useState(false);
  /* '오늘 할 일'에서 전체 현황으로 끌어다 놓으면 수행날짜 비움(오늘에서 내림) */
  const restDropProps = {
    onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (!dragOverRest) setDragOverRest(true); },
    onDragLeave: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverRest(false); },
    onDrop: (e) => { e.preventDefault(); setDragOverRest(false); const id = e.dataTransfer.getData("text/task-id"); if (id && onClearToday) onClearToday(id); },
  };
  /* 아래(전체 현황)의 할일을 '오늘 할 일'로 끌어다 놓으면 수행날짜가 오늘로(2026-06-30) */
  const todayDropProps = {
    onDragOver: (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (!dragOverToday) setDragOverToday(true); },
    onDragLeave: (e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOverToday(false); },
    onDrop: (e) => { e.preventDefault(); setDragOverToday(false); const id = e.dataTransfer.getData("text/task-id"); if (id && onPlanToday) onPlanToday(id); },
  };
  /* 오늘 할 일 = 수행날짜가 오늘이거나 지난(미완료) — 별(집중)과 무관(2026-06-30). 지난 미완료 루틴 제외.
     날짜가 있으면(미래 포함) 그 날 자동 표출 = 백로그도 특정 시점 surface(someday 상태 폐지 2026-07-04). */
  const onToday = (t) => !!(t.planDate && t.planDate <= TODAY && !isStaleRoutine(t));
  const { focusedTasks, focusedSubs } = useMemo(() => {
    const pk = (t) => projSortKey(projects.find(p => p.id === t.project)); /* 루틴>프로젝트>버킷>기타 */
    const ft = tasks.filter(t => t.status !== "done" && onToday(t)).sort((a, b) => pk(a) - pk(b));
    const fs = [];
    tasks.forEach(t => { (t.subtasks || []).forEach(s => { if (s.status !== "done" && s.planDate && s.planDate <= TODAY) fs.push({ sub: s, parent: t }); }); });
    return { focusedTasks: ft, focusedSubs: fs };
  }, [tasks, projects, recurrings]); /* recurrings dep(2026-07-12): pk→projSortKey→isRoutineProj가 ROUTINE_REC_PROJ_IDS(recurrings 파생) 참조 → 반복 추가/비활성으로 루틴 도출이 바뀔 때 오늘 정렬 즉시 재계산(stale 방지) */
  const totalFocused = focusedTasks.length + focusedSubs.length;
  const unfocusedActions = tasks.filter(t => t.status === "action" && !onToday(t) && !isStaleRoutine(t));
  const waitingAll = tasks.filter(t => t.status === "waiting" && !onToday(t) && !isStaleRoutine(t));
  const [showRest, setShowRest] = useState(false);

  /* 집중 그룹: 일반 task + 서브태스크 통합 */
  const focusGroups = useMemo(() => {
    const groups = {};
    SK.forEach(k => { groups[k] = []; });
    focusedTasks.forEach(t => groups[t.status]?.push({ type: "task", data: t }));
    focusedSubs.forEach(({ sub, parent }) => groups[sub.status]?.push({ type: "sub", data: sub, parent }));
    return SK.map(k => ({ k, label: STATUSES[k].label, items: groups[k] })).filter(g => g.items.length > 0);
  }, [focusedTasks, focusedSubs]);

  const toggleSubInParent = (parentId, subId, field) => {
    const parent = tasks.find(t => t.id === parentId);
    if (!parent || !onUpdate) return;
    if (field === "focus") onUpdate({ ...parent, subtasks: (parent.subtasks || []).map(s => s.id === subId ? { ...s, focus: !s.focus } : s) });
    if (field === "done") onUpdate({ ...parent, subtasks: (parent.subtasks || []).map(s => s.id === subId ? { ...s, status: s.status === "done" ? "action" : "done" } : s) });
  };

  const renderItem = (item) => {
    if (item.type === "task") return <TaskRow key={item.data.id} task={item.data} projects={projects} showProj onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} dragHandlers={dragHandlers} />;
    return (
      <div key={item.data.id} style={{ paddingLeft: 8 }}>
        <div style={{ fontSize: 10, color: "#9ca3af", paddingLeft: 30 }}>↳ {item.parent.text}</div>
        <SubRow sub={item.data}
          onToggleFocus={() => toggleSubInParent(item.parent.id, item.data.id, "focus")}
          onToggleDone={() => toggleSubInParent(item.parent.id, item.data.id, "done")}
          onDel={() => onUpdate && onUpdate({ ...item.parent, subtasks: (item.parent.subtasks || []).filter(s => s.id !== item.data.id) })}
          onEdit={() => onEdit(item.data, item.parent.id)}
          onCal={() => addToCalendar(subCalObj(item.data, item.parent), projects, (ok, msg, eventId, updated) => { if (ok && eventId && onUpdate) onUpdate({ ...item.parent, subtasks: (item.parent.subtasks || []).map(s => s.id === item.data.id ? { ...s, calEventId: eventId, calUpdated: updated || Date.now() } : s) }); const el = document.getElementById("cal-toast"); if (el) { el.textContent = ok ? "✅ " + msg : "❌ " + msg; el.style.display = "block"; setTimeout(() => el.style.display = "none", 2000); } })} />
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0" }}>
        <div style={{ fontSize: 13, color: "#6b7280" }}>
          {fd(TODAY)} — 오늘 할 일 <strong style={{ color: "#F59E0B" }}>{totalFocused}</strong>개
          {unfocusedActions.length > 0 && <span> · 다음행동 {unfocusedActions.length}</span>}
          {waitingAll.length > 0 && <span> · 대기중 {waitingAll.length}</span>}
        </div>
      </div>
      <PlanDateSummary tasks={tasks} projects={projects} onEdit={onEdit} />
      <ScheduleAlerts tasks={tasks} projects={projects} onEdit={onEdit} />
      <AddForm projects={projects} onAdd={onAdd} />
      {totalFocused > 0 ? (
        <div style={{ marginTop: 16 }}>
          <div style={{ ...S.focusBanner, outline: dragOverToday ? "2px dashed #F59E0B" : "none" }} {...todayDropProps}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#92400E", marginBottom: 4 }}>📆 오늘 할 일 ({totalFocused})</div>
            <div style={{ fontSize: 11, color: "#A16207" }}>수행날짜가 오늘이거나 지난 항목 · 아래 할일을 여기로 끌어다 놓으면 오늘로</div>
          </div>
          {focusGroups.map(g => (
            <div key={g.k} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 11, color: "#9ca3af", fontWeight: 500, padding: "2px 10px", marginBottom: 2 }}>{STATUSES[g.k]?.icon} {g.label}</div>
              {g.items.map(renderItem)}
            </div>
          ))}
        </div>
      ) : (
        <div style={{ ...S.emp, marginTop: 16, outline: dragOverToday ? "2px dashed #F59E0B" : "none", borderRadius: 8 }} {...todayDropProps}>아래 할일을 여기로 끌어다 놓거나, 할일의 수행날짜(📆)를 오늘로 설정하세요</div>
      )}
      <div style={{ marginTop: 20 }} {...restDropProps}>
        <div style={{ ...S.secT, cursor: "pointer", userSelect: "none", outline: dragOverRest ? "2px dashed #9ca3af" : "none", borderRadius: 6, padding: dragOverRest ? "4px 6px" : 0 }} onClick={() => setShowRest(!showRest)} title="여기로 끌어다 놓으면 오늘에서 내림(수행날짜 비움)">
          {showRest ? "▼" : "▶"} 전체 현황 <span style={{ fontSize: 10, color: "#c4c4c4", fontWeight: 400 }}>{dragOverRest ? "· 놓으면 오늘에서 내림" : ""}</span>
          <span style={S.cnt(unfocusedActions.length + waitingAll.length)}>{unfocusedActions.length + waitingAll.length}</span>
        </div>
        {showRest && (
          <div>
            {unfocusedActions.length > 0 && <div style={S.sec}><div style={{ fontSize: 12, fontWeight: 500, color: "#3B82F6", marginBottom: 6 }}>🔵 다음행동 ({unfocusedActions.length})</div>{unfocusedActions.map(t => <TaskRow key={t.id} task={t} projects={projects} showProj onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} dragHandlers={dragHandlers} />)}</div>}
            {waitingAll.length > 0 && <div style={S.sec}><div style={{ fontSize: 12, fontWeight: 500, color: "#F59E0B", marginBottom: 6 }}>⏳ 대기중 ({waitingAll.length})</div>{waitingAll.map(t => <TaskRow key={t.id} task={t} projects={projects} showProj onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} dragHandlers={dragHandlers} />)}</div>}
          </div>
        )}
      </div>
    </div>
  );
};

/* ═══ 과제별 뷰 ═══ */
const ProjectsView = ({ tasks, projects, onDone, onDel, onFocus, onAdd, onEdit, onAddProj, onEditProj, onDelProj, onUpdate, onReorder, isWork }) => {
  const [open, setOpen] = useState(new Set(projects.filter(p => tasks.some(t => t.project === p.id && t.status !== "done")).map(p => p.id)));
  const [np, setNp] = useState("");
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState("");
  const tog = id => setOpen(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const dragHandlers = useDragReorder(onReorder);
  const isDefault = (id) => PERSONAL_PROJECTS.some(d => d.id === id);
  const startEdit = (e, p) => { e.stopPropagation(); setEditId(p.id); setEditName(p.name); };
  const saveEdit = () => { if (editName.trim()) onEditProj(editId, editName.trim()); setEditId(null); setEditName(""); };
  const askDel = (e, p) => { e.stopPropagation();
    const cnt = tasks.filter(t => t.project === p.id && t.status !== "done").length;

  };
  const renderProj = (p) => {
    const pt = tasks.filter(t => t.project === p.id && t.status !== "done");
    const fc = pt.filter(t => t.focus).length;
    const o = open.has(p.id);
    const canDel = isWork || !isDefault(p.id);
    return (
      <div key={p.id} style={{ marginBottom: 6 }}>
        <div style={S.ph(o)} onClick={() => { if (editId !== p.id) tog(p.id); }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1, minWidth: 0 }}>
            <span style={{ fontSize: 11, color: "#9ca3af" }}>{o ? "▼" : "▶"}</span>
            {editId === p.id
              ? <input autoFocus value={editName} onClick={e => e.stopPropagation()} onChange={e => setEditName(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") saveEdit(); if (e.key === "Escape") { setEditId(null); setEditName(""); } }}
                  onBlur={saveEdit} style={{ ...S.inp, fontSize: 14, padding: "2px 6px", maxWidth: 200 }} />
              : <span style={{ fontWeight: 600, fontSize: 14 }}>{p.name}</span>}
            <span style={S.cnt(pt.length)}>{pt.length}</span>
            {fc > 0 && <span style={{ fontSize: 11, color: "#F59E0B" }}>⭐{fc}</span>}
          </div>
          {editId !== p.id && <div style={{ display: "flex", gap: 2, flexShrink: 0 }}>
            <button style={{ ...S.gh, fontSize: 10, padding: "1px 5px" }} onClick={e => startEdit(e, p)} title="이름 수정">✏️</button>
            {canDel && <button style={{ ...S.gh, fontSize: 10, padding: "1px 5px", color: "#EF4444" }} onClick={e => askDel(e, p)} title="과제 삭제">🗑</button>}
          </div>}
        </div>
        {o && <div style={{ paddingLeft: 8, marginBottom: 12 }}>
          {SK.map(s => { const items = pt.filter(t => t.status === s); if (!items.length) return null;
            return <div key={s} style={{ marginBottom: 4 }}>{items.map(t => <TaskRow key={t.id} task={t} projects={projects} onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} dragHandlers={dragHandlers} />)}</div>; })}
          {pt.length === 0 && <div style={{ ...S.emp, padding: 16 }}>할 일 없음</div>}
          <div style={S.div} /><AddForm projects={projects} onAdd={onAdd} defProj={p.id} />
        </div>}
      </div>

  const mainProjs = projects.filter(p => !isBucketProj(p)).sort((a, b) => projSortKey(a) - projSortKey(b)); /* 루틴(kind 또는 반복보유·isRoutineProj 자동도출) 먼저 그룹핑 = 드롭다운·회고탭과 한 규칙(2026-07-12). JS 안정정렬→같은 kind 내 기존순서 보존. 업무=무변경 */
  const bucketProjs = projects.filter(p => isBucketProj(p));
  return (
    <div style={{ marginTop: 12 }}>
      {!isWork && bucketProjs.length > 0 && <div style={{ fontSize: 11, fontWeight: 700, color: "#6366F1", margin: "2px 0 6px" }}>📂 프로젝트</div>}
      {mainProjs.map(renderProj)}
      {bucketProjs.length > 0 && <>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#9ca3af", margin: "14px 0 6px" }}>{isWork ? "📂 develop 버킷 (지식·교훈·글감)" : "🗂 그 외 (약속·집안일·기타)"}</div>
        {bucketProjs.map(renderProj)}
      </>}
      <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 16, padding: "8px 0", flexWrap: "wrap" }}>
        <input style={{ ...S.inp, maxWidth: 200 }} placeholder={isWork ? "새 과제 추가..." : "새 프로젝트 추가..."} value={np} onChange={e => setNp(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && np.trim()) { onAddProj(np.trim(), "project"); setNp(""); }}} />
        <button style={S.gh} onClick={() => { if (np.trim()) { onAddProj(np.trim(), "project"); setNp(""); }}}>+ 추가</button>
      </div>
    </div>
  );
};

/* ═══ 메모 뷰 (과제별 메모 CRUD) ═══ */
const MemosView = ({ projects, memos, setMemos }) => {
  const [openP, setOpenP] = useState(new Set(projects.filter(p => (memos[p.id] || []).length > 0).map(p => p.id)));
  const [editId, setEditId] = useState(null);
  const [editText, setEditText] = useState("");
  const [addFor, setAddFor] = useState(null);
  const [newText, setNewText] = useState("");
  const tog = id => setOpenP(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });

  const addMemo = (projId) => {
    if (!newText.trim()) return;
    const now = new Date().toISOString();
    setMemos(prev => ({ ...prev, [projId]: [...(prev[projId] || []), { id: gid(), text: newText.trim(), createdAt: now, updatedAt: now }] }));
    setNewText(""); setAddFor(null);
  };
  const updateMemo = (projId, memoId) => {
    if (!editText.trim()) return;
    const now = new Date().toISOString();
    setMemos(prev => ({ ...prev, [projId]: (prev[projId] || []).map(m => m.id === memoId ? { ...m, text: editText.trim(), updatedAt: now } : m) }));
    setEditId(null); setEditText("");
  };
  const deleteMemo = (projId, memoId) => {
    setMemos(prev => ({ ...prev, [projId]: (prev[projId] || []).filter(m => m.id !== memoId) }));
  };

  return (
    <div style={{ marginTop: 12 }}>
      {projects.map(p => {
        const pm = memos[p.id] || [];
        const o = openP.has(p.id);
        return (
          <div key={p.id} style={{ marginBottom: 6 }}>
            <div style={S.ph(o)} onClick={() => tog(p.id)}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 11, color: "#9ca3af" }}>{o ? "▼" : "▶"}</span>
                <span style={{ fontWeight: 600, fontSize: 14 }}>{p.name}</span>
                <span style={S.cnt(pm.length)}>{pm.length}</span>
              </div>
            </div>
            {o && <div style={{ paddingLeft: 8, marginBottom: 12 }}>
              {pm.length === 0 && <div style={{ ...S.emp, padding: 12 }}>메모 없음</div>}
              {pm.map(m => (
                <div key={m.id} style={{ ...S.card, padding: "10px 14px", marginBottom: 6 }}>
                  {editId === m.id ? (
                    <div>
                      <textarea style={S.ta} rows={3} value={editText} onChange={e => setEditText(e.target.value)} autoFocus />
                      <div style={{ display: "flex", gap: 6, justifyContent: "flex-end", marginTop: 6 }}>
                        <button style={S.gh} onClick={() => setEditId(null)}>취소</button>
                        <button style={S.btn()} onClick={() => updateMemo(p.id, m.id)}>저장</button>
                      </div>
                    </div>
                  ) : (
                    <div>
                      <div style={{ fontSize: 13, lineHeight: 1.7, whiteSpace: "pre-wrap" }}>{m.text}</div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
                        <div style={{ fontSize: 10, color: "#9ca3af" }}>
                          작성 {fd(m.createdAt.slice(0,10))}{m.updatedAt !== m.createdAt ? ` · 수정 ${fd(m.updatedAt.slice(0,10))}` : ""}
                        </div>
                        <div style={{ display: "flex", gap: 4 }}>
                          <button style={{ ...S.gh, fontSize: 10 }} onClick={() => { setEditId(m.id); setEditText(m.text); }}>✏️</button>
                          <button style={{ ...S.gh, fontSize: 10, color: "#EF4444" }} onClick={() => deleteMemo(p.id, m.id)}>🗑</button>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              ))}
              {addFor === p.id ? (
                <div style={{ ...S.card, padding: "10px 14px", background: "#f8fafc" }}>
                  <textarea style={S.ta} rows={3} placeholder="메모 내용..." value={newText} onChange={e => setNewText(e.target.value)} autoFocus />
                  <div style={{ display: "flex", gap: 6, justifyContent: "flex-end", marginTop: 6 }}>
                    <button style={S.gh} onClick={() => { setAddFor(null); setNewText(""); }}>취소</button>
                    <button style={S.btn()} onClick={() => addMemo(p.id)}>추가</button>
                  </div>
                </div>
              ) : (
                <button style={{ ...S.gh, fontSize: 12, marginTop: 4 }} onClick={() => setAddFor(p.id)}>+ 메모 추가</button>
              )}
            </div>}
          </div>
        );
      })}
    </div>
  );
};

/* 지난 루틴 소급 체크 — 루틴 × 지난 N일 그리드. 칸 클릭 = 그날 완료 체크/해제(2026-07-01) */
/* ─── 주N회 루틴(2026-07-07): 지정 요일이 유동적인 루틴(예: 보컬 월·수·토)을 '이번 주 N회 목표'로 추적.
   목표=freqPerWeek 우선, 없으면 지정 요일 수(dows.length). 완료수=이번 주 done 회차(옮긴 날·➕추가 세션 포함).
   현재 구조 유지: 요일별 예정 인스턴스·캘린더는 그대로, 위에 '주 N회' 카운트 층만 얹음. ─── */
const routineWeekTarget = (r) => r.type === "count" ? (r.freqPerWeek || 1) : 0; /* ★주N회 유형만 카운터 대상(2026-07-07): freqPerWeek 목표. 특정일(weekly)·매일·매월은 0=스트립 제외 */
const routineDoneSet = (tasks, history) => { const s = new Set();
  (tasks || []).forEach(t => { if (t.recurringId && t.status === "done" && !t.cancelled) s.add(t.recurringId + "|" + (t.recurringPeriod || t.planDate)); });
  (history || []).forEach(day => (day.items || []).forEach(it => { if (it.type === "done" && !it.cancelled && !it.memoOnly && it.orig && it.orig.recurringId) s.add(it.orig.recurringId + "|" + (it.orig.recurringPeriod || day.date)); })); /* ★취소(cancelled)=카운트 제외(2026-07-07·B안). ★memoOnly=📝메모만(카운트 무관·2026-07-08)도 제외 */
  return s; };
const weekDoneCount = (doneSet, rid, wk) => { let n = 0; doneSet.forEach(k => { const i = k.indexOf("|"); const id = k.slice(0, i), per = k.slice(i + 1); if (id === rid && (per === wk || per.indexOf(wk + "-") === 0)) n++; }); return n; };
/* ★루틴 이월메모(2026-07-07·B안): 취소 안 된 세션 메모(orig.notes)를 히스토리서 도출 → 캘린더 권장요일 이벤트 설명에 최근 n줄.
   취소(−)하면 그 세션이 자동 제외돼 메모도 캘린더서 사라짐. 별도 누적 저장 없음(=단일진실). n=최근 몇 개(늘어남=히스토리에 다 남음).
   opts.excludeId=이 세션 메모 제외(−직후), opts.includeId=취소된 이 세션도 강제 포함(히스토리탭 복원 시 closure history가 아직 cancelled라서). */
const routineMemoText = (rid, history, n = 10, opts = {}) => {
  const sw = ROUTINE_SWEPT[rid] || ""; /* ★§14.7: 정제 완료일 이후 세션 note만 glance(sw="" → 전부 통과) */
  const out = [];
  (history || []).forEach(day => (day.items || []).forEach(it => { if (it.type === "done" && it.orig && it.orig.recurringId === rid && (it.orig.notes || "").trim() && it.orig.id !== opts.excludeId && (!it.cancelled || it.orig.id === opts.includeId) && (day.date || "") > sw) out.push({ date: day.date || "", text: (it.orig.notes || "").trim() }); }));
  out.sort((a, b) => b.date.localeCompare(a.date)); /* ★최신 위로(역순·2026-07-25 소유자) */
  return out.slice(0, n).map(m => "[" + (m.date || "").slice(5) + "] " + m.text).join("\n\n"); /* ★날짜 블록 사이 빈 줄로 구분(여러 줄 메모도 날짜별 명확) */
};
/* 오늘 탭 상단 — 주N회 루틴 '이번 주 N/목표' + ＋(세션 기록+메모)/−(최근 1건 취소).
   요일 무관 주간 카운트: 옮겨 간 날·예정 외·지난 날 = 전부 ＋로 +1. ＋ 누르면 메모 입력창(선택)이 열림 → 발견을 적으면 루틴 이월메모에 누적되고 다음 실행 때 캘린더 권장요일 이벤트 설명에 보임(glance). */
const WeeklyRoutineStrip = ({ recurrings, tasks, history, onAddSession, onRemoveSession, onAddMemoOnly }) => {
  const wk = getWeekId();
  const [memoFor, setMemoFor] = useState(null);
  const [memoText, setMemoText] = useState("");
  const items = (recurrings || []).filter(r => !r.disabled && r.type === "count");
  if (!items.length) return null;
  const doneSet = routineDoneSet(tasks, history);
  const submit = (rid) => { onAddSession(rid, memoText); setMemoFor(null); setMemoText(""); };
  const submitMemo = (rid) => { onAddMemoOnly(rid, memoText); setMemoFor(null); setMemoText(""); }; /* 📝 카운트 없이 메모만(2026-07-08) */
  const cancel = () => { setMemoFor(null); setMemoText(""); };
  const active = items.find(r => r.id === memoFor);
  return (
    <div style={{ ...S.card, marginTop: 8, display: "flex", flexDirection: "column", alignItems: "stretch", gap: 6, padding: "8px 10px" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: "#6b7280", flexShrink: 0 }}>🔁 이번 주</span>
        {items.map(r => { const tgt = routineWeekTarget(r); const n = weekDoneCount(doneSet, r.id, wk); const hit = n >= tgt; const on = memoFor === r.id;
          return (
            <span key={r.id} style={{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 12, background: hit ? "#ECFDF5" : "#FFFBEB", border: "1px solid " + (on ? "#6366F1" : hit ? "#A7F3D0" : "#FDE68A"), borderRadius: 14, padding: "2px 4px 2px 9px" }}>
              <span style={{ maxWidth: 130, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.text}</span>
              {n > 0 && <button onClick={() => onRemoveSession(r.id)} title="이번 주 최근 완료 1건 취소(잘못 체크 정정)" style={{ ...S.gh, fontSize: 13, lineHeight: 1, padding: "1px 6px", borderRadius: 10, color: "#DC2626" }}>−</button>}
              <b style={{ color: hit ? "#059669" : "#D97706" }}>{n}/{tgt}</b>
              <button onClick={() => (on ? cancel() : (setMemoText(""), setMemoFor(r.id)))} title="했음 기록 — 누르면 메모(선택) 입력" style={{ ...S.gh, fontSize: 12, lineHeight: 1, padding: "1px 6px", borderRadius: 10, color: on ? "#4338CA" : "#059669", fontWeight: on ? 700 : 400 }}>＋</button>
            </span>
          );
        })}
      </div>
      {active && <div style={{ display: "flex", alignItems: "flex-start", gap: 6, flexWrap: "wrap" }}>
        <span style={{ fontSize: 11, color: "#4338CA", flexShrink: 0, marginTop: 5 }}>{active.text} 기록</span>
        <textarea autoFocus value={memoText} onChange={e => setMemoText(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit(active.id); } if (e.key === "Escape") cancel(); }}
          rows={Math.min(8, (memoText.match(/\n/g) || []).length + 1)}
          placeholder="메모(선택·여러 줄) — 발견/느낀 점, 캘린더로 이월. Ctrl+Enter=기록 / [기록+1]=세션 카운트 / [📝 메모만]=카운트 없이 메모만" style={{ ...S.ta, fontSize: 12, flex: 1, minWidth: 180, minHeight: 0, resize: "vertical" }} />
        <button style={{ ...S.btn("#4338CA"), fontSize: 11, marginTop: 2 }} onClick={() => submit(active.id)} title="세션 1건 기록(카운트 +1) + 메모">기록 +1</button>
        <button style={{ ...S.gh, fontSize: 11, marginTop: 2, color: "#4338CA", borderColor: "#C7D2FE" }} onClick={() => submitMemo(active.id)} title="카운트 없이 메모만 저장 — 캘린더로 이월(레슨만 받은 날 등)">📝 메모만</button>
        <button style={{ ...S.gh, fontSize: 11, marginTop: 2 }} onClick={cancel}>취소</button>
      </div>}
    </div>
  );
};
/* 회고 탭 — 주N회 루틴의 주별 완료수 히스토리(뒤돌아보기, 지난 4주) */
const WeeklyRoutineHistory = ({ recurrings, tasks, history }) => {
  const [open, setOpen] = useState(false);
  const items = (recurrings || []).filter(r => !r.disabled && r.type === "count");
  if (!items.length) return null;
  const doneSet = routineDoneSet(tasks, history);
  const base = new Date(TODAY + "T00:00:00").getTime();
  const weeks = [];
  for (let i = 0; i < 4; i++) { const d = new Date(base - i * 7 * 86400000); weeks.push({ wk: weekIdOf(d), label: i === 0 ? "이번주" : i === 1 ? "지난주" : i + "주전" }); }
  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ ...S.secT, cursor: "pointer", userSelect: "none" }} onClick={() => setOpen(!open)}>{open ? "▼" : "▶"} 🔁 주간 루틴 (주N회)</div>
      {open && <div style={{ ...S.card, marginTop: 4, overflowX: "auto" }}>

          <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "3px 0", fontSize: 12 }}>

            {weeks.map(w => { const tgt = routineWeekTarget(r); const n = weekDoneCount(doneSet, r.id, w.wk); const hit = n >= tgt;

        ))}
        <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 6 }}>목표=지정 요일 수(옮긴 날·➕추가 세션 포함). 이번 주 진행·➕는 '오늘 할 일' 상단에서.</div>
      </div>}
    </div>
  );
};
const RoutineStreak = ({ recurrings, tasks, history, onToggleDay }) => {
  const [open, setOpen] = useState(false);
  const routines = (recurrings || []).filter(r => (r.type || "weekly") === "daily");
  if (!routines.length) return null;
  const N = 10;
  const base = new Date(TODAY + "T00:00:00").getTime();
  const days = [];
  for (let i = N; i >= 1; i--) { const d = new Date(base - i * 86400000); days.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`); }
  const doneSet = new Set();
  (tasks || []).forEach(t => { if (t.recurringId && t.status === "done") doneSet.add(t.recurringId + "|" + (t.recurringPeriod || t.planDate)); });
  (history || []).forEach(day => (day.items || []).forEach(it => { if (it.type === "done" && it.orig && it.orig.recurringId) doneSet.add(it.orig.recurringId + "|" + (it.orig.recurringPeriod || day.date)); }));
  return (
    <div style={{ marginTop: 12 }}>
      <div style={{ ...S.secT, cursor: "pointer", userSelect: "none" }} onClick={() => setOpen(!open)}>
        {open ? "▼" : "▶"} 🔁 지난 루틴 체크
      </div>
      {open && <div style={{ ...S.card, marginTop: 4, overflowX: "auto" }}>
        <div style={{ display: "flex", gap: 3, marginBottom: 4, paddingLeft: 94 }}>
          {days.map(d => <span key={d} style={{ width: 24, textAlign: "center", fontSize: 8, color: "#9ca3af", flexShrink: 0 }}>{d.slice(5).replace("-", ".")}</span>)}
        </div>
        {routines.map(r => (
          <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 3, padding: "3px 0" }}>
            <span style={{ width: 90, flexShrink: 0, fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.text}</span>
            {days.map(d => { const done = doneSet.has(r.id + "|" + d);
              return <button key={d} onClick={() => onToggleDay(r.id, d, !done)} title={d + (done ? " 완료" : " 미완료")}
                style={{ width: 24, height: 24, borderRadius: 5, border: "1px solid #e5e7eb", background: done ? "#10B981" : "#fff", color: done ? "#fff" : "#d1d5db", fontSize: 11, cursor: "pointer", flexShrink: 0 }}>{done ? "✓" : ""}</button>;
            })}
          </div>
        ))}
        <div style={{ fontSize: 10, color: "#9ca3af", marginTop: 6 }}>칸 클릭 = 그날 루틴 완료 체크/해제(지난 날 소급). 오늘은 위 '오늘 할 일'에서.</div>
      </div>}
    </div>
  );
};

/* ═══ 회고 (통합) — 업무: 마커별(보기+파일) / 개인: 루틴·프로젝트별(보기+입력+파일). 완료=history ═══ */
/* 회고 첨부 — recapKey 단위로 파일 종속(업로드·목록·삭제). 회고 UI와 한 카드 안에. */
const RecapFileBox = ({ recapKey, files, setFiles, canUpload }) => {

    try { const att = await uploadFile(file, p => setUp(Math.max(1, p))); setFiles(prev => [...prev, { ...att, recapKey }]); } catch (ex) { setErr((ex && ex.message) || String(ex)); } setUp(0); };
  const del = (a) => { if (!window.confirm('"' + a.name + '" 파일을 삭제할까요?')) return; deleteStoredFile(a); setFiles(prev => prev.filter(x => x.id !== a.id)); };
  return (
    <div style={{ marginTop: 5, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>

        <a href="#" onClick={(ev) => { ev.preventDefault(); downloadAttachment(a); }} style={{ color: "#3B82F6", maxWidth: 150, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{a.name}</a>
        <button style={{ ...S.gh, fontSize: 9, color: "#EF4444", padding: "0 2px", border: "none", background: "none" }} onClick={() => del(a)}>✕</button>
      </span>)}
      {canUpload ? (up > 0 ? <span style={{ fontSize: 11, color: "#F59E0B" }}>⬆️ {up}%</span> : <><input ref={inRef} type="file" style={{ display: "none" }} onChange={pick} /><button style={{ ...S.gh, fontSize: 10, padding: "1px 6px" }} onClick={() => inRef.current?.click()}>+ 파일</button></>) : <span style={{ fontSize: 10, color: "#9ca3af" }}>로그인 후 첨부</span>}
      {err && <span style={{ fontSize: 10, color: "#EF4444" }}>{err}</span>}
    </div>
  );
};
/* 한 회고 항목 — 편집 후 '저장' 버튼(수정 시에만 표시) + 삭제 + 그 회고 전용 파일첨부(recap:<id>)(2026-07-01) */

/* 여러 회고 = (접기 가능한) 목록 + '추가' 버튼(명시 저장). 각 회고에 파일첨부 종속 */
