name: Build & Deploy Pages (JSX 사전컴파일)

# index.html(JSX)을 push마다 사전 컴파일해 babel 없는 빠른 버전으로 Pages 배포.
# ⚠ 사용 전 1회: 레포 Settings → Pages → Build and deployment → Source = "GitHub Actions" 로 변경.
#   (그 전까지는 기존 branch 배포가 유지되어 사이트는 정상.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ⚠ 버전 고정(2026-07-05): babel 8 정식 릴리스 확인(8.0.1) — 비고정 install은 다음 빌드부터 8을 받아
      #   6/17 CDN 백지사고와 같은 클래스(major 자동승급, require/preset 호환 미보장).
      #   직접 의존성 exact 고정 → 전이 의존성도 전부 ^7 범위라 8이 못 들어옴. (로컬 npm 부재로 lockfile 대신
      #   exact pin + build.js 스모크 게이트 2중 방어.) 승급은 의도적으로만 — 이 줄의 버전을 직접 올릴 것.
      - run: npm init -y && npm install @babel/core@7.29.7 @babel/preset-react@7.29.7
      - run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
