  <title>Task Manager - GTD 과제관리</title>
  <!-- ★CDN exact pin(2026-07-25 소유자 지시) — bare major(`@18`·`@7`)는 **버전 고정이 아니다**.
       unpkg 의 major URL 은 302 리다이렉트 + `max-age=60` 이라 새 패치/마이너가 나오면 **1분 안에** 전 사용자에게
       자동 승급된다(반면 exact URL 은 `max-age=31536000` = 사실상 불변). 6/17 전체 백지 사고가 정확히 이 기전
       (`@babel/standalone` 비고정 → v8 자동승급 → automatic JSX runtime 이 import 방출 → UMD 에서 백지)이었고,
       그때 `@7` 로 major 만 막은 것은 **같은 사고를 한 자릿수 좁힌 것이지 없앤 게 아니다**.
       고정 시점 실측: `@18`→18.3.1, `@7`→7.29.7 로 해석되며 exact URL 과 **바이트 동일**(sha256 대조) →
       이 고정은 동작 변경 0. babel 7.29.7 은 CI 핀(`@babel/core@7.29.7`, pages.yml)과 **정확히 일치**한다.
       ⚠ 승급은 **의도적으로만** — 이 줄의 버전을 직접 올릴 것. build.js 스모크가 bare major 재발을 차단한다.
       ※babel 태그는 배포본에서 build.js 가 제거하므로 프로덕션 무영향(원본 파일을 직접 열 때만 사용). -->
  <!-- ★SRI(integrity) 2단 방어(2026-07-25 소유자 지시) — exact pin 과 **다른 층**이다.
       exact pin = "무엇을 주문할지" 고정 / SRI = "받은 게 진짜인지" 확인.
       주소가 맞아도 CDN 이 침해되면 다른 내용물이 올 수 있고(2024 polyfill.io: 도메인 매각 후
       10만+ 사이트에 악성코드 배포·각 사이트는 코드 한 줄 안 바꿨는데 감염), 브라우저는 그걸 그냥 실행한다.
       integrity 가 있으면 지문 불일치 시 **실행을 거부**한다. 이 앱은 구글 로그인 토큰 + 개인 데이터
       (루틴·메모·회고) 전체에 접근 가능한 컨텍스트라, 여기 들어온 코드는 앱과 동등한 권한을 갖는다.
       ⚠ 버전을 올리면 **integrity 도 반드시 같이** 갱신할 것 — 안 하면 브라우저가 실행을 거부해
       6/17 과 같은 백지 증상이 된다. `verify-sri.js` 가 배포 前 실파일과 대조해 이 실수를 차단한다.
       해시 출처: unpkg 와 jsdelivr(독립 미러)에서 받은 파일의 sha384 가 **일치**함을 대조 확인. -->
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-ezQ6HS3FLspd9te19o2McUV6FAK091+GG7KO54f/R8DKgCDi7fULhapNrd5LY+vG" src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

  <!-- Firebase (Auth 로그인). compat 빌드 = 빌드툴 없이 전역 firebase 사용.
       (2026-07-31) 파일 첨부 배선 전량 제거 — 생애 1건 사용 후 50일 0건, RTDB /files 비어 있음. -->
  <!-- ★firebase 도 SRI(2026-07-25): react 만 봉인하고 여기를 열어두면 문이 반만 닫힌다 —
       같은 페이지에서 실행되는 이상 권한은 동일하다. gstatic 은 구글 직영이라 unpkg 보다 침해가
       훨씬 어렵지만, 비용이 같으니 막는다. `crossorigin` 은 SRI 필수 조건이며 gstatic 이
       `Access-Control-Allow-Origin: *` 를 주는 것을 확인하고 추가했다(안 주는데 붙이면 로드가 깨진다).
       한계(정직): npm 미러가 있는 react 와 달리 gstatic 빌드는 **독립 대조처가 없어**,
       반복 fetch 재현성만 확인했다(=지금 서빙되는 것을 고정한 것이지 '정본'과 대조한 게 아님). -->
  <script crossorigin="anonymous" integrity="sha384-sEVIly94UBRLKWdkYoPpSG7GD/e79YHMrxVyZaOk712Ga7+EAw6w1EFi+xBzBdd+" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script crossorigin="anonymous" integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE" src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* ★긴 문자열 줄바꿈(2026-10-02 · 소유자 「메모에 url 넣으면 옆으로 튕겨보이고 모바일에서는 갑자기 웹 화면으로 전환되어 보임」).
       공백 없는 추적 URL 은 끊을 자리가 없어 상자 밖으로 삐져나갔고, 문서가 화면보다 넓어지면 PC 는 가로 스크롤,
       휴대폰 크롬은 그 폭에 맞춰 화면을 축소해 PC 화면처럼 보였다(실측: 메모를 펼치는 순간 문서 폭 375 → 2588px).
       body 에 한 번 걸어 메모·회고·하위 할일·히스토리·계획/마감 요약까지 전부 상속시킨다 — 자리마다 달면 하나만 빠져도 재발한다.
       break-word 가 아니라 anywhere 인 이유: 플렉스 줄(계획·마감·히스토리)은 최소폭을 토큰 길이로 잡는데 그걸 줄이는 건 anywhere 뿐이다.
       넘칠 때만 끊으므로 한글(원래 음절마다 끊김)과 들어갈 자리가 있는 단어는 그대로다.
       ⚠ 대신 꽉 찬 플렉스 줄에서는 짧은 꼬리표(날짜 등)나 제목이 한 글자 폭까지 눌릴 수 있다 → 그런 자리는
         flexShrink: 0(계획 요약 날짜)이나 넘치면 다음 줄로 내리기(히스토리 줄 flexWrap)로 지킨다. */
    body { background: #f9fafb; -webkit-text-size-adjust: 100%; overflow-wrap: anywhere; }
    /* 모바일 터치 최적화 */
    button, select, input { touch-action: manipulation; }
    input[type="date"] { min-height: 36px; }
    .drop-indicator-before { border-top: 3px solid #3B82F6 !important; }
    .drop-indicator-after { border-bottom: 3px solid #3B82F6 !important; }
    /* 모바일 반응형 */
    @media (max-width: 640px) {
      body { font-size: 14px; }
      .app-wrap { padding: 0 8px 80px !important; }
      .tab-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 2px !important; }
      .tab-bar::-webkit-scrollbar { display: none; }
      .tab-bar button { white-space: nowrap; padding: 8px 10px !important; font-size: 12px !important; min-height: 40px; }
      .form-row { flex-direction: column !important; gap: 8px !important; }
      .form-row input, .form-row select, .form-row button { width: 100% !important; min-height: 40px; flex: none !important; box-sizing: border-box !important; }
      .form-row > div { width: 100% !important; flex-direction: column !important; }
      .form-row > div > * { width: 100% !important; flex: none !important; box-sizing: border-box !important; }
      .form-row .star-btn { width: 40px !important; }
      /* 체크박스는 위 100% 규칙에서 뺀다(2026-10-08 · 소유자 「매월 선택시 마지막일 체크하는 부분이 밖으로 튕겨」).
         상자가 칸 너비만큼 늘어나 「마지막일」 글자를 칸 밖으로 밀어냈다. 누르기 쉽게 20px 로 둔다. */
      .form-row input[type="checkbox"] { width: 20px !important; height: 20px; min-height: 0; flex: none !important; margin: 0; }
      .task-row { padding: 10px 8px !important; }
      /* ★손잡이는 휴대폰에서도 보인다(2026-09-07): 순서변경의 유일한 잡는 자리다.
         옛 규칙은 display:none 이라, 터치로는 시작조차 안 되는 옛 방식 위에 손잡이마저 감춰 두었다. */
      .hdr-wrap { flex-direction: column; gap: 8px; align-items: flex-start !important; }
      .plan-fields { flex-direction: column !important; }
      .plan-fields > * { width: 100% !important; flex: none !important; box-sizing: border-box !important; }
      .modal-content { width: 95% !important; max-width: none !important; padding: 16px !important; margin: 8px !important; }
      .modal-content input, .modal-content select, .modal-content textarea { width: 100% !important; box-sizing: border-box !important; }
      .modal-content .plan-fields > * { width: 100% !important; }
      .modal-row { flex-direction: column !important; gap: 8px !important; }
      .modal-row > div { width: 100% !important; }
      /* ★휴대폰 다듬기(2026-10-07 · 소유자 「버튼이 너무 작아 잘못 누르거나」 · 「글자크기 너무 크고」).
         화면 모양과 글자 크기는 그대로 두고, 누르는 자리와 이어서 하는 흐름만 고친다. */
      /* 탭 줄을 위에 붙인다 — 오늘 탭에서 ＋ 를 누르고 영역 탭에서 회고를 쓰는 흐름이 1~2분 간격으로 반복된다. */
      .tab-bar { position: sticky; top: 0; z-index: 50; }
      /* 8~10px 글자만 11px 로 올린다(제목·다른 글자는 그대로). 보조 글자 최소 11 = Material 3 목록 · Apple HIG. */
      [style*="font-size: 8px"], [style*="font-size: 9px"], [style*="font-size: 10px"] { font-size: 11px !important; }
      [style*="color: rgb(192, 192, 192)"] { color: #6b7280 !important; }
      /* 새 할일 입력은 접힌 한 줄(입력칸 + 추가)로 시작한다 — 펼친 7칸이 오늘 목록을 첫 화면 밖으로 밀었다(실측 413px). */
      .add-compact { display: flex; gap: 6px; align-items: stretch; }
      .add-compact input { flex: 1; min-width: 0; }
      .plan-fields > div > button { flex: 1 1 0; } /* 수정 창 「오늘」·「내일」 반씩 */
    }
    @media (hover: none) and (pointer: coarse) {
      .task-actions { display: flex !important; opacity: 0.6; }
      .task-actions:active { opacity: 1; }
      button, select { min-height: 36px; }
      /* ★누르는 자리만 넓힌다(보이는 원·별·아이콘 크기는 그대로). 실측: ○ 폭 18px · ☆ 22px · ✏️ 와 ✕ 사이 3px.
         안드로이드 기준 = 작은 아이콘 + 넓은 누르는 자리 + 8dp 간격. 줄 안 다른 간격을 줄여 제목 칸 폭은 거의 그대로 둔다. */
      .task-row { gap: 2px !important; }
      .hit-done { min-width: 32px; display: inline-flex; align-items: center; justify-content: center; }
      .hit-star { min-width: 28px; }
      .task-actions { gap: 4px !important; }
      .task-actions button { min-width: 32px; }
      .task-actions button:last-child { margin-left: 4px; } /* ✏️ 와 ✕(마지막) 사이는 8px */
      /* 「🔁 이번 주」 칩: − · ＋ 를 넓히되 한 줄에 두 칩이 그대로 들어가게 칩 안 여백을 줄인다(스크롤이 늘지 않게) */
      .wk-chip { gap: 0 !important; padding-left: 6px !important; }
      .wk-chip button { min-width: 30px; }
      .wk-btns button { min-width: 36px; }
    }
  </style>

<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useMemo, useRef, useEffect } = React;
/* ★연달아 두 번 누르면 다음 줄까지 완료되던 것을 막는다(2026-10-07). 완료한 줄이 빠지면 아랫줄이 같은 자리로 올라와
   두 번째 손가락이 그것을 눌렀다. 할 일 ○ 와 오늘 목록의 하위 ○ 가 0.6초 창 하나를 같이 쓴다(할 일 → 하위로 올라와도 막힌다). */
let LAST_DONE_AT = 0;
const doneGuard = () => { const n = Date.now(); if (n - LAST_DONE_AT < 600) return false; LAST_DONE_AT = n; return true; };
/* 완료 직후 0.6초 안의 「완료 해제」도 무시한다 — 펼친 하위 목록에서는 방금 완료한 줄이 같은 자리로 내려와 두 번째 손가락이 그것을 도로 풀었다 */
const justDone = () => Date.now() - LAST_DONE_AT < 600;

/* ─── 상수 ─── */
const STATUSES = {
  action: { label: "다음행동", color: "#3B82F6", bg: "#EFF6FF", icon: "🔵" },
  waiting: { label: "대기중", color: "#F59E0B", bg: "#FFFBEB", icon: "⏳" },
  someday: { label: "나중에", color: "#9CA3AF", bg: "#F9FAFB", icon: "💤" },
  done: { label: "완료", color: "#10B981", bg: "#ECFDF5", icon: "✅" },
};
const SK = Object.keys(STATUSES).filter(k => k !== "done" && k !== "someday"); /* ★2026-07-04: 나중에(someday) 상태 폐지 — 미룸=미래 수행날짜, 막연한 백로그=날짜 없음. 대기중 유지. (STATUSES[someday]는 옛 데이터 안전 렌더용으로 정의만 남김) */
/* 업무 채널 마커(🧠🎯✍️) 폐지(2026-06-26) → develop 버킷(지식·교훈·글감, kind:bucket)으로 대체. MARKERS 상수 제거(2026-06-28, 회고탭 재구성으로 마지막 참조 소멸). 예측은 폐지. */

const TABS_BY_WS = {
  /* ★2026-09-14 소유자 결정 — 루틴 탭과 유형별 탭을 하나로 합쳤다.
     같은 「영어」가 루틴 탭(스트립·메모·주간루틴·반복설정)과 유형별 탭에 쪼개져 있어 전체를 보는 자리가 없었다.
     이제 카드 하나에 그 영역의 세션·할일·메모가 다 들어온다. 두 워크스페이스가 같은 구조를 쓰고 이름만 다르다. */
  work: [
    { id: "today", label: "오늘", icon: "⭐" },
    { id: "areas", label: "과제", icon: "📁" },
    { id: "history", label: "히스토리", icon: "📜" },
  ],
  personal: [
    { id: "today", label: "오늘", icon: "⭐" },
    { id: "areas", label: "영역", icon: "📂" },
    { id: "history", label: "히스토리", icon: "📜" },
  ],
};

/* 로컬 시간 기준 오늘 날짜 (UTC가 아닌 KST 등 현지 시간) */
let TODAY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; })();
/* 자정 경과 시 자동 갱신 — ★리로드 前 대기중 저장 flush(2026-07-04)
   ★복귀 시에도 확인(2026-09-07): 모바일 브라우저는 **배경으로 내려간 탭의 타이머를 멈춘다**.
      60초 주기만 두면 앱을 나가 있는 동안 자정을 놓치고, 돌아와도 TODAY 가 옛 날짜로 남아
      이월이 다시 돌지 않는다. 앱으로 돌아오는 순간 다시 본다. */
const checkDayRollover = async () => {
  const d = new Date();
  const now = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  if (now === TODAY) return;
  TODAY = now;
  try { await flushCloudSave(); } catch {}
  window.location.reload();
};
setInterval(checkDayRollover, 60000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkDayRollover(); });
window.addEventListener("focus", checkDayRollover);
/* ★탭 닫기/숨김 시 대기중 저장 flush(2026-07-04, best-effort keepalive)
   ★숨김에서도 flush(2026-10-08): 모바일은 앱 전환·홈 버튼으로 숨긴 탭을 pagehide 없이 정리하기도 하고,
     숨긴 탭의 2초 타이머가 멈춘다(위 자정 주석과 같은 현상). 숨는 순간 보내 두면 그 뒤에 무슨 일이 생겨도 상관없다.
     데스크톱에서 탭을 바꿀 때도 저장이 2초 빨리 나갈 뿐이다. */
window.addEventListener("pagehide", () => { try { flushCloudSave(); } catch {} });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { try { flushCloudSave(); } catch {} } });
const gid = () => Math.random().toString(36).slice(2, 9);
const fd = (d) => { const t = new Date(d); return `${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,"0")}.${String(t.getDate()).padStart(2,"0")}`; };
const diffDays = (dateStr) => {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const today = new Date(TODAY + "T00:00:00");
  return Math.round((target - today) / 86400000);
};
const deadlineInfo = (dateStr) => {
  const d = diffDays(dateStr);
  if (d === null) return null;
  if (d < 0) return { label: `${-d}일 초과`, color: "#DC2626", bg: "#FEF2F2", icon: "🔴" };
  if (d === 0) return { label: "오늘 마감", color: "#EA580C", bg: "#FFF7ED", icon: "🟠" };
  if (d <= 7) return { label: `D-${d}`, color: "#D97706", bg: "#FFFBEB", icon: "🟡" };
  return { label: `D-${d}`, color: "#6B7280", bg: "#F3F4F6", icon: "" };
};

/* ★2026-09-14 — 외부 소유 필드 보존(applySwept/preserveForeign) 철거.

/* ★★결함 B 근본 해결(2026-07-26·PDS §14.7): **통째 PUT → 바뀐 키만 PATCH**.
   지금까지 저장은 blob 전체를 PUT 했다 → 앱이 안 건드린 키까지 매번 덮어써서, 로드 후 외부 도구가 쓴 값이
   그 탭의 다음 저장에 통째로 되돌아갔다(= 결함 B). PATCH 는 **본문에 없는 키를 건드리지 않으므로**,
   앱이 손대지 않은 키는 아예 쓰지 않는다 = 경쟁 자체가 사라진다(구조적 차단·경쟁창 0).
   ★ETag 조건부 PUT(if-match)은 **브라우저에서 불가**로 실측 확인(2026-07-26): RTDB 응답에
     `Access-Control-Expose-Headers` 가 없어 fetch 가 ETag 헤더를 읽지 못한다(서버측 백스톱은 가능 → 거기선 계속 사용).
     Firebase SDK 트랜잭션은 firebase-database-compat 추가가 필요해 CDN 의존 1개 증설(6/17 백지 사고 클래스) → 채택 안 함.
   ★실측 검증한 PATCH 의미론(scratch 경로·2026-07-26): 본문에 없는 키 불변 / `null`=삭제 / 빈 배열·빈 객체=키 삭제(PUT 과 동형) / 빈 본문 `{}`=200 no-op.
   ★잔여: **같은 키를 동시에** 쓰면 그 키는 여전히 통째 교체된다(앱과 /sweep 이 같은 반복을 동시에 고치는 경우)
   ★기준선(_syncBase)=**'우리가 아는 클라우드의 내용'**. 로드/저장 성공 시 갱신. 없으면 통째 PUT 으로 안전 폴백. */
/* ★"files" 제외(2026-07-31·첨부 제거): 앱이 더는 이 키를 소유하지 않는다 → PATCH 대상에서 빠져
   **건드리지 않는다**(RTDB blob 에 옛 키가 남아 있어도 삭제하지 않음 — 비파괴). */
const SYNC_OWNED = ["tasks", "projects", "history", "recurrings", "savedAt", "lastWriter"];
/* ★비교는 반드시 **정규화(canonical)** 로 — E2E 가 잡은 결함(2026-07-26): RTDB 는 객체 키를 **정렬해서** 돌려주는데
   `JSON.stringify` 는 삽입순서를 보존한다 → 내용이 같아도 문자열이 달라 전 키가 '바뀜'으로 오판되고,
   그러면 안 바뀐 키까지 다시 보내 이 설계의 목적(경쟁창 0)이 통째로 무력화된다. 키를 정렬해 직렬화한다. */
const canonJson = (v) => {
  if (v === null || typeof v !== "object") return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return "[" + v.map(canonJson).join(",") + "]";
  return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + canonJson(v[k])).join(",") + "}";
};
/* RTDB 는 빈 배열·빈 객체·null 을 **저장하지 않는다**(실측) → 로컬의 [] / {} 와 클라우드의 '키 없음'은 같은 상태다.
   이걸 구분하면 매 저장마다 헛된 삭제 write 가 나간다. */
const emptyish = (v) => v === null || v === undefined
  || (Array.isArray(v) && v.length === 0)
  || (typeof v === "object" && !Array.isArray(v) && Object.keys(v).length === 0);
let _syncBase = null;    /* { key: 정규화 문자열 } — 최상위 변경 감지용 */
let _syncBaseRaw = null; /* 기준선 전체의 JSON 문자열 — 필드 단위 diff 용(참조가 아니라 **문자열**로 보관:
                            상태 객체를 참조로 들고 있으면 어딘가 in-place 변형이 일어날 때 기준선이 같이 움직여
                            변경을 놓친다 = 조용한 유실. 문자열이면 그 위험이 원천 차단된다. 파싱 비용은 저장당 1회). */
const setSyncBase = (obj) => {
  try {
    const b = {}; for (const k of Object.keys(obj || {})) b[k] = canonJson(obj[k]);
    _syncBase = b; _syncBaseRaw = JSON.stringify(obj || {});
  } catch { _syncBase = null; _syncBaseRaw = null; } /* 직렬화 실패(순환참조 등) → 기준선 포기 = 다음 저장은 통째 PUT(안전측) */
};

/* ★★필드 단위 PATCH(2026-07-26·PDS §14.7): RTDB PATCH 는 `"history/12/items/9"` 같은 **경로 키**를 받는다.
   최상위 키 단위로만 보내면 그 키를 건드리는 순간 **키 전체가 통째 교체**돼, 같은 키의 다른 필드에 들어온
   외부 write 가 사라진다(예: 사용자가 할일을 체크하는 순간 /sweep 이 history 의 메모를 정제 → 정제분 소실).
   → 실제로 바뀐 **잎(leaf)** 만 보낸다. 부수 효과로 페이로드가 수백 KB → 수백 B 로 줄어든다(매 저장 history 전량 업로드 중단).
   ★안전 규약(이 코드의 존재 이유): 만든 패치를 **기준선에 실제로 적용해보고**(applyUpdates) 의도한 결과와
     canonical 일치할 때만 채택한다. 불일치·상한 초과·RTDB 금지문자 키·경로 겹침이면 **그 키만 통째 교체로 폴백**.
     즉 이 diff 에 버그가 있어도 결과는 '폴백'이지 '손상'이 아니다. */
const DP_CAP = 300;                       /* 경로 수 상한 — 넘으면 통째 교체가 더 싸고 안전 */
const DP_BADKEY = /[.#$/[\]]/;            /* RTDB 경로에 쓸 수 없는 문자 */
const isPlainObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const dpJoin = (p, k) => (p ? p + "/" + k : String(k));
/* base→cur 로 가는 잎 단위 갱신을 out.u 에 모은다. 상한 초과·불가 키면 false(=폴백 신호). */
const deepDiff = (base, cur, prefix, out) => {
  if (out.n > DP_CAP) return false;
  if (canonJson(base) === canonJson(cur)) return true;
  const bothArr = Array.isArray(base) && Array.isArray(cur);
  const bothObj = isPlainObj(base) && isPlainObj(cur);
  if (!bothArr && !bothObj) { out.u[prefix] = cur; out.n++; return out.n <= DP_CAP; } /* 잎 or 타입 변경 → 이 지점 통째 */
  if (bothArr) {
    for (let i = 0; i < cur.length; i++) {
      if (i >= base.length) { out.u[dpJoin(prefix, i)] = cur[i]; out.n++; }
      else if (!deepDiff(base[i], cur[i], dpJoin(prefix, i), out)) return false;
      if (out.n > DP_CAP) return false;
    }
    for (let i = cur.length; i < base.length; i++) { out.u[dpJoin(prefix, i)] = null; out.n++; } /* 줄어든 꼬리 삭제 */
    return out.n <= DP_CAP;
  }
  for (const k of Object.keys(cur)) {
    if (DP_BADKEY.test(k)) return false;
    if (!Object.prototype.hasOwnProperty.call(base, k)) { out.u[dpJoin(prefix, k)] = cur[k]; out.n++; }
    else if (!deepDiff(base[k], cur[k], dpJoin(prefix, k), out)) return false;
    if (out.n > DP_CAP) return false;
  }
  for (const k of Object.keys(base)) {
    if (Object.prototype.hasOwnProperty.call(cur, k)) continue;
    if (DP_BADKEY.test(k)) return false;
    out.u[dpJoin(prefix, k)] = null; out.n++;
  }
  return out.n <= DP_CAP;
};
/* RTDB 다중경로 갱신을 로컬에서 재현 — 자기검증용. null=삭제, 빈 컨테이너=삭제(RTDB 실측 의미론). */
const applyUpdates = (root, updates) => {
  const r = JSON.parse(JSON.stringify(root === undefined ? null : root));
  const box = { v: r };
  for (const path of Object.keys(updates)) {
    const segs = path.split("/");
    let node = box, key = "v";
    for (const s of segs) {
      if (node[key] === null || typeof node[key] !== "object") node[key] = {};
      node = node[key]; key = s;
    }
    node[key] = updates[path];
  }
  return box.v;
};
/* RTDB 는 null·빈 배열·빈 객체를 저장하지 않는다 → 비교 전에 같은 규칙으로 정규화. 배열의 꼬리 null 은 잘라낸다. */
const dpNormalize = (v) => {
  if (Array.isArray(v)) {
    const a = v.map(dpNormalize);
    while (a.length && (a[a.length - 1] === null || a[a.length - 1] === undefined)) a.pop();
    return a.length ? a : null; /* ★빈 배열 = RTDB 가 저장하지 않음 = '없음'. 빈 객체와도 **같은 상태**다 —
                                   둘을 구분하면 자기검증이 의미 없는 차이로 실패해 매번 통째 폴백한다(속성테스트 92/1500 적발). */
  }
  if (isPlainObj(v)) {
    const o = {};
    for (const k of Object.keys(v)) { const x = dpNormalize(v[k]); if (x !== null && x !== undefined) o[k] = x; }
    return Object.keys(o).length ? o : null; /* 빈 객체도 동일 */
  }
  return v === undefined ? null : v;
};
/* 경로가 서로 조상/자손이면 RTDB 가 거부한다 → 사전 차단(재귀 구조상 안 나오지만 계약을 코드로 못박음). */
const dpOverlaps = (paths) => {
  const s = [...paths].sort();
  for (let i = 1; i < s.length; i++) if (s[i] === s[i - 1] || s[i].startsWith(s[i - 1] + "/")) return true;
  return false;
};
const resetSyncState = () => { _syncBase = null; }; /* ★워크스페이스 전환 = 다른 blob → 기준선 폐기(E2 클래스 방지) */
/* 보낼 변경분만 추린다. null=기준선에 없음(=기준 모름) → 호출측이 통째 PUT. */
const diffForPatch = (data) => {
  if (!_syncBase || !data) return null;
  const out = {};
  try {
    const EMPTY = new Set([undefined, "null", "[]", "{}"]); /* 클라우드에 '없음'과 동치인 정규화 표현 */
    for (const k of Object.keys(data)) {
      const cur = canonJson(data[k]);
      const was = _syncBase[k];
      if (cur === was) continue;
      if (emptyish(data[k]) && EMPTY.has(was)) continue; /* 둘 다 '비어있음' = 같은 상태(헛된 write 방지) */
      out[k] = data[k];
    }
    /* 앱이 **소유한** 키인데 이번 데이터에 없음 = 삭제 의도(PUT 의 '키 누락=삭제'를 재현).
       ★소유 목록 밖의 키(외부 도구가 blob 에 심은 것)는 **절대 건드리지 않는다** — 이게 통째 PUT 보다 나은 지점. */
    for (const k of SYNC_OWNED) {
      if (!Object.prototype.hasOwnProperty.call(data, k) && !EMPTY.has(_syncBase[k])) out[k] = null;
    }
    return refineToLeafPaths(out); /* ★최상위 키 교체 → 실제 바뀐 잎만으로 정련(검증 통과 시에만) */
  } catch { return null; }
};
/* 최상위 키 통째 교체를 **잎 경로 갱신**으로 낮춘다. 키마다 독립 판정 — 한 키가 폴백해도 나머지는 이득을 본다.
   ★채택 조건: deepDiff 성공 + 경로 겹침 없음 + **기준선에 적용한 결과가 의도값과 canonical 일치**. 하나라도 어긋나면 그 키는 통째 교체(=오늘 동작). */
const refineToLeafPaths = (whole) => {
  let baseObj = null;
  try { baseObj = _syncBaseRaw ? JSON.parse(_syncBaseRaw) : null; } catch { baseObj = null; }
  if (!baseObj) return whole;
  const out = {};
  for (const k of Object.keys(whole)) {
    const cur = whole[k], base = baseObj[k];
    const diffable = (Array.isArray(cur) || isPlainObj(cur)) && (Array.isArray(base) || isPlainObj(base));
    if (!diffable) { out[k] = cur; continue; } /* 삭제(null)·잎·타입 불일치는 그대로 통째 */
    const acc = { u: {}, n: 0 };
    let good = false;
    try { good = deepDiff(base, cur, k, acc) && acc.n > 0 && !dpOverlaps(Object.keys(acc.u)); } catch { good = false; }
    if (good) {
      try {
        const sim = applyUpdates({ [k]: base }, acc.u);
        good = canonJson(dpNormalize(sim[k])) === canonJson(dpNormalize(cur)); /* ★자기검증 */
      } catch { good = false; }
    }
    if (good) { for (const p of Object.keys(acc.u)) out[p] = acc.u[p]; }
    else out[k] = cur;
  }
  if (dpOverlaps(Object.keys(out))) return whole; /* 최종 안전망: 겹치면 RTDB 가 거부하므로 통째로 */
  return out;
};

/* 클라우드 저장: Firebase PATCH(바뀐 키만) — 기준선 없으면 PUT (2초 디바운스) */

/* ★await 없이 요청을 낸다(2026-10-08). 언로드 중에는 pagehide 처리 직후의 마이크로태스크까지만 돌고

      await 뒤에서 계산하면 기준선이 이미 비어 PATCH 대신 blob 통째 PUT 이 나갔다.

      숨김·전환·자정 리로드(이 promise 를 기다림)에서는 그대로 도착하고, 탭닫기에서는 최선. */
const KEEPALIVE_MAX = 60000;
const flushCloudSave = () => {
  if (!_pendingData) return Promise.resolve();
  clearTimeout(_saveTimer); _saveTimer = null;
  const data = _pendingData; const path = _pendingPath || WS.fbPath; _pendingData = null; /* ★E2: 예약 시점 경로로 flush(전환돼도 옛 데이터는 옛 경로로) */
  const url = "https://taskmgr-sync-default-rtdb.firebaseio.com/" + path + ".json";
  /* ★여기서도 바뀐 키만 PATCH. 성공 확인이 불가능한 경로라 기준선(_syncBase)은 갱신하지 않는다(다음 저장이 조금 더 보내면 그만·안전측).
     전환 직후에 응답이 오면 이미 다른 워크스페이스의 기준선이므로, 여기서 갱신하면 안 된다. */
  let req;
  try {
    const patch = diffForPatch(data);
    const sendAll = data;
    const sendRec = !!(patch && Object.prototype.hasOwnProperty.call(patch, "recurrings"));
    const payload = patch ? { ...patch, ...(sendRec ? { recurrings: sendAll.recurrings } : {}) } : sendAll;
    const body = JSON.stringify(payload);
    req = { method: patch ? "PATCH" : "PUT", headers: { "Content-Type": "application/json" }, body, keepalive: new TextEncoder().encode(body).length <= KEEPALIVE_MAX };
  } catch { return Promise.resolve(); }
  const send = (q) => fetch(url + q, req).catch(() => {});
  const q = authParamNow();
  if (q !== null) return send(q);

};

/* ★과제·영역 순서 = ① 묶음(projSortKey: 루틴 → 과제(kind project) → 그 외 → 기타) ② 묶음 안은 PROJ_ORDER ③ 표에 없는 카드는 그 묶음 끝(만든 순서).
   드롭다운 전부(PrSel)·영역/과제 탭 카드·오늘 탭 「전체 현황」·「이번 주」 동점·반복 설정 묶음이 이 한 규칙을 쓴다.

const isSystemProj = (p) => !!p && p.kind === "system"; /* PDS 자체를 굴리는 것 — 영역 탭에 세우지 않는다 */
const projSortKey = (p) => isRoutineProj(p) ? 0 : (p && p.kind === "project") ? 1 : (p && (p.id === "petc" || p.id === "proj_etc")) ? 3 : 2; /* 루틴(kind 또는 반복보유) 먼저 = isRoutineProj로 자동 도출 반영(2026-07-12) */
/* ★순서표(2026-10-08 소유자). 영역·과제의 생성·삭제·이름 수정·순서 변경은 소유자가 요청하면 코드로 바꾼다 — 앱에는 그 단추가 없다.
   옛 규칙은 「묶음 안 = 배열 순서(만든 순서)」라 카드가 새로 들어올 때마다 엉뚱한 자리에 섰다
   (09-07 앱에서 만든 과제가 RAG 위 · 10-07 옮겨 온 PM 엔진이 과제들 사이).
   코드로 카드를 심을 때는 같은 커밋에서 여기에 id 를 넣는다(빠뜨리면 그 묶음 맨 끝).
   저장 데이터의 projects[].order 는 정렬에 쓰지 않는 옛 값이다(값이 겹친다). ⚠ 공개 저장소 — 앱에서 만든 카드는 id 만 적는다. */
const PROJ_ORDER = {
  work: ["p_judge", "p_workcap", "accel", "hakchuin", "rag", "dokpamo", "p_fuxhhqz", "optcode", "gpu", "itrc", "compiler", "proj_general", "proj_etc"],
  personal: PERSONAL_PROJECTS.map(p => p.id),
};
const projRank = (p) => { const i = (PROJ_ORDER[WS.key] || []).indexOf(p && p.id); return i < 0 ? 1e6 : i; };
const projCmp = (a, b) => (projSortKey(a) - projSortKey(b)) || (projRank(a) - projRank(b));
const sortProjsForSelect = (projects) => [...(projects || [])].sort(projCmp);
/* ★영역 화면 순서 = 집중(★) 맨 위 → projCmp. 그 아래 버킷(배열 순서) — 영역/과제 탭이 그리는 순서 그대로다.
   오늘 탭 「전체 현황」도 이 순서로 줄을 세운다(2026-10-11 소유자 「전체 현황 토글도 영역/과제에서 정의한 카테고리 순서대로」). */
const areaCmp = (a, b) => ((b && b.focus ? 1 : 0) - (a && a.focus ? 1 : 0)) || projCmp(a, b);
const areaCards = (projects) => [...(projects || []).filter(p => !isBucketProj(p) && !isSystemProj(p)).sort(areaCmp), ...(projects || []).filter(p => isBucketProj(p))];

   켜도 줄은 움직이지 않는다(올리려면 ⠿). 날짜가 바뀌어도 저절로 꺼지지 않는다 — 직접 끈다(소유자 결정 2026-10-07).

/* 휴대폰 폭인가 — CSS 의 @media (max-width: 640px) 와 같은 기준. 화면을 돌리면 다시 판단한다. */
const PHONE_Q = "(max-width: 640px)";
const useIsPhone = () => {
  const [m, setM] = useState(() => { try { return window.matchMedia(PHONE_Q).matches; } catch { return false; } });
  useEffect(() => {
    let mq; try { mq = window.matchMedia(PHONE_Q); } catch { return; }
    const f = () => setM(mq.matches);
    if (mq.addEventListener) mq.addEventListener("change", f); else mq.addListener(f);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", f); else mq.removeListener(f); };
  }, []);
  return m;
};
/* ★휴대폰 뒤로가기로 창을 닫는다(2026-10-07). history 처리가 없어 수정 창에서 뒤로가기를 누르면 창이 아니라 페이지를 떠났다.
   창이 열릴 때 기록을 한 칸 쌓고, 뒤로가기가 그 칸을 꺼내면 닫는다. onBack 이 false 를 돌려주면(고친 내용이 있는데 닫기 취소)
   다음 손가락·키 입력 때 칸을 다시 쌓는다 — 뒤로가기 처리 중에 바로 쌓으면 브라우저가 그 칸을 「건너뛸 칸」으로 표시해
   다음 뒤로가기가 앱을 떠난다. 저장·취소로 닫힐 때는 이 창이 쌓은 칸만 스스로 꺼낸다. */
try { if (history.state && history.state.tmModal) history.replaceState(null, ""); } catch {} /* 창을 연 채 새로고침(자정 포함)된 칸 정리 */
let MODAL_SEQ = 0;
const useBackClose = (onBack) => {
  const ref = useRef(onBack); ref.current = onBack;
  useEffect(() => {
    const token = ++MODAL_SEQ + ":" + Date.now();
    let armed = false, popped = false, rearm = null;
    const arm = () => { try { history.pushState({ tmModal: token }, ""); armed = true; } catch {} };
    const unhook = () => { if (rearm) { document.removeEventListener("pointerdown", rearm, true); document.removeEventListener("keydown", rearm, true); rearm = null; } };
    const onPop = () => {
      if (!armed) return;
      armed = false; popped = true;
      if (ref.current() === false) {
        popped = false;
        rearm = () => { unhook(); arm(); };
        document.addEventListener("pointerdown", rearm, true); document.addEventListener("keydown", rearm, true);
      }
    };
    arm();
    window.addEventListener("popstate", onPop);
    return () => {
      window.removeEventListener("popstate", onPop);
      unhook();
      if (armed && !popped) { try { if (history.state && history.state.tmModal === token) history.back(); } catch {} }
    };
  }, []);
};
/* 고친 것이 있는지 — 없던 칸이 빈 값으로 생긴 것(회고를 한 글자 쓰고 지움 등)은 고친 것으로 보지 않는다. */
const sameEdit = (a, b) => {
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys) {
    const x = a[k], y = b[k];
    if (x === y || (!x && !y)) continue;
    if (typeof x === "object" && typeof y === "object" && JSON.stringify(x) === JSON.stringify(y)) continue;
    return false;
  }
  return true;
};
/* 내일 날짜(YYYY-MM-DD) — 수정 창의 「내일」 단추(하루 끝에 남은 일을 넘길 때 ✏️ → 내일 → 저장) */
const tomorrowOf = (ymd) => { const d = new Date(ymd + "T00:00:00"); d.setDate(d.getDate() + 1); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

/* ─── TaskRow (서브태스크 확장 + 드래그 정렬) ─── */
/* ★순서 바꾸기(2026-09-14 소유자 요청으로 복원) — 오늘 탭 목록에서만.
   2026-09-13 에 걷어냈다가 되살렸다. 복원 범위는 **순서 바꾸기 하나**이고,
   목록 밖으로 끌어 「오늘에서 내리기」는 되살리지 않는다(순서 바꾸기와 겹쳌 오발동하던 자리). */
const useDragReorder = (onReorder, attr = "data-task-card") => {
  const SEL = "[" + attr + "]";
  const st = useRef(null);
  const clearAll = () => {
    document.querySelectorAll(".drop-indicator-before, .drop-indicator-after")
      .forEach(el => el.classList.remove("drop-indicator-before", "drop-indicator-after"));
  };
  const finish = (commit) => {
    const s = st.current; if (!s) return;
    st.current = null;
    clearAll();
    if (s.card) { s.card.style.opacity = ""; s.card.style.transform = ""; }
    document.body.style.userSelect = "";
    if (commit && s.moved && s.target && s.target.id !== s.id) onReorder(s.id, s.target.id, s.target.pos);
  };
  return {
    onPointerDown: (id, e) => {
      if (e.button != null && e.button > 0) return; /* 왼쪽 버튼·터치만 */
      e.preventDefault(); e.stopPropagation();      /* HTML5 dragstart 와 텍스트 선택을 함께 막는다 */
      const card = e.currentTarget.closest(SEL);
      st.current = { id, card, moved: false, target: null };
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
      document.body.style.userSelect = "none";
      if (card) { card.style.opacity = "0.45"; card.style.transform = "scale(0.99)"; }
    },
    onPointerMove: (e) => {
      const s = st.current; if (!s) return;
      e.preventDefault();
      s.moved = true;
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const card = under && under.closest ? under.closest(SEL) : null;
      clearAll();
      if (!card || card === s.card) { s.target = null; return; }
      const tid = card.getAttribute(attr);
      if (!tid || tid === s.id) { s.target = null; return; }
      const r = card.getBoundingClientRect();
      /* 삽입 위치는 **카드 본체(.task-row)** 의 중앙으로 잰다 — 하위 항목을 펼친 카드는
         바깥 상자가 훨씬 길어서 바깥 기준으로 재면 겨냥한 자리와 결과가 어긋난다. */
      const row = card.querySelector(".task-row");
      const rr = row ? row.getBoundingClientRect() : r;
      const pos = e.clientY < rr.top + rr.height / 2 ? "before" : "after";
      card.classList.add(pos === "before" ? "drop-indicator-before" : "drop-indicator-after");
      s.target = { id: tid, pos };
    },
    onPointerUp: () => finish(true),
    onPointerCancel: () => finish(false),
  };
};
const TaskRow = ({ task, onDone, onDel, onFocus, showProj, projects, onEdit, onUpdate, dragHandlers, hideSubIds, inToday, onDelSub }) => {
  const dh = dragHandlers || {};
  const [h, setH] = useState(false);
  const [showSubs, setShowSubs] = useState(false);
  const [addSub, setAddSub] = useState(false);
  const [showNotes, setShowNotes] = useState(false);
  const subs = task.subtasks || [];
  const doneSubCnt = subs.filter(s => s.status === "done").length;
  /* ★오늘 탭 하위 두 줄 표시 제거(2026-10-02 · 소유자 「서브페이지 생성하면 한번에 두개 페이지 나옴」).
     오늘 목록은 수행날짜가 오늘(지난 것 포함)인 하위를 따로 한 줄로 세운다 — 상위와 상태가 같으면 상위 바로 아래(2026-09-08),
     다르면 그 상태 무리 끝에 「↳ 상위」 표시와 함께. 그런데 +sub·▼ 로 카드를 펼치면 같은 하위가 펼친 목록에도 그려져
     한 항목이 두 줄로 보였다(+sub 로 추가하면 카드가 저절로 펼쳐져 곧바로 보였다). 데이터는 하나다 — 진행 배지 n/m 가 증거.
     → 오늘 목록에 이미 선 하위는 펼친 목록에서만 뺀다. 영역 탭은 오늘 목록이 없어 hideSubIds 를 안 넘기므로 그대로 전부 보인다.
     하위가 전부 오늘 목록에 서 있으면 펼칠 것이 없으므로 ▼ 도 숨긴다.
     ⛔ 별·완료·삭제는 계속 전체(subs)로 계산한다 — listSubs 로 바꾸면 숨긴 하위가 저장에서 빠진다. */
  const listSubs = hideSubIds ? subs.filter(s => !hideSubIds.has(s.id)) : subs;
  const p = projects?.find(x => x.id === task.project);

  const handleAddSub = ({ text, status, focus, scheduledDate, scheduledLabel, planDate }) => {
    if (!onUpdate) return;
    const pd = planDate || "";
    onUpdate({ ...task, subtasks: [...subs, { id: gid(), text, status, focus, scheduledDate: scheduledDate || "", scheduledLabel: scheduledLabel || "", planDate: pd, notes: "", createdAt: TODAY }] }); /* 별=집중(날짜와 분리, 2026-06-30) */
    setShowSubs(true); /* 입력칸은 열어 둔다 — 하위를 이어서 넣는다(2026-10-07) */
  };

  /* 카드에 남는 HTML5 드래그는 **섹션 이동 전용**이다(오늘로 보내기 / 오늘에서 내리기).
     ★순서변경은 손잡이의 포인터 드래그로 옮겼다(2026-09-07). 옛 코드는 카드 자체가 순서변경 드롭을
     받으면서 e.stopPropagation() 을 부르지 않아, 전체 현황에서 순서를 바꾸려 놓으면 부모의
     '오늘에서 내리기' 가 함께 발동해 수행날짜까지 바뀌었다. 2026-09-14 복원 시 **순서 바꾸기만** 되살려 그 겹침이 생기지 않는다(목록 밖 드롭 = 오늘에서 내리기는 복원 안 함). */

  return (
    <div data-task-card={task.id}>
      <div className="task-row" style={{ ...S.row, background: h ? "#f8fafc" : task.focus ? "#FFFDF5" : "transparent", transition: "border 0.15s, transform 0.15s" }} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} onTouchStart={() => setH(true)}>
        {dh.onPointerDown && <span className="grip" style={{ color: "#9ca3af", fontSize: 15, cursor: "grab", flexShrink: 0, marginTop: 1, padding: "2px 4px", userSelect: "none", touchAction: "none" }} title="여기를 잡고 끌어 순서 변경"
          onPointerDown={(e) => dh.onPointerDown(task.id, e)} onPointerMove={dh.onPointerMove} onPointerUp={dh.onPointerUp} onPointerCancel={dh.onPointerCancel}>⠿</span>}
        <StarBtn on={task.focus} onClick={() => onFocus(task.id)} />
        <button className="hit-done" onClick={() => onDone(task.id)} title="완료"
          style={{ border: "none", background: "transparent", padding: 0, cursor: "pointer", flexShrink: 0, marginTop: 2 }}>
          <span style={{ display: "block", width: 18, height: 18, boxSizing: "border-box", borderRadius: "50%", border: `2px solid ${STATUSES[task.status]?.color || "#ccc"}` }} />
        </button>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
            {/* 오늘 탭(오늘 할 일·전체 현황)에서는 같은 말을 두 번 하지 않는다 — 상태는 묶음 제목이, 오늘·지난 수행날짜는 목록이 말한다. 시간은 남긴다. */}
            {!inToday && <Badge st={task.status} />}
            {task.planDate && (!inToday || task.planDate > TODAY) && <span style={{ fontSize: 10, color: "#6366F1", fontWeight: 600, background: "#EEF2FF", padding: "1px 5px", borderRadius: 6 }}>📆 {fd(task.planDate)}{task.planTime ? " 🕒" + task.planTime : ""}</span>}
            {inToday && task.planDate && task.planDate <= TODAY && task.planTime && <span style={{ fontSize: 10, color: "#6366F1", fontWeight: 600, background: "#EEF2FF", padding: "1px 5px", borderRadius: 6 }}>🕒 {task.planTime}</span>}
            {task.scheduledDate && (() => { const dl = deadlineInfo(task.scheduledDate); return dl ? <span style={S.dlBdg(dl)}>{dl.icon} {dl.label}</span> : null; })()}
            {task.scheduledDate && <span style={{ fontSize: 10, color: "#6B7280" }}>마감 {fd(task.scheduledDate)}</span>}
            {task.scheduledLabel && <span style={{ fontSize: 10, color: "#9ca3af" }}>({task.scheduledLabel})</span>}
            {subs.length > 0 && <span style={S.progBdg}>{doneSubCnt}/{subs.length}</span>}
            {showProj && p && <span style={{ fontSize: 11, color: "#9ca3af" }}>#{p.name}</span>}
            {WS.key === "work" && task.respPlan && <span title="업무 대응안에 포함 — 「업무」 카드 회고 칸 위에 모인다(완료·횟수와는 묶지 않는다)" style={{ fontSize: 11, fontWeight: 600, color: "#B45309", background: "#FFFBEB", border: "1px solid #FDE68A", padding: "0 5px", borderRadius: 6, whiteSpace: "nowrap" }}>대응안</span>}
            {/* (2026-06-26) 마커 표시 폐지 — 채널=프로젝트 버킷 */}
            {task.notes && <span onClick={(e) => { e.stopPropagation(); setShowNotes(!showNotes); }} style={{ cursor: "pointer", fontSize: 10, color: showNotes ? "#92400E" : "#B45309", background: showNotes ? "#FEF3C7" : "#FFFBEB", border: "1px solid #FDE68A", padding: "1px 5px", borderRadius: 4, userSelect: "none" }}>📝 메모</span>}
          </div>
          <div style={S.txt}><Clamp text={task.text} lines={2} /></div>
          {task.notes && showNotes && <div style={{ marginTop: 4, fontSize: 12, background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 6, padding: "5px 9px", color: "#92400E", whiteSpace: "pre-wrap" }}><span style={{ fontSize: 9, fontWeight: 700, opacity: 0.65, marginRight: 6 }}>📝 메모</span><LinkText text={task.notes} /></div>}
        </div>
        <div className="task-actions" style={{ display: h ? "flex" : "none", gap: 3, flexShrink: 0, alignItems: "center" }}>
          {listSubs.length > 0 && <button style={S.gh} onClick={() => setShowSubs(!showSubs)} title="하위 할일">{showSubs ? "▲" : "▼"}</button>}
          <button style={{ ...S.gh, fontSize: 10, padding: "4px 6px" }} onClick={() => { setAddSub(!addSub); if (!addSub) setShowSubs(true); }} title="하위 할일 추가">+sub</button>
          <button style={S.gh} onClick={() => onEdit(task)}>✏️</button>
          <button style={{ ...S.gh, color: "#EF4444" }} onClick={() => onDel(task.id)}>✕</button>
        </div>
      </div>
      {showSubs && listSubs.length > 0 && (
        <div style={{ marginLeft: 20, borderLeft: "2px solid #e5e7eb", paddingLeft: 4, marginBottom: 4 }}>
          {listSubs.map(s => (
            <SubRow key={s.id} sub={s}
              onToggleFocus={() => onUpdate && onUpdate({ ...task, subtasks: subs.map(x => x.id === s.id ? { ...x, focus: !x.focus } : x) })}
              onToggleDone={() => { if (s.status !== "done" ? !doneGuard() : justDone()) return; onUpdate && onUpdate({ ...task, subtasks: subs.map(x => x.id === s.id ? { ...x, status: x.status === "done" ? "action" : "done" } : x) }); }}
              onDel={() => onDelSub ? onDelSub(task.id, s.id) : (onUpdate && onUpdate({ ...task, subtasks: subs.filter(x => x.id !== s.id) }))}
              onEdit={() => onEdit(s, task.id)}
            />
          ))}
        </div>
      )}
      {addSub && (
        <div style={{ marginLeft: 28, marginBottom: 6 }}>
          <SubAddForm onAdd={handleAddSub} onCancel={() => setAddSub(false)} />
        </div>
      )}
    </div>
  );
};

/* ─── 드래그 정렬 훅 ─── */
/* ★포인터 기반 순서변경(2026-09-07 · 소유자 「모바일 PC 전부 안 됨」).
   옛 방식은 HTML5 draggable 이었는데 그것은 **휴대폰 터치로는 시작조차 되지 않는다**(브라우저가 손가락에
   dragstart 를 발생시키지 않는다). 소유자는 평소 휴대폰으로 쓰므로 그 경로가 통째로 죽어 있었다.
   → Pointer Events 로 바꾼다. 마우스·터치·펜이 같은 코드를 타므로 PC 와 휴대폰이 한 경로가 된다.
   손잡이(⠿)를 잡을 때만 시작한다: 카드 아무 데나 잡으면 목록 스크롤과 싸우게 된다.
   버튼은 늘리지 않는다(소유자 요청) — 이미 있는 손잡이를 휴대폰에서도 보이게 하는 것으로 끝낸다. */
const AddForm = ({ projects, onAdd, defProj }) => {
  const [t, setT] = useState(""); const [s, setS] = useState("action"); const [p, setP] = useState(defProj || ""); const [f, setF] = useState(false); const [sd, setSd] = useState(""); const [sl, setSl] = useState(""); const [pd, setPd] = useState(""); const r = useRef();
  /* 프로젝트/과제 미선택 상태로 시작(2026-07-04, 소유자) — 첫 항목 자동선택 안 함. 고르지 않으면 추가 안 됨(오분류 방지). */
  /* ★휴대폰에서는 접힌 한 줄(입력칸 + 추가)로 시작하고 입력칸을 누르면 지금 칸들이 그대로 펼쳐진다(2026-10-07).
     입력칸은 두 모양에서 같은 자리(첫 자식)라 펼쳐져도 포커스·글자가 남는다. 주제 필수(2026-07-04)는 그대로 — 주제 없이 추가하면 펼치고 짚어 준다. */
  const phone = useIsPhone();
  const [open, setOpen] = useState(false);
  const [need, setNeed] = useState(false);
  const full = !phone || open;
  const go = () => {
    if (!t.trim()) return;
    if (!p) { setOpen(true); setNeed(true); return; }
    onAdd({ text: t.trim(), status: s, project: p, focus: f, scheduledDate: sd, scheduledLabel: sl, planDate: pd }); setT(""); setS("action"); setF(false); setSd(""); setSl(""); setPd(""); setNeed(false); r.current?.focus();
  };
  return (
    <div className={full ? "form-row" : "add-compact"} style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
      <input ref={r} style={S.inp} placeholder="새 할일 입력..." value={t} onChange={e => setT(e.target.value)} onFocus={() => setOpen(true)} onKeyDown={e => e.key === "Enter" && go()} />
      {full && <StSel value={s} onChange={setS} compact />}
      {full && !defProj && <PrSel value={p} onChange={v => { setP(v); setNeed(false); }} projects={projects} highlight={!!t.trim() && !p} />}
      {full && need && !p && <div style={{ fontSize: 12, color: "#B45309" }}>{WS.key === "personal" ? "주제" : "과제"}를 골라야 추가됩니다</div>}
      {full && <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
        <span style={{ fontSize: 10, color: "#6366F1", fontWeight: 600 }}>📆</span>
        <input type="date" max={DATE_MAX} style={{ ...S.fld, width: 130, flex: "none", fontSize: 11 }} value={pd} onChange={e => setPd(e.target.value)} onKeyDown={e => e.key === "Enter" && go()} title="📆 언제할지 (선택)" />
        <TodayBtn value={pd} onChange={setPd} />
      </div>}
      {full && <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
        <span style={{ fontSize: 10, color: "#9ca3af" }}>마감</span>
        <input type="date" max={DATE_MAX} style={{ ...S.fld, width: 130, flex: "none", fontSize: 11 }} value={sd} onChange={e => setSd(e.target.value)} onKeyDown={e => e.key === "Enter" && go()} title="마감일 (선택)" />
      </div>}
      {full && <button className="star-btn" style={{ ...S.star(f), border: "1px solid #e5e7eb", borderRadius: 5, width: 28, height: 28 }} onClick={() => setF(!f)} title="지금 먼저 할 것으로 표시">
        {f ? "★" : "☆"}
      </button>}
      <button style={S.btn()} onClick={go}>추가</button>
      {phone && open && <button style={{ ...S.gh, fontSize: 12 }} onClick={() => { setOpen(false); setNeed(false); r.current?.blur(); }}>접기 ▲</button>}
    </div>
  );
};

/* ─── EditModal (task + subtask 공용) ─── */
/* 오늘에서 내리기 얼럿(2026-07-04, 소유자) — 무조건 날짜 없앰 대신 [다른 날짜로 변경 / 날짜 없앰 / 취소] 선택 */
const ClearTodayModal = ({ task, onApply, onCancel }) => {
  const [nd, setNd] = useState(task.planDate || TODAY);
  const down = useRef(false);
  return (
    <div style={S.mod} onMouseDown={e => { down.current = e.target === e.currentTarget; }} onClick={e => { if (e.target === e.currentTarget && down.current) onCancel(); }}>
      <div style={{ background: "#fff", borderRadius: 12, padding: 16, width: "88%", maxWidth: 340, boxShadow: "0 10px 40px rgba(0,0,0,0.2)" }}>
        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>오늘에서 내리기</div>
        <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 12, wordBreak: "break-all" }}>{task.text}</div>
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 14 }}>
          <span style={{ fontSize: 11, color: "#6366F1", flexShrink: 0 }}>📆 다른 날짜로</span>
          <input type="date" max={DATE_MAX} value={nd} onChange={e => setNd(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && nd) onApply(nd); }} style={{ ...S.fld, fontSize: 12, flex: 1 }} />
        </div>
        <div style={{ display: "flex", gap: 6, justifyContent: "flex-end", flexWrap: "wrap" }}>
          <button style={{ ...S.gh, fontSize: 12 }} onClick={onCancel}>취소</button>
          <button style={{ ...S.gh, fontSize: 12 }} onClick={() => onApply("")} title="수행날짜를 비워 백로그로 내림">날짜 없앰</button>
          <button style={{ ...S.btn("#4338CA"), fontSize: 12, opacity: nd ? 1 : 0.5 }} onClick={() => nd && onApply(nd)}>이 날짜로</button>
        </div>
      </div>
    </div>
  );
};
const EditModal = ({ task, projects, onSave, onClose, isSubtask, isWork }) => {
  const [f, setF] = useState({ ...task });
  const u = (k, v) => setF(p => ({ ...p, [k]: v }));
  const overlayDown = useRef(false); /* 바깥클릭 닫기는 '오버레이에서 시작한 클릭'만 — textarea 드래그가 오버레이에서 끝나도 안 닫히게(2026-06-29) */
  /* (2026-07-31) 첨부 제거로 저장/취소의 파일 부수효과(업로드 롤백·삭제 예약·업로드 중 저장 잠금)도 함께 사라짐 — 둘 다 순수 동작 */
  const cancel = () => { onClose(); };
  const commit = () => { onSave(f); onClose(); };
  /* 바깥 회색·뒤로가기로 닫을 때는 고친 내용이 있을 때만 묻는다(2026-10-07). 「취소」는 버리겠다는 뜻이라 묻지 않는다. */
  const softClose = () => {
    if (!sameEdit(f, task) && !window.confirm("고친 내용을 저장하지 않고 닫을까요?")) return false;
    onClose(); return true;
  };
  useBackClose(softClose);
  const tmr = tomorrowOf(TODAY);
  return (
    <div style={S.mod} onMouseDown={e => { overlayDown.current = e.target === e.currentTarget; }} onClick={e => { if (e.target === e.currentTarget && overlayDown.current) softClose(); }}>
      <div className="modal-content" style={S.modC} onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 16 }}>{isSubtask ? "하위 할일 수정" : "할 일 수정"}</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

              업무 대응안에 포함(2026-10-07 · 소유자 「업무 앱 내 개별 태스크들 중에서 선별하여 대응안을 심도있게 짜는 전략 —
              이 태스크 내용을 포함한다고 표시하고 싶음」 · 켜는 곳은 이 창 하나)은 완료·「이번 주」 숫자와 묶지 않는다
              (「태스크를 종결하는건 또 다른 일」). 표시한 할 일 제목은 과제 탭 「업무」 카드의 회고 칸 위에 모인다. */}

              style={{ ...S.gh, fontSize: 12, fontWeight: f.focus ? 700 : 400, background: f.focus ? "#FFFBEB" : "#fff", color: f.focus ? "#B45309" : "#6b7280", borderColor: f.focus ? "#FCD34D" : "#e5e7eb" }}>{f.focus ? "★ 지금 먼저" : "☆ 지금 먼저"}</button>
            {isWork && !isSubtask && <button type="button" onClick={() => u("respPlan", !f.respPlan)}
              style={{ ...S.gh, fontSize: 12, fontWeight: f.respPlan ? 700 : 400, background: f.respPlan ? "#FFFBEB" : "#fff", color: f.respPlan ? "#B45309" : "#6b7280", borderColor: f.respPlan ? "#FCD34D" : "#e5e7eb" }}>{f.respPlan ? "✓ 업무 대응안에 포함" : "＋ 업무 대응안에 포함"}</button>}
          </div>
          <div>
            <div style={{ ...S.lbl, color: "#6366F1", fontWeight: 600 }}>📆 언제할지 (선택)</div>
            <div className="plan-fields" style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <input type="date" max={DATE_MAX} style={{ ...S.fld, width: 160, flex: "none" }} value={f.planDate || ""} onChange={e => u("planDate", e.target.value)} />
              {/* 「오늘」·「내일」은 한 묶음 — 휴대폰에서 칸이 세로로 쌓여도 둘은 한 줄에 나란히 선다(창이 길어지지 않게).
                  「내일」(2026-10-07) = 하루 끝에 남은 일을 다음 날로 넘길 때 ✏️ → 내일 → 저장 */}
              <div style={{ display: "flex", gap: 6 }}>
                <TodayBtn value={f.planDate || ""} onChange={v => u("planDate", v)} />
                <button type="button" onClick={() => u("planDate", f.planDate === tmr ? "" : tmr)} title={f.planDate === tmr ? "수행날짜 비우기" : "수행날짜를 내일로"}
                  style={{ ...S.gh, fontSize: 11, padding: "2px 7px", flexShrink: 0, background: f.planDate === tmr ? "#EEF2FF" : "#fff", color: f.planDate === tmr ? "#4338CA" : "#6b7280", fontWeight: f.planDate === tmr ? 700 : 400 }}>내일</button>
              </div>
              <span style={{ fontSize: 11, color: "#6366F1" }}>🕒</span><input type="time" style={{ ...S.fld, width: 120, flex: "none" }} value={f.planTime || ""} onChange={e => u("planTime", e.target.value)} title="시간(선택)" />

            <div className="plan-fields" style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <input type="date" max={DATE_MAX} style={{ ...S.fld, width: 160, flex: "none" }} value={f.scheduledDate || ""} onChange={e => u("scheduledDate", e.target.value)} />
              <input style={{ ...S.fld, flex: 1 }} placeholder="시기 (예: 하반기, 9월 이후)" value={f.scheduledLabel || ""} onChange={e => u("scheduledLabel", e.target.value)} />
              {f.scheduledDate && (() => { const dl = deadlineInfo(f.scheduledDate); return dl ? <span style={S.dlBdg(dl)}>{dl.icon} {dl.label}</span> : null; })()}
              {f.scheduledDate && <button style={{ ...S.gh, fontSize: 10, color: "#EF4444" }} onClick={() => { u("scheduledDate", ""); u("scheduledLabel", ""); }}>✕</button>}

          <div><div style={S.lbl}>📝 메모 / 맥락 <span style={{ color: "#9ca3af", fontWeight: 400 }}>(할 때 볼 것 · 이 카드 안에만 남습니다)</span></div><textarea style={S.ta} rows={3} value={f.notes || ""} onChange={e => u("notes", e.target.value)} /></div>
          {/* ★메모와 회고를 두 칸으로 가른다. 한 칸이던 때는 「지금 참고할 것」과 「하고 나서 알게 된 것」이 섞여
              영역 카드에 참조용 메모까지 떠 있었다. */}
          {!isSubtask && <div><div style={{ ...S.lbl, color: "#4338CA" }}>🪞 회고 <span style={{ color: "#9ca3af", fontWeight: 400 }}>(하고 나서 남길 것 · 영역 카드에 쌓이고 주간 정리에서 수확됩니다)</span></div><textarea style={{ ...S.ta, borderColor: "#C7D2FE" }} rows={2} value={f.recap || ""} onChange={e => u("recap", e.target.value)} placeholder="코치가 고쳐 준 것, 하다가 발견한 것, 판단이 맞았는지" /></div>}
          <div style={{ fontSize: 10, color: "#9ca3af" }}>완료한 뒤에도 <b>히스토리 탭</b>에서 그 항목의 <b>🪞＋</b>로 회고를 적을 수 있습니다.</div>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
            <button style={S.gh} onClick={cancel}>취소</button>
            <button style={S.btn()} onClick={commit}>저장</button>
          </div>
        </div>
      </div>
    </div>
  );
};

/* ═══ 계획 요약 (planDate 기준 오늘/이번주) ═══ */
const PlanDateSummary = ({ tasks, projects, onEdit }) => {
  const planned = useMemo(() => {
    const items = [];
    tasks.forEach(t => {
      if (t.status !== "done" && t.planDate) items.push(t);
      (t.subtasks || []).forEach(s => { if (s.status !== "done" && s.planDate) items.push({ ...s, project: t.project, _parentId: t.id }); });
    });
    return items;
  }, [tasks]);
  const weekPlan = planned.filter(t => { const d = diffDays(t.planDate); return d !== null && d > 0 && d <= 7; }).sort((a, b) => a.planDate.localeCompare(b.planDate));
  /* ★반복 인스턴스는 여기 넣지 않는다(2026-09-17). 지난 날짜로 남아 있는 반복은 이미 「오늘 할 일」에 떠 있거나(그 주 회차)
     내려간 것(지난 회차)이라, 여기 또 세우면 같은 줄이 두 번 보였다 — 주N회를 오늘 할 일로 올린 09-15 배포부터 생긴 증상. */
  /* ★반복 인스턴스의 **하위**도 넣지 않는다(2026-10-02). 하위는 위 복사본에 recurringId 가 없어 이 규칙을 빠져나갔다.
     반복 부모의 하위는 이월되지 않아(이월 effect 의 `if (t.recurringId) return`) 지난 날짜로 남는데, 오늘 목록은 하위를
     날짜만 보고 세우므로(focusedSubs) 이미 「오늘 할 일」에 떠 있다 → 여기 또 세우면 같은 줄이 두 번 보였다.
     복사본에 표시를 달지 않고 부모 id 로 거른다 — ✏️ 로 고치면 복사본이 그대로 하위에 저장되기 때문이다. */
  const recParentIds = new Set(tasks.filter(t => t.recurringId).map(t => t.id));
  const overduePlan = planned.filter(t => { const d = diffDays(t.planDate); return d !== null && d < 0 && !t.recurringId && !(t._parentId && recParentIds.has(t._parentId)); }).sort((a, b) => a.planDate.localeCompare(b.planDate));
  const [weekOpen, setWeekOpen] = useState(false);
  if (!weekPlan.length && !overduePlan.length) return null;
  /* ★요약 줄 제목은 오늘 목록 카드와 같은 Clamp 로 그린다(2026-10-02). 전역 줄바꿈(<style> body ★) 뒤로는 600자 URL 제목이
     옆으로 넘치는 대신 스무 줄로 감겼다 — 2026-09-14 「URL 한 줄이 세 줄로 감기는 것을 막는다」(Clamp ★)와 어긋난다.
     바깥 줄(날짜 + 이 줄)에서 이 줄이 남은 폭만 쓰도록 flex:1·minWidth:0 — 없으면 제목 길이만큼 자리를 잡아 날짜가 한 글자 폭으로 눌렸다.
     컴포넌트(<PlanItem/>)가 아니라 함수로 부른다: 이 안에서 만든 컴포넌트는 그릴 때마다 새 종류라 통째로 다시 붙고,
     그러면 Clamp 의 ▼ 더보기 펼침이 별·완료·알림 닫힘 같은 아무 갱신에도 접혔다. */
  const planItem = (t) => {
    const p = projects.find(x => x.id === t.project);
    return (
      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12, flex: 1, minWidth: 0 }}>
        <Badge st={t.status} />
        <span style={{ color: "#374151", flex: 1 }}><Clamp text={t.text} lines={2} /></span>
        {p && <span style={{ fontSize: 10, color: "#9ca3af" }}>#{p.name}</span>}
        {t._parentId && <span style={{ fontSize: 9, color: "#9ca3af" }}>↳</span>}
        <button style={{ ...S.gh, fontSize: 10, padding: "1px 5px" }} onClick={() => onEdit(t, t._parentId)}>✏️</button>
      </div>
    );
  };
  return (
    <div style={{ marginBottom: 12 }}>
      {overduePlan.length > 0 && <div style={{ background: "linear-gradient(135deg, #FEF2F2 0%, #FECACA 100%)", border: "1px solid #FCA5A5", borderRadius: 8, padding: "10px 14px", marginBottom: 8 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#991B1B", marginBottom: 4 }}>📆 지난 계획 미처리 ({overduePlan.length}건)</div>
        {overduePlan.map(t => <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
          <span style={{ fontSize: 10, color: "#DC2626", fontWeight: 600, flexShrink: 0 }}>{fd(t.planDate)}</span>{planItem(t)}
        </div>)}
      </div>}
      {weekPlan.length > 0 && <div style={{ background: "linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 100%)", border: "1px solid #C4B5FD", borderRadius: 8, padding: "10px 14px", marginBottom: 8 }}>
        <div onClick={() => setWeekOpen(!weekOpen)} style={{ fontSize: 13, fontWeight: 600, color: "#6D28D9", marginBottom: weekOpen ? 4 : 0, cursor: "pointer", userSelect: "none", display: "flex", alignItems: "center", gap: 6 }}><span style={{ fontSize: 11 }}>{weekOpen ? "▼" : "▶"}</span> 📆 이번주 계획 ({weekPlan.length}건)</div>
        {weekOpen && weekPlan.map(t => <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
          <span style={{ fontSize: 10, color: "#6D28D9", fontWeight: 600, flexShrink: 0 }}>{fd(t.planDate)}</span>{planItem(t)}
        </div>)}
      </div>}
    </div>
  );
};

/* ═══ 마감 알림 (서브태스크 포함) ═══ */
const ScheduleAlerts = ({ tasks, projects, onEdit }) => {
  const allScheduled = useMemo(() => {
    const items = [];
    tasks.forEach(t => {
      if (t.status !== "done" && t.scheduledDate) items.push({ type: "task", data: t, parent: null });
      (t.subtasks || []).forEach(s => {
        if (s.status !== "done" && s.scheduledDate) items.push({ type: "sub", data: s, parent: t });
      });
    });
    return items;
  }, [tasks]);
  const overdue = allScheduled.filter(i => diffDays(i.data.scheduledDate) < 0).sort((a, b) => a.data.scheduledDate.localeCompare(b.data.scheduledDate));
  const soon = allScheduled.filter(i => { const d = diffDays(i.data.scheduledDate); return d >= 0 && d <= 7; }).sort((a, b) => a.data.scheduledDate.localeCompare(b.data.scheduledDate));
  if (!overdue.length && !soon.length) return null;
  const alertItem = (item) => { /* 컴포넌트가 아니라 함수로 부른다 — 이유는 PlanDateSummary 의 planItem ★주석. 키는 순번이 아니라 id(앞 줄이 빠져도 펼침이 옆 줄로 옮겨 가지 않게) */
    const p = projects.find(x => x.id === (item.type === "task" ? item.data.project : item.parent.project));
    const dl = deadlineInfo(item.data.scheduledDate);
    return (
      <div key={item.data.id} style={{ display: "flex", alignItems: "center", gap: 6, padding: "3px 0", fontSize: 12 }}>
        <span style={S.dlBdg(dl)}>{dl.icon} {dl.label}</span>
        {item.type === "sub" && <span style={{ fontSize: 10, color: "#9ca3af" }}>↳</span>}
        <span style={{ color: "#374151", flex: 1 }}><Clamp text={item.data.text} lines={2} /></span>{/* 요약 줄 제목 = Clamp(2026-10-02 · planItem ★주석) */}
        {p && <span style={{ fontSize: 10, color: "#9ca3af" }}>#{p.name}</span>}
        <button style={{ ...S.gh, fontSize: 10, padding: "1px 5px" }} onClick={() => item.type === "task" ? onEdit(item.data) : onEdit(item.data, item.parent.id)}>✏️</button>
      </div>
    );
  };
  return (
    <div style={{ marginBottom: 12 }}>
      {overdue.length > 0 && <div style={S.alertOverdue}><div style={{ fontSize: 13, fontWeight: 600, color: "#991B1B", marginBottom: 6 }}>🔴 마감 초과 ({overdue.length}건)</div>{overdue.map(item => alertItem(item))}</div>}
      {soon.length > 0 && <div style={S.alertSoon}><div style={{ fontSize: 13, fontWeight: 600, color: "#9A3412", marginBottom: 6 }}>🟡 7일 이내 마감 ({soon.length}건)</div>{soon.map(item => alertItem(item))}</div>}
    </div>
  );
};

/* ═══ 이번 주 루틴 스트립 — 오늘 탭 맨 위 (2026-09-17 부활) ═══
   루틴 세션을 체크하는 **유일한 자리**다. 루틴 세션은 오늘 할 일에 날짜로 뜨지 않는다(isStripRec).
   09-13 루틴 탭을 영역 카드로 합칠 때 이 스트립이 사라졌고, 09-15 에 주N회를 오늘 할 일로 올렸는데
   소유자 실측: 날짜에 박힌 루틴이 「오늘 할 일」을 매번 못 끝낸 것처럼 보이게 했고, 목표를 채워 내려간 뒤에는
   초과분을 누를 자리가 숨어 있었다. → 옛 스트립 모양 그대로 되살리되 **메모 입력은 뺀다**(회고는 영역 카드에서).
   · 항상 전부 보인다 — 채운 것도 ✓ 로 남아 초과 기록을 누를 수 있다.
   · 같은 영역끼리 붙인다(2026-08-11) · 순서는 화면을 열 때 한 번만 정한다(2026-08-09 「누르면 밀려 불편」). */
const WeeklyRoutineStrip = ({ recurrings, projects, tasks, history, onAddSession, onRemoveSession }) => {
  const wk = getWeekId();
  const orderRef = useRef({ wk: "", ids: null }); /* 조기 return 위에 둬야 훅 순서가 안 깨진다 */
  const pool = (recurrings || []).filter(r => !r.disabled && isStripRec(r, projects));
  if (!pool.length) return null;
  const doneSet = routineDoneSet(tasks, history);
  const left = (r) => routineWeekTarget(r) - weekDoneCount(doneSet, r.id, wk);
  const rankCmp = (a, b) => {
    const la = left(a), lb = left(b);
    if ((la > 0) !== (lb > 0)) return la > 0 ? -1 : 1;   /* 미달을 앞으로 */
    if (la !== lb) return lb - la;                        /* 많이 남은 것을 앞으로 */
    return (a.time || "99:99").localeCompare(b.time || "99:99");
  };
  const buildOrder = () => {
    const ord = sortProjsForSelect(projects); /* 남은 개수가 같으면 영역 카드와 같은 순서(PROJ_ORDER · 2026-10-08) */
    const areaIdx = (r) => { const i = ord.findIndex(p => p && p.id === r.project); return i < 0 ? 999 : i; };
    const groups = new Map();
    pool.forEach(r => { const k = r.project || "_none"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
    return Array.from(groups.values())
      .map(g => ({ list: g.slice().sort(rankCmp), left: g.reduce((n, r) => n + Math.max(0, left(r)), 0), idx: areaIdx(g[0]) }))
      .sort((x, y) => (y.left - x.left) || (x.idx - y.idx))
      .reduce((acc, x) => acc.concat(x.list.map(r => r.id)), []);
  };
  if (orderRef.current.wk !== wk) orderRef.current = { wk, ids: null }; /* 주가 바뀌면 재정렬 */
  if (!orderRef.current.ids) orderRef.current.ids = buildOrder();
  const frozen = orderRef.current.ids;
  const items = pool.slice().sort((a, b) => {
    const ia = frozen.indexOf(a.id), ib = frozen.indexOf(b.id);
    if (ia < 0 && ib < 0) return rankCmp(a, b);
    if (ia < 0) return 1; /* 새로 생긴 것은 끝에 붙인다 — 기존 순서를 밀지 않는다 */
    if (ib < 0) return -1;
    return ia - ib;
  });
  return (
    <div style={{ ...S.card, marginBottom: 10, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", padding: "8px 10px" }}>
      <span style={{ fontSize: 12, fontWeight: 600, color: "#6b7280", flexShrink: 0 }}>🔁 이번 주</span>
      {items.map(r => { const tgt = routineWeekTarget(r); const n = weekDoneCount(doneSet, r.id, wk); const hit = n >= tgt;
        return (
          <span key={r.id} className="wk-chip" style={{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 12, background: hit ? "#ECFDF5" : "#FFFBEB", border: "1px solid " + (hit ? "#A7F3D0" : "#FDE68A"), borderRadius: 14, padding: "2px 4px 2px 9px" }}>
            <span style={{ maxWidth: 130, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.text}</span>
            {/* − 자리는 늘 잡아 둔다: 0→1 에서 − 가 새로 생기면 ＋ 가 손가락 밑에서 밀려 연타가 엉뚱한 데를 누른다(미리보기 실측) */}
            <button onClick={() => n > 0 && onRemoveSession(r.id)} disabled={n === 0} title="이번 주 최근 완료 1건 취소(잘못 체크 정정)" style={{ ...S.gh, fontSize: 13, lineHeight: 1, padding: "1px 6px", borderRadius: 10, color: "#DC2626", visibility: n > 0 ? "visible" : "hidden" }}>−</button>
            <b style={{ fontVariantNumeric: "tabular-nums", color: n > tgt ? "#4338CA" : hit ? "#059669" : "#D97706" }} title={n > tgt ? "목표보다 " + (n - tgt) + "회 더 했다" : ""}>{n}/{tgt}</b>
            <button onClick={() => onAddSession(r.id, "")} title={hit ? "한 번 더 했다 — 초과로 기록" : "했음 기록"} style={{ ...S.gh, fontSize: 13, lineHeight: 1, padding: "1px 6px", borderRadius: 10, color: "#059669" }}>＋</button>
          </span>
        );
      })}
    </div>
  );
};

/* ═══ 오늘 뷰 (서브태스크 집중 포함) ═══ */
const TodayView = ({ tasks, projects, recurrings, history, onDone, onDel, onFocus, onAdd, onEdit, onUpdate, onPlanToday, onClearToday, onReorder, onAddSession, onRemoveSession, onDelSub }) => {
  const dragHandlers = useDragReorder(onReorder);


  /* 오늘 할 일 = 수행날짜가 오늘이거나 지난(미완료) — 별(집중)과 무관(2026-06-30). 지난 미완료 루틴 제외.
     날짜가 있으면(미래 포함) 그 날 자동 표출 = 백로그도 특정 시점 surface(someday 상태 폐지 2026-07-04). */
  const onToday = (t) => !!(t.planDate && t.planDate <= TODAY && !isStaleRoutine(t));
  const { focusedTasks, focusedSubs } = useMemo(() => {
    /* ★자동 재정렬 제거(2026-09-07 · 소유자 「나머지는 내가 알아서 정렬할 수 있게」).
       옛 코드는 projSortKey(루틴>프로젝트>버킷>기타) 로 매 렌더마다 다시 줄을 세웠다. 그 값이 네 가지뿐이라
       **다른 무리에 속한 카드끼리는 순서를 바꿀 수 없었다** — 드롭은 성공하는데 카드가 자기 무리 안의
       엉뚱한 자리로 튀거나, 무리에 혼자면 제자리로 돌아왔다. 이제 목록 순서의 정본은 tasks 배열이고,
       그 배열은 손잡이 드래그가 직접 고친다. 과제 종류 정렬은 **과제 선택 드롭다운에만** 남긴다
       (sortProjsForSelect). */
    const ft = tasks.filter(t => t.status !== "done" && onToday(t));
    const fs = [];
    tasks.forEach(t => { (t.subtasks || []).forEach(s => { if (s.status !== "done" && s.planDate && s.planDate <= TODAY) fs.push({ sub: s, parent: t }); }); });
    return { focusedTasks: ft, focusedSubs: fs };
  }, [tasks, projects, recurrings]); /* recurrings dep(2026-07-12): pk→projSortKey→isRoutineProj가 ROUTINE_REC_PROJ_IDS(recurrings 파생) 참조 → 반복 추가/비활성으로 루틴 도출이 바뀔 때 오늘 정렬 즉시 재계산(stale 방지) */
  const totalFocused = focusedTasks.length + focusedSubs.length;
  /* ★전체 현황 = 영역/과제 탭과 같은 카드 순서(areaCards · 2026-10-11 소유자). 같은 카드 안은 저장 순서 그대로(안정 정렬)이고,
     영역 탭에 서지 않는 카드(system · 걷힌 카드 · 카드 없음)는 맨 뒤다. 화면에서만 정렬한다 — tasks 저장 순서는 건드리지 않는다.
     useMemo 로 묶지 않는다: 루틴 판정(projSortKey)이 반복 변경에 따라 바뀌므로 매 렌더 다시 센다(위 recurrings dep 주석). */
  const areaRank = new Map(areaCards(projects).map((p, i) => [p.id, i]));
  const byArea = (a, b) => (areaRank.has(a.project) ? areaRank.get(a.project) : 1e6) - (areaRank.has(b.project) ? areaRank.get(b.project) : 1e6);
  const unfocusedActions = tasks.filter(t => t.status === "action" && !onToday(t) && !isStaleRoutine(t)).sort(byArea);
  const waitingAll = tasks.filter(t => t.status === "waiting" && !onToday(t) && !isStaleRoutine(t)).sort(byArea);
  const [showRest, setShowRest] = useState(false);

  /* 집중 그룹: 일반 task + 서브태스크 통합 */
  const focusGroups = useMemo(() => {
    const groups = {};
    SK.forEach(k => { groups[k] = []; });
    focusedTasks.forEach(t => groups[t.status]?.push({ type: "task", data: t }));
    /* ★하위 항목을 그 상위 항목 **바로 아래**에 넣는다(2026-09-08 · 소유자 실측).
       옛 코드는 상위를 전부 넣은 뒤 하위를 통째로 뒤에 몰아넣었다. 그래서 하위는 목록 끝에 홀로
       떨어졌고, 상위를 끌어 옮겨도 따라오지 않았다. 게다가 하위의 순서 변경은 같은 상위 안에서만
       뜻이 있으므로, 그 상위의 하위가 오늘 하나뿐이면 **옮길 상대가 없어 아예 움직이지 않았다**
       (업무 「기술전문위원회 과제설명회 발표자료 준비」 아래 「질문 리스트 정리, 공유」 1건이 그 경우).
       상위 밑에 붙이면 상위를 옮길 때 하위가 함께 따라가므로 그 자체로 해결된다.
       상위가 같은 상태 그룹에 없으면(상태가 다르거나 상위가 오늘 목록에 없으면) 종전대로 뒤에 붙인다. */
    focusedSubs.forEach(({ sub, parent }) => {
      const g = groups[sub.status];
      if (!g) return;
      const at = g.findIndex(x => x.type === "task" && x.data.id === parent.id);
      if (at < 0) { g.push({ type: "sub", data: sub, parent, underParent: false }); return; }
      let i = at + 1; /* 이미 이 상위에 붙은 하위가 있으면 그 뒤로 */
      while (i < g.length && g[i].type === "sub" && g[i].parent.id === parent.id) i++;
      g.splice(i, 0, { type: "sub", data: sub, parent, underParent: true });
    });
    return SK.map(k => ({ k, label: STATUSES[k].label, items: groups[k] })).filter(g => g.items.length > 0);
  }, [focusedTasks, focusedSubs]);
  /* 오늘 목록에 따로 한 줄로 선 하위 id — 이 탭의 상위 카드(오늘 목록·전체 현황)는 펼쳐도 이 하위를 다시 그리지 않는다(2026-10-02 · TaskRow ★주석).
     focusedSubs 가 아니라 **실제로 그린 것**에서 모은다: 상태 무리가 없어 건너뛴 하위(groups[sub.status] 없음)는 숨기면 어디에도 안 보인다. */
  const todaySubIds = useMemo(() => {
    const ids = new Set();
    focusGroups.forEach(g => g.items.forEach(x => { if (x.type === "sub") ids.add(x.data.id); }));
    return ids;
  }, [focusGroups]);

  const toggleSubInParent = (parentId, subId, field) => {
    const parent = tasks.find(t => t.id === parentId);
    if (!parent || !onUpdate) return;
    if (field === "focus") onUpdate({ ...parent, subtasks: (parent.subtasks || []).map(s => s.id === subId ? { ...s, focus: !s.focus } : s) });
    if (field === "done") {
      const cur = (parent.subtasks || []).find(s => s.id === subId);
      if (cur && cur.status !== "done" ? !doneGuard() : justDone()) return; /* 0.6초 안 두 번째 누름은 무시 */
      onUpdate({ ...parent, subtasks: (parent.subtasks || []).map(s => s.id === subId ? { ...s, status: s.status === "done" ? "action" : "done" } : s) });
    }
  };

  const renderItem = (item) => {
    if (item.type === "task") return <TaskRow inToday onDelSub={onDelSub} key={item.data.id} task={item.data} projects={projects} showProj dragHandlers={dragHandlers} onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} hideSubIds={todaySubIds} />;
    return (
      <div key={item.data.id} style={item.underParent
        /* ★상위 바로 아래에 붙은 하위는 카드를 펼쳤을 때와 **같은 모양**으로 보인다(2026-09-08):
           들여쓰기 + 왼쪽 세로선. 상위 이름을 다시 적는 대신 위치와 선으로 소속을 보인다. */
        ? { marginLeft: 20, borderLeft: "2px solid #d1d5db", paddingLeft: 4 }
        : { paddingLeft: 8 }}>
        {!item.underParent && <div style={{ fontSize: 10, color: "#9ca3af", paddingLeft: 30, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }} title={item.parent.text}>↳ {item.parent.text}</div>}{/* 소속 표시라 한 줄로 자른다 — 상위 제목이 URL 이면 통째로 감겨 몇 줄을 먹었다(2026-10-02) */}
        <SubRow sub={item.data} inToday
          onToggleFocus={() => toggleSubInParent(item.parent.id, item.data.id, "focus")}
          onToggleDone={() => toggleSubInParent(item.parent.id, item.data.id, "done")}
          onDel={() => onDelSub ? onDelSub(item.parent.id, item.data.id) : (onUpdate && onUpdate({ ...item.parent, subtasks: (item.parent.subtasks || []).filter(s => s.id !== item.data.id) }))}
          onEdit={() => onEdit(item.data, item.parent.id)} />
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0" }}>
        <div style={{ fontSize: 13, color: "#6b7280" }}>
          {fd(TODAY)} — 오늘 할 일 <strong style={{ color: "#F59E0B" }}>{totalFocused}</strong>개
          {unfocusedActions.length > 0 && <span> · 다음행동 {unfocusedActions.length}</span>}
          {waitingAll.length > 0 && <span> · 대기중 {waitingAll.length}</span>}
        </div>
      </div>
      {onAddSession && <WeeklyRoutineStrip recurrings={recurrings} projects={projects} tasks={tasks} history={history} onAddSession={onAddSession} onRemoveSession={onRemoveSession} />}
      <PlanDateSummary tasks={tasks} projects={projects} onEdit={onEdit} />
      <ScheduleAlerts tasks={tasks} projects={projects} onEdit={onEdit} />
      <AddForm projects={projects} onAdd={onAdd} />
      {totalFocused > 0 ? (
        <div style={{ marginTop: 16 }}>
          <div style={S.focusBanner}>
            <div style={{ fontSize: 13, fontWeight: 600, color: "#92400E", marginBottom: 4 }}>📆 오늘 할 일 ({totalFocused})</div>
            <div style={{ fontSize: 11, color: "#A16207" }}>수행날짜가 오늘이거나 지난 항목</div>
          </div>
          {focusGroups.map(g => (
            <div key={g.k} style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 11, color: "#9ca3af", fontWeight: 500, padding: "2px 10px", marginBottom: 2 }}>{STATUSES[g.k]?.icon} {g.label}</div>
              {g.items.map(renderItem)}
            </div>
          ))}
        </div>
      ) : (
        <div style={{ ...S.emp, marginTop: 16 }}>할일의 수행날짜(📆)를 오늘로 설정하세요</div>
      )}
      <div style={{ marginTop: 20 }}>
        <div style={{ ...S.secT, cursor: "pointer", userSelect: "none" }} onClick={() => setShowRest(!showRest)}>
          {showRest ? "▼" : "▶"} 전체 현황
          <span style={S.cnt(unfocusedActions.length + waitingAll.length)}>{unfocusedActions.length + waitingAll.length}</span>
        </div>
        {showRest && (
          <div>
            {unfocusedActions.length > 0 && <div style={S.sec}><div style={{ fontSize: 12, fontWeight: 500, color: "#3B82F6", marginBottom: 6 }}>🔵 다음행동 ({unfocusedActions.length})</div>{unfocusedActions.map(t => <TaskRow inToday onDelSub={onDelSub} key={t.id} task={t} projects={projects} showProj onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} hideSubIds={todaySubIds} />)}</div>}
            {waitingAll.length > 0 && <div style={S.sec}><div style={{ fontSize: 12, fontWeight: 500, color: "#F59E0B", marginBottom: 6 }}>⏳ 대기중 ({waitingAll.length})</div>{waitingAll.map(t => <TaskRow inToday onDelSub={onDelSub} key={t.id} task={t} projects={projects} showProj onDone={onDone} onDel={onDel} onFocus={onFocus} onEdit={onEdit} onUpdate={onUpdate} hideSubIds={todaySubIds} />)}</div>}
          </div>
        )}
      </div>
    </div>
  );
};

/* ★새 세션 폼 — 영역 카드 안에서만 연다. 과제 드롭다운이 없는 것이 핵심이다:
   어디서 만들었는지가 곧 소속이라 「이게 어느 영역인가」를 따로 판단할 일이 없다.
   영역 밖의 반복 할일(Weekly Review·업무 잡무)은 오늘 탭에서 만든다. */
const NewSessionForm = ({ projectId, setRecurrings, onClose }) => {
  const [nt, setNt] = useState(""); const [rType, setRType] = useState("count");
  const [ndows, setNdows] = useState([]); const [freqN, setFreqN] = useState(3);
  const [rTime, setRTime] = useState(""); const [rProto, setRProto] = useState("");
  const add = () => {
    if (!nt.trim()) return;
    if (rType === "weekly" && !ndows.length) return;
    const base = { id: gid(), text: nt.trim(), project: projectId, time: rTime || "", protocol: rProto.trim() };
    const rec = rType === "count"
      ? { ...base, type: "count", freqPerWeek: Math.max(1, parseInt(freqN) || 1), dows: [...ndows].sort((a, b) => a - b) }
      : rType === "weekly" ? { ...base, type: "weekly", dows: [...ndows].sort((a, b) => a - b) }
      : { ...base, type: "daily" };
    setRecurrings(p => [...p, rec]);
    onClose();
  };
  return (
    <div style={{ ...S.card, marginTop: 6, background: "#F8FAFF" }}>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
        <input autoFocus value={nt} onChange={e => setNt(e.target.value)} placeholder="세션 이름 (예: 보컬 연습)" style={{ ...S.inp, fontSize: 12, maxWidth: 200 }} />
        <select value={rType} onChange={e => setRType(e.target.value)} style={{ ...S.sel, fontSize: 12 }}>
          <option value="count">주 N회</option><option value="weekly">매주 (요일 고정)</option><option value="daily">매일</option>
        </select>
        {rType === "count" && <div style={{ display: "flex", gap: 3, alignItems: "center" }}>
          <span style={{ fontSize: 11, color: "#6b7280" }}>주</span>
          <input type="number" min="1" max="7" value={freqN} onChange={e => setFreqN(e.target.value)} style={{ ...S.inp, fontSize: 12, width: 46 }} />
          <span style={{ fontSize: 11, color: "#6b7280" }}>회</span></div>}
        {rType !== "daily" && <div style={{ display: "flex", gap: 2, flexWrap: "wrap" }}>
          {DAYS_KO.map((dn, i) => { const on = ndows.includes(i);
            return <button key={i} type="button" onClick={() => setNdows(on ? ndows.filter(x => x !== i) : [...ndows, i])}
              style={{ ...S.gh, fontSize: 11, padding: "2px 7px", background: on ? "#4338CA" : "#fff", color: on ? "#fff" : "#6b7280" }}>{dn}</button>; })}
        </div>}
        <input type="time" value={rTime} onChange={e => setRTime(e.target.value)} style={{ ...S.inp, fontSize: 12, width: 110 }} />
        <button style={{ ...S.btn("#4338CA"), fontSize: 12 }} onClick={add}>추가</button>
        <button style={{ ...S.gh, fontSize: 12 }} onClick={onClose}>취소</button>
      </div>
      <textarea value={rProto} onChange={e => setRProto(e.target.value)} rows={2} placeholder="실행 방법 (선택) — 이 세션에서 무엇을 하는지"
        style={{ ...S.ta, minHeight: 0, fontSize: 12, marginTop: 6 }} />
    </div>
  );
};
const shortUrl = (u) => u.length > 60 ? u.slice(0, 58) + "…" : u;
/* ★메모 속 URL 은 짧은 링크로(2026-10-02 · 소유자 「메모에 url 넣으면 옆으로 튕겨보이고 모바일에서는 갑자기 웹 화면으로 전환되어 보임」).
   전역 줄바꿈(<style> body ★)으로 옆으로 넘치지는 않게 됐지만, 휴대폰 메모 칸(약 150px)에서는 450자 추적 URL 하나가 스무 줄 넘게 감겼다
   (실측: URL 3개 메모 = 높이 914px) — 아래 ★긴 줄 접기 「URL 한 줄이 세 줄로 감기는 것을 막는다」와 어긋난다.
   제목이 URL 일 때(Clamp)와 같은 모양으로 맞춘다: 앞 58자 + …, 누르면 새 창. 전체 주소는 링크와 title 에 그대로 있다.
   주소의 끝: 공백·한글·한글 글의 문장부호(「」『』（）。… 등)에서 끊고(「…/abc에서」의 조사, 「「…」」로 감싼 주소),
   끝에 붙은 영문 문장부호는 링크 밖 글자로 돌린다(「(…/edit)」·「…/x.」). 괄호가 짝이 맞는 「)」는 주소의 일부다(위키 「Foo_(bar)」).
   복사한 주소의 한글·전각 문자는 인코딩돼 있다(실측 2026-10-01 저장본 URL 45개 중 한글 0). */
const URL_RE = /(https?:\/\/[^\sㄱ-ㆎ가-힣「」『』（）【】〈〉《》、。，…“”‘’]+)/g; /* split·replace 에만 쓴다(전역 정규식을 test 에 쓰면 lastIndex 가 남는다) */
const LinkText = ({ text }) => (text || "").split(URL_RE).map((part, i) => {
  if (!(i % 2)) return part;
  let u = part, tail = "";
  while (/[.,;:!?'"\]>)]$/.test(u)) {
    if (u.endsWith(")") && (u.match(/\(/g) || []).length >= (u.match(/\)/g) || []).length) break;
    tail = u.slice(-1) + tail; u = u.slice(0, -1);
  }
  return <React.Fragment key={i}><a href={u} target="_blank" rel="noreferrer" title={u} style={{ color: "#4338CA", wordBreak: "break-all" }}>{shortUrl(u)}</a>{tail}</React.Fragment>;
});
/* ★긴 줄 접기(2026-09-14 소유자) — 메모 한 건이 화면을 다 먹거나 URL 한 줄이 세 줄로 감기는 것을 막는다.
   접힌 상태에서도 첫 줄은 보이므로 무엇인지 알아볼 수 있다. 누르면 펼쳐진다. */
/* ★글 속 URL 도 짧은 링크로(2026-10-02). 회고는 영역 카드(이 Clamp)와 히스토리(LinkText) 두 곳에 보이는데, 여기서는 URL 이
   그대로 감겨 같은 회고가 두 모양이었다(실측: 7줄 회고 중간의 유튜브 주소). 그래서 글 전체를 LinkText 로 그린다.
   통째 링크는 **글 전체가 주소 하나**일 때만 — 옛 조건(주소로 「시작」)은 「주소 + 설명」 글을 통째 링크로 만들어 설명이 사라졌다.
   접기 판단(long)은 화면에 보이는 길이로 잰다 — 긴 주소는 58자로 줄어 보이므로 원문 길이로 재면 괜히 「더보기」가 붙는다. */
const Clamp = ({ text, lines }) => {
  const [open, setOpen] = useState(false);
  const n = lines || 2;
  const shown = (text || "").replace(URL_RE, u => shortUrl(u));
  const long = shown.length > 90 || shown.split(String.fromCharCode(10)).length > n;
  const whole = (text || "").trim().split(URL_RE); /* 주소의 끝은 LinkText 와 같은 기준으로 잰다 — 「주소+조사」 한 덩어리가 통째 링크가 되지 않게 */
  if (whole.length === 3 && !whole[0] && !whole[2]) return <span style={{ fontSize: 12 }}><LinkText text={whole[1]} /></span>;
  if (!long) return <span style={{ whiteSpace: "pre-wrap" }}><LinkText text={text} /></span>;
  return (
    <span>
      <span style={{ whiteSpace: "pre-wrap", display: "-webkit-box", WebkitLineClamp: open ? "unset" : n, WebkitBoxOrient: "vertical", overflow: "hidden" }}><LinkText text={text} /></span>
      <span onClick={() => setOpen(!open)} style={{ fontSize: 11, color: "#6366F1", cursor: "pointer", userSelect: "none" }}>{open ? "▲ 접기" : "▼ 더보기"}</span>
    </span>
  );
};

        console.warn("[Sync] 초기 클라우드 로드 실패 — 클라우드 저장 차단", res.status || "");
        return;
      }
      const cloudData = res.data;
      /* ★2026-07-25(적대검증): RTDB 는 **빈 배열/객체를 저장하지 않는다** → 모든 할일이 완료돼(doneTask 가 tasks[]에서 제거)
         `tasks: []` 를 PUT 하면 /personal/tasks 키 자체가 사라진다. 그러면 `Array.isArray(undefined)=false` 라 이 게이트가
         막혀 **savedAt 정규화와 무관하게 외부 write 를 영구 미채택**했다 — 옛 M3 주석이 표방한 "tasks=[] 도 유효"가
         실제로는 성립하지 않았다(빈 배열은 [] 로 오는 게 아니라 **키가 없어서** 온다).
         유효성의 실제 신호는 `savedAt` 이다(cloudLoad 가 '실패'와 '빈 DB'를 이미 구분해 반환).
         tasks 부재 = 빈 배열로 취급하되, **객체로 온 경우는 계속 거부**(RTDB 희소배열 = 진짜 손상 신호). */
      if (cloudData && cloudData.savedAt && (cloudData.tasks == null || Array.isArray(cloudData.tasks))) {
        const localSaved = lastSavedAtRef.current || normSavedAt(saved?.savedAt); /* ★C2: 마운트 고정이 아니라 '현재까지 저장한' savedAt과 비교 → 오프라인 작업이 옛 클라우드에 안 짐 */
        /* 클라우드가 더 최신이면 reload 없이 메모리에서 직접 채택.
           (예전 reload 방식은 localStorage가 막힌 환경에서 무한 리로드 루프)
           saveToStorage는 여기서 호출하지 않는다 — 아래 자동저장 effect가 상태 변경을 감지해
           한 번만 저장하므로, BACKUP_KEY에 '채택 직전 로컬'이 1세대 보존된다. */
        if (normSavedAt(cloudData.savedAt) > localSaved) { /* ★normSavedAt: 숫자 savedAt이면 NaN 비교로 **항상 false**가 되어 외부 write를 영구 미채택하던 것 차단(§14.7 ②-(c)) */
          console.log("[Sync] 클라우드에서 복원:", cloudData.savedAt);
          const m = migrateData(cloudData);
          setTasks(m.tasks || []);
          setProjects(projList(m.projects) || INIT_PROJECTS);
          setHistory(m.history || []);
          setRecurrings(recList(m.recurrings) || []);
          lastSavedAtRef.current = normSavedAt(cloudData.savedAt); /* 채택했으니 기준도 클라우드 값으로(정규화해 보관 — 이후 비교가 전부 ISO 문자열 기준) */
        }
        /* ★PATCH diff 기준선 = **클라우드의 내용**(채택 여부와 무관). 채택 안 한 경우에도 이게 맞다 —
           다음 저장이 '로컬 vs 클라우드' 차이만 보내므로, 클라우드에만 있는 외부 write 는 건드리지 않는다. */
        setSyncBase(cloudData);
      }
      cloudLoadedRef.current = true;
      setCloudLoaded(true);
      if (el && el.textContent.indexOf("연결실패") >= 0) { el.textContent = "☁️"; el.style.color = "#9ca3af"; }
    });

    const onOnline = () => { if (!cloudLoadedRef.current) tryLoad(); };
    window.addEventListener("online", onOnline);
    return () => { cancelled = true; window.removeEventListener("online", onOnline); };
  }, []); /* eslint-disable-line */

  /* ★M2 완화(2026-07-04): 통짜블롭 LWW라 두 기기 동시 편집 시 lost-update 가능(구조적 한계 — 완전 병합/CRDT는 범위 밖).
     탭이 다시 보일 때 클라우드 savedAt(deep GET)만 싸게 확인 → 우리 마지막 저장보다 최신이면(=다른 기기가 씀) 경고.
     사용자가 새로고침하면 C2 채택 로직으로 안전히 반영. 무성 유실을 '보이는 신호'로 전환. 단일 기기에선 안 뜸. */
  useEffect(() => {
    if (!cloudLoaded) return;
    let checking = false;
    const check = async () => {
      if (document.visibilityState !== "visible" || checking) return;
      checking = true;
      try {
        const q = await authParam();
        const res = await fetch("https://taskmgr-sync-default-rtdb.firebaseio.com/" + WS.fbPath + "/savedAt.json" + q);
        /* ★2026-07-25: 옛 `typeof cs === "string"` 가드는 **숫자 savedAt 을 조용히 무시**했다 → 외부 도구가 숫자로 bump 하면
           채택(L1991)도 경고(여기)도 동시에 죽어 무증상(sweptThrough 유실 8일). normSavedAt 으로 정규화해 경고는 살린다.
           = 결함 B(열린 탭 blob 전체 PUT clobber·구조적 한계)의 **탐지 경로**: 사용자가 새로고침하면 L1991 이 안전하게 채택. */
        if (res.ok) { const cs = normSavedAt(await res.json()); if (cs && cs > (lastSavedAtRef.current || "")) showT("⚠️ 다른 기기에서 변경됨 — 새로고침하면 반영됩니다", null); }
      } catch {} finally { checking = false; }
    };
    document.addEventListener("visibilitychange", check);
    window.addEventListener("focus", check);
    return () => { document.removeEventListener("visibilitychange", check); window.removeEventListener("focus", check); };
  }, [cloudLoaded]); /* eslint-disable-line */

  /* (폐지 2026-06-30) 수행날짜 도래 시 자동 별표(#1) 제거 — 별=집중 업무(날짜 무관)로 의미 전환.

     수행날짜는 유지(있으면 그 날 뜨고 없으면 과제 안 백로그). 자동이월 前 실행. */
  const sodayMigDone = useRef(false);

  /* 지난 미처리 자동 이월(2026-07-01): 미완료 + 수행날짜 지난(비반복) 할일 → 수행날짜 오늘로.
     → '지난 계획 미처리'가 항상 비어 사실상 사라짐(다 오늘 할 일로). 미래 예약·반복/루틴은 안 건드림. */
  /* ★잠금 제거 + tasks 재검사(2026-09-07 · 실측 부분 이월의 원인).
     옛 코드는 `rollFwdDone` 으로 **마운트당 1회**만 돌았다. 그런데 이 앱은 ReactDOM.render(구형)라
     클라우드 응답 안의 상태 갱신들이 한 번에 묶이지 않고 하나씩 반영된다 → 이월이 목록을 훑는 순간
     아직 도착하지 않은 항목은 그 회차에서 빠지고, 잠금 때문에 **다시는 검사받지 못한다.**
     실측(2026-09-07 업무): 15건 중 12건만 이월되고 3건이 남았으며, 그 3건의 날짜는 이전 회차에서
     하루만 옮겨진 09-05 였다(개인도 27건 중 1건이 같은 상태). 즉 매번 몇 건씩 흘리고 있었다.
     → 잠금을 없애고 `tasks` 를 의존성에 넣어 **남은 것이 없을 때까지** 확인한다.
     루프 위험 없음: 이월할 게 없으면 아래 `!stale.length` 에서 즉시 반환하고, 이월된 항목은
     다음 회차에 stale 이 아니라 */
  useEffect(() => {
    if (!cloudLoaded) return;
    const isStaleP = (t) => t.status !== "done" && !t.recurringId && t.planDate && t.planDate < TODAY; /* 수행날짜 지난 미완료(비반복)만 이월. 날짜 없는 백로그는 대상 아님 */
    const isStaleS = (s) => s.status !== "done" && s.planDate && s.planDate < TODAY; /* ★minor(2026-07-04): 서브태스크도 이월(배너·오늘에 방치되던 것) */
    const stale = tasks.filter(isStaleP);
    const staleS = []; tasks.forEach(t => { if (t.recurringId) return; (t.subtasks || []).forEach(s => { if (isStaleS(s)) staleS.push({ parent: t, s }); }); });
    if (!stale.length && !staleS.length) return;
    setTasks(p => p.map(t => {
      let nt = isStaleP(t) ? { ...t, planDate: TODAY } : t;
      if (!t.recurringId && (nt.subtasks || []).some(isStaleS)) nt = { ...nt, subtasks: nt.subtasks.map(s => isStaleS(s) ? { ...s, planDate: TODAY } : s) };
      return nt;
    }));
  }, [cloudLoaded, tasks]); /* eslint-disable-line */

  /* ★PDS 시스템 합치기(2026-10-11 소유자 「그냥 PDS 시스템이라고 프로젝트 명을 하고, 이 루프가 잘 돌게끔 하는 것을 목적으로한 프로젝트라고 정의」 ·

     ② 「🗓️ 주간 정제」 카드(p_sweep)의 반복·할 일을 PDS 시스템(p_b464zvu)으로 옮기고, 옛 이름이면 「🗓️ Weekly Review」로 바꾼다.

    const move = (x) => (x && x.project === FROM) ? { ...x, project: TO, text: OLD_TEXT.test(x.text || "") ? NEW_TEXT : x.text } : x;
    setProjects(prev => { let ch = false; const n = prev.map(p => (p && p.id === TO && p.name === "PDS 시스템 개선") ? (ch = true, { ...p, name: "PDS 시스템" }) : p); return ch ? n : prev; });
    setRecurrings(prev => (prev || []).some(r => r && r.project === FROM) ? (prev || []).map(move) : prev);
    setTasks(prev => (prev || []).some(t => t && t.project === FROM) ? (prev || []).map(move) : prev);

      const merged = [...canonical, ...extra];

  /* 개인 버킷·Track2 미러 완전 제거(2026-07-01, 소유자 지시): 개인 워크스페이스 = 루틴/프로젝트만.

    setRecurrings(prev => prev.map(r => (T[r.id] && r.type !== "count") ? { ...r, type: "count", freqPerWeek: T[r.id], dows: (r.dows && r.dows.length) ? r.dows : (r.dow != null ? [r.dow] : (DEF_DOWS[r.id] || [])) } : r));

    setTasks(prev => { let ch = false; const n = prev.map(t => (t.project === "p_routine" && t.recurringId && RID.has(t.recurringId)) ? (ch = true, { ...t, project: t.recurringId }) : t); return ch ? n : prev; });

     정본(PERSONAL_PROJECTS) id로 옮기고 중복 과제 제거. 정본 id로 합치는 것만(임의 병합 방지). */

     ⛔ **메모가 있으면 남긴다** — 그 회차에 적어 둔 것을 지우는 셈이 된다. 빈 것만 지운다. */
  const stalePruneDone = useRef(false);
  useEffect(() => {
